<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA v13.2 - Fix Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #040c1a; color: #fff; margin:0; overflow: hidden; height: 100vh; }
        
        .bg-bbva-card { background: var(--bbva-navy); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2.2rem; border: 1px solid rgba(0, 229, 255, 0.2); }

        .gasto-item { background: rgba(7, 33, 70, 0.5); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); padding: 1.2rem; margin-bottom: 0.8rem; }
        .futuro-item { border: 1px dashed rgba(0, 229, 255, 0.4); background: rgba(0, 68, 129, 0.1); }

        .action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.8rem; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        
        /* Navegación Fija */
        .nav-btn { color: #64748b; transition: 0.3s; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .active-tab { color: var(--bbva-cyan) !important; }
        
        .hidden { display: none !important; }
        .scroll-area { height: calc(100vh - 220px); overflow-y: auto; padding-bottom: 100px; }
        
        .bbva-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.2rem; padding: 1rem; width: 100%; color: white; outline: none; }
    </style>
</head>
<body>

    <div id="pin-screen" class="fixed inset-0 bg-[#040c1a] z-[9999] flex flex-col items-center justify-center">
        <h1 class="text-4xl font-[900] italic text-white opacity-20 mb-12">BBVA</h1>
        <div id="pin-dots" class="flex gap-5 mb-16"><div class="w-3 h-3 rounded-full border-2 border-cyan-400"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400"></div></div>
        <div id="pin-pad" class="grid grid-cols-3 gap-6"></div>
    </div>

    <div id="app-content" class="hidden h-full flex flex-col">
        <header class="p-6 flex justify-between items-center">
            <h1 class="font-[900] text-2xl italic tracking-tighter">BBVA</h1>
            <div class="flex gap-2">
                <button onclick="togglePrivacy()" class="action-btn">👁️</button>
                <button onclick="location.reload()" class="action-btn">🔒</button>
            </div>
        </header>

        <main class="flex-1 px-4 overflow-hidden">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-4">
                <div class="p-8 bbva-gradient text-center">
                    <p class="text-[10px] font-black tracking-widest text-cyan-200/50 mb-1 uppercase">Saldo Hoy</p>
                    <h2 id="valReal" class="text-5xl font-[900] tracking-tighter">0.00€</h2>
                </div>
                <div class="bg-bbva-card p-6 flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-black text-slate-400 uppercase">Estimado Mes</p>
                        <h2 id="valProyectado" class="text-2xl font-[900] text-cyan-400">0.00€</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-black text-slate-400 uppercase">A pagar</p>
                        <p id="valPendiente" class="text-lg font-bold text-rose-400">0.00€</p>
                    </div>
                </div>
                <div class="h-[150px]"><canvas id="chartGastos"></canvas></div>
            </section>

            <section id="tab-pasado" class="tab-content hidden h-full">
                <div class="px-2 mb-4 text-[10px] font-black text-slate-500 uppercase">Movimientos Reales</div>
                <div id="listaPasado" class="scroll-area"></div>
            </section>

            <section id="tab-futuro" class="tab-content hidden h-full">
                <div class="px-2 mb-4 text-[10px] font-black text-cyan-400 uppercase italic">Próximos recibos</div>
                <div id="listaFuturo" class="scroll-area"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-6">
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="in-id">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-3xl font-black" required>
                        <select id="in-categoria" class="bbva-input font-bold">
                            <option value="💰 Sueldo">💰 Sueldo</option>
                            <option value="🟦 Tarjeta">🟦 Tarjeta</option>
                            <option value="⛽ Gasolina">⛽ Gasolina</option>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input">
                        <button type="submit" class="w-full bg-cyan-400 text-black font-900 py-4 rounded-2xl uppercase text-[10px] tracking-widest">Guardar</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="bg-[#040c1a] border-t border-white/10 flex justify-around p-4 pb-8">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn active-tab"><span class="text-xl">🏠</span><span class="text-[7px] font-black uppercase">Home</span></button>
            <button onclick="switchTab('tab-pasado', this)" class="nav-btn"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Pasado</span></button>
            <button onclick="switchTab('tab-futuro', this)" class="nav-btn"><span class="text-xl">⏳</span><span class="text-[7px] font-black uppercase">Futuro</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Add</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let appData = [], currentPin = "", isPrivate = false, mainChart = null;

        // PIN PAD
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button');
            b.className = "w-16 h-16 rounded-full border border-white/10 text-xl font-bold flex items-center justify-center active:bg-cyan-400 active:text-black";
            b.innerText = v;
            b.onclick = () => {
                if(v === 'C') currentPin = "";
                else if(v === 'DEL') currentPin = currentPin.slice(0,-1);
                else if(currentPin.length < 4) currentPin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < currentPin.length ? '#00e5ff' : 'transparent');
                if(currentPin === "1234") { document.getElementById('pin-screen').style.display='none'; document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        });

        async function renderApp() {
            const res = await fetch(API_URL);
            appData = await res.json();
            const hoy = new Date().toISOString().split('T')[0];
            let real = 0, proj = 0, pendiente = 0, cats = {};
            
            const lPasado = document.getElementById('listaPasado'), lFuturo = document.getElementById('listaFuturo');
            lPasado.innerHTML = ''; lFuturo.innerHTML = '';

            appData.sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(g => {
                const val = parseFloat(g.importe);
                const esIng = g.categoria.includes("Sueldo");
                const esPasado = g.fecha <= hoy;
                
                if(esPasado) esIng ? real += val : real -= val;
                else if(!esIng) pendiente += val;
                esIng ? proj += val : proj -= val;

                const item = `
                    <div class="gasto-item ${!esPasado ? 'futuro-item' : ''}">
                        <div class="flex justify-between items-center">
                            <div class="flex-1">
                                <p class="text-sm font-bold text-white">${g.concepto}</p>
                                <p class="text-[9px] text-slate-500 font-bold uppercase">${g.fecha} • ${g.categoria}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <p class="text-base font-[900] ${esIng ? 'text-cyan-400' : 'text-white'}">${isPrivate ? '****' : val.toFixed(2)}€</p>
                                <button onclick="deleteGasto('${g._id}')" class="action-btn text-rose-500/30 text-[10px]">🗑️</button>
                            </div>
                        </div>
                    </div>`;

                if(esPasado) lPasado.insertAdjacentHTML('afterbegin', item);
                else lFuturo.insertAdjacentHTML('beforeend', item);
                
                if(!esIng && esPasado) { const c = g.categoria.split(' ').pop(); cats[c] = (cats[c]||0) + val; }
            });

            document.getElementById('valReal').innerText = isPrivate ? "****€" : real.toLocaleString('de-DE')+"€";
            document.getElementById('valProyectado').innerText = isPrivate ? "****€" : proj.toLocaleString('de-DE')+"€";
            document.getElementById('valPendiente').innerText = isPrivate ? "****€" : "-"+pendiente.toLocaleString('de-DE')+"€";
            drawChart(cats);
        }

        async function deleteGasto(id) { if(confirm('¿Borrar?')) { await fetch(`${API_URL}/${id}`, {method:'DELETE'}); renderApp(); } }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: Object.keys(data), datasets: [{ data: Object.values(data), backgroundColor: 'rgba(0, 229, 255, 0.4)', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#475569', font: { size: 8 } } } } }
            });
        }

        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            el.classList.add('active-tab');
            document.getElementById(id).classList.remove('hidden');
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                concepto: document.getElementById('in-concepto').value,
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            e.target.reset(); renderApp(); switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
        });

        function togglePrivacy() { isPrivate = !isPrivate; renderApp(); }
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
