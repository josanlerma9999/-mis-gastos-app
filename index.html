<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v11.4 - Categorías Reales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; overflow-x: hidden; }
        
        /* BORDES 2.5rem */
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 2.5rem; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2.5rem; }
        
        .bbva-input { background-color: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem; padding: 0.85rem 1.1rem; width: 100%; color: white; outline: none; }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN SCREEN */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        .btn-action { width: 44px; height: 44px; border-radius: 0.8rem; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
        
        /* Margen para que el botón Confirmar no se pise */
        #tab-add { padding-bottom: 140px; }
    </style>
</head>
<body class="pb-24">

    <div id="pin-screen">
        <div class="text-center mb-8"><h1 class="text-4xl font-[900] italic text-[#00e5ff] tracking-tighter">BBVA</h1></div>
        <div class="flex mb-12" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] font-bold opacity-30">Reset</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="deleteLast()" class="text-[10px] font-bold opacity-30">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 sticky top-0 z-50 flex justify-between items-center bg-black/95 backdrop-blur-sm border-b border-white/5">
            <div class="flex flex-col">
                <h1 class="font-[900] text-2xl italic text-white leading-none">BBVA</h1>
                <span class="text-[10px] font-bold text-[#00e5ff] mt-1 tracking-widest uppercase">v11.4</span>
            </div>
            <div class="flex gap-2">
                <button onclick="togglePrivacy()" id="privacy-icon" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-full border border-white/10 text-lg">👁️</button>
                <button onclick="location.reload()" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-full border border-white/10 text-lg">🔒</button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-4">
                <div class="p-8 bbva-gradient shadow-2xl border border-white/10 text-center">
                    <p class="text-[10px] uppercase font-black tracking-widest text-cyan-300/60 mb-2">Patrimonio Neto Actual</p>
                    <h2 id="valReal" class="text-4xl font-[900] tracking-tighter text-white">0.00€</h2>
                </div>
                <div class="bg-bbva-card p-6 flex flex-col items-center">
                    <div class="h-[200px] w-full flex justify-center items-center"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-3 w-full mt-6"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-3">
                <div class="bg-bbva-card p-4 flex justify-between items-center mb-2">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-bold outline-none text-sm" onchange="renderApp()">
                </div>
                <div id="listaMes" class="space-y-3"></div>
            </section>

            <section id="tab-add" class="tab-content hidden flex flex-col">
                <div class="bg-bbva-card p-6 shadow-2xl mb-10">
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="in-id">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-3xl font-black" required>
                        <select id="in-categoria" class="bbva-input">
                            <optgroup label="INGRESOS">
                                <option value="Sueldo">💰 Sueldo</option>
                                <option value="Otros Ingresos">💵 Otros Ingresos</option>
                            </optgroup>
                            <optgroup label="GASTOS / CUENTAS">
                                <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                                <option value="Tarjeta Aqua BBVA">🟦 Tarjeta Aqua BBVA</option>
                                <option value="Tarjeta Explora">✈️ Tarjeta Explora</option>
                                <option value="Imagine">📱 Imagine</option>
                                <option value="PayPal">💳 PayPal</option>
                                <option value="Amazon">📦 Amazon</option>
                                <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                                <option value="Gasolina">⛽ Gasolina</option>
                            </optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input">
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-slate-900 font-[900] py-4 rounded-2xl uppercase text-[11px] tracking-widest active:scale-95 transition-all mt-4 shadow-lg shadow-cyan-400/20">
                            Confirmar Operación
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-md border-t border-white/10 flex justify-around p-4 pb-8 z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab"><span class="text-xl">🏦</span><span class="text-[8px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">📋</span><span class="text-[8px] font-black uppercase">Extracto</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">➕</span><span class="text-[8px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let appData = [], currentPinInput = "", isPrivate = false, mainChart = null;
        const listaIngresos = ["Sueldo", "Otros Ingresos"];

        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(currentPinInput === (localStorage.getItem('bbva_user_pin') || "1234")) unlock();
                    else { alert("PIN INCORRECTO"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('privacy-icon').innerText = isPrivate ? '🙈' : '👁️'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoyStr = new Date().toISOString().split('T')[0];
                const mesSel = document.getElementById('filtroMes').value;
                let real = 0, cats = {};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML = '';

                appData.forEach(g => {
                    const val = parseFloat(g.importe);
                    const esIngreso = listaIngresos.includes(g.categoria);
                    if (g.fecha <= hoyStr) esIngreso ? (real += val) : (real -= val);
                    if (g.fecha.startsWith(mesSel)) {
                        if(!esIngreso) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        const disp = isPrivate ? "****€" : val.toFixed(2) + '€';
                        lMes.innerHTML += `
                            <div class="bg-bbva-card p-5 flex justify-between items-center border-l-4 ${esIngreso ? 'border-cyan-400' : 'border-rose-500'}">
                                <div><p class="font-bold text-white">${g.concepto}</p><p class="text-[10px] text-slate-500 font-black uppercase">${g.categoria}</p></div>
                                <div class="flex items-center gap-3"><p class="font-black text-lg ${esIngreso ? 'text-cyan-400' : 'text-rose-400'}">${disp}</p>
                                <div class="flex gap-2"><button onclick="preEdit('${g._id}')" class="btn-action text-cyan-400">✏️</button>
                                <button onclick="deleteGasto('${g._id}')" class="btn-action text-rose-500">🗑️</button></div></div></div>`;
                    }
                });
                document.getElementById('valReal').innerText = isPrivate ? "****€" : real.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(data), datasets: [{ data: Object.values(data), backgroundColor: ['#004481','#00e5ff','#8b5cf6','#10b981','#f59e0b','#ef4444','#3b82f6'], borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = Object.keys(data).map(l => `<div class="bg-white/5 p-3 rounded-2xl flex justify-between items-center"><span class="text-[9px] font-bold text-slate-400 uppercase">${l}</span><span class="text-xs font-black text-white">${isPrivate ? "***" : data[l].toFixed(0) + '€'}</span></div>`).join('');
        }

        window.preEdit = function(id) {
            const g = appData.find(x => x._id === id);
            if(!g) return;
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            document.getElementById('btn-submit').innerText = "Actualizar Registro";
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        };

        window.deleteGasto = async function(id) {
            if(confirm("¿Borrar registro?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); }
        };

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
            if(id !== 'tab-add') { document.getElementById('mainForm').reset(); document.getElementById('in-id').value = ""; document.getElementById('btn-submit').innerText = "Confirmar Operación"; }
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(id ? `${API_URL}/${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            renderApp(); switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
