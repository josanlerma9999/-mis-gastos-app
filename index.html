<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v16.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.1s ease;
        }
        .num-btn:active { background: var(--bbva-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--bbva-cyan); transform: scale(0.9); } 

        .bbva-card { background: var(--bbva-navy); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: #ffffff; border: none; border-radius: 1rem; padding: 1rem; width: 100%; color: #072146; font-weight: 800; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; touch-action: pan-y; background: #000;}
        /* Ajuste para 6 pestañas: 600% */
        #main-view { display: flex; width: 600%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        /* Cada pestaña ocupa 1/6 del total */
        .tab-content { width: 16.666%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
        
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }
        .chart-container { position: relative; height: 180px; width: 100%; margin-top: 0.5rem; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header> 

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-lg">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-4xl font-black tracking-tighter">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Saldo Final</p>
                            <p id="valProj" class="text-xl font-bold text-cyan-400 mt-1">0.00€</p>
                        </div>
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Próximos Pagos</p>
                            <p id="valPend" class="text-xl font-bold text-rose-400 mt-1">0.00€</p>
                        </div>
                    </div>
                    <div class="bbva-card p-4 shadow-xl">
                        <h3 class="text-[10px] font-bold text-white uppercase tracking-widest mb-1">Distribución</h3>
                        <div class="chart-container"><canvas id="gastosChart"></canvas></div>
                    </div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Previsión de Pagos</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Suscripciones y Pagos Fijos</h3>
                    <div id="listaRecurrentes" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <input type="month" id="filtroMes" class="bbva-input mb-6" onchange="actualizarInterfaz()">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Movimientos</h3>
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section>

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4 shadow-xl">
                        <h2 class="text-xs font-black uppercase text-cyan-400 tracking-widest mb-2">Nueva Operación</h2>
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-3xl text-center font-bold" required>
                        <select id="in-categoria" class="bbva-input font-bold" required>
                            <optgroup label="INGRESOS">
                                <option value="Sueldo">💰 Sueldo</option>
                                <option value="Otros Ingresos">💵 Otros Ingresos</option>
                            </optgroup>
                            <optgroup label="GASTOS">
                                <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                                <option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option>
                                <option value="Tarjeta Explora">💳 Tarjeta Explora</option>
                                <option value="PayPal">💙 PayPal</option> 
                                <option value="Amazon">📦 Amazon</option>
                                <option value="Gasolina">⛽ Gasolina</option>
                                <option value="Imagine">📱 Imagine</option>
                                <option value="Varios">🛍️ Varios</option>
                            </optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10">
                            <input type="checkbox" id="check-recurrente" class="w-5 h-5 accent-cyan-400">
                            <label for="check-recurrente" class="text-[10px] font-black uppercase text-slate-400">Convertir en pago fijo mensual</label>
                        </div> 
                        <button type="submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section>

                <section class="tab-content space-y-6">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest text-center">Mis Tarjetas</h3>
                    <div class="space-y-6 pb-20">
                        <div class="relative overflow-hidden rounded-2xl p-6 h-48 shadow-2xl bg-gradient-to-br from-[#004481] to-[#043263] border border-blue-400/20">
                            <div class="flex justify-between items-start">
                                <span class="text-white/90 text-sm font-bold tracking-[0.2em]">EXPLORA</span>
                                <span class="text-white/40 text-[10px]">•••• 1234</span>
                            </div>
                            <div class="mt-8">
                                <p class="text-blue-200/50 text-[9px] uppercase font-bold tracking-widest">Próximo Recibo</p>
                                <h3 id="deuda-explora-v" class="text-white text-3xl font-light mt-1">0,00€</h3>
                            </div>
                            <div class="absolute bottom-4 right-6"><span class="text-white/10 text-2xl font-black italic">VISA</span></div>
                        </div>
                        <div class="relative overflow-hidden rounded-2xl p-6 h-48 shadow-2xl bg-gradient-to-br from-[#1e293b] to-[#0f172a] border border-gray-700/50">
                            <div class="flex justify-between items-start">
                                <span class="text-white/90 text-sm font-bold tracking-[0.2em] italic uppercase">Aqua</span>
                                <span class="text-white/40 text-[10px]">•••• 5678</span>
                            </div>
                            <div class="mt-8">
                                <p class="text-gray-400/50 text-[9px] uppercase font-bold tracking-widest">Gasto Acumulado</p>
                                <h3 id="deuda-aqua-v" class="text-white text-3xl font-light mt-1">0,00€</h3>
                            </div>
                            <div class="absolute bottom-4 right-6"><span class="text-white/5 text-2xl font-black italic">MasterCard</span></div>
                        </div>
                    </div>
                </section>
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center gap-1"><span class="text-xl">🏠</span><span class="text-[8px] uppercase">Inicio</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">⏳</span><span class="text-[8px] uppercase">Previsión</span></button>
            <button onclick="goToTab(2)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">🔄</span><span class="text-[8px] uppercase">Fijos</span></button> 
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">📋</span><span class="text-[8px] uppercase">Movs</span></button>
            <button onclick="goToTab(4)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">➕</span><span class="text-[8px] uppercase">Operar</span></button>
            <button onclick="goToTab(5)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">💳</span><span class="text-[8px] uppercase">Tarjetas</span></button>
        </nav>
    </div> 

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let touchstartX = 0, touchendX = 0, currentTabIndex = 0;
        let pin = "", isPrivate = false, appData = [];
        const categIngresos = ["Sueldo", "Otros Ingresos"];
        let gastosChart = null; 

        // PIN PAD
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        }); 

        function goToTab(i) {
            currentTabIndex = i;
            // Ahora dividimos por 6 (cada pestaña es 16.66% del 600%)
            document.getElementById('main-view').style.transform = `translateX(-${i * (100/6)}%)`;
            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
            if(i === 0) setTimeout(updateChart, 100);
        } 

        async function renderApp() {
            const cache = localStorage.getItem('appData_cache');
            if (cache) { appData = JSON.parse(cache); actualizarInterfaz(); } 
            try {
                const res = await fetch(API_URL); 
                const dataFresh = await res.json();
                appData = dataFresh;
                localStorage.setItem('appData_cache', JSON.stringify(appData));
                actualizarInterfaz();
            } catch (e) { console.error("Error cargando datos"); }
        } 

        function obtenerLogo(concepto) {
            const c = concepto.toLowerCase();
            const reglas = [
                ['gasto explora', '#004481', '💳'], ['gasto aqua', '#1e293b', '💳'],
                ['amazon', '#FF9900', 'A'], ['sueldo', '#22c55e', '€'], ['gasolina', '#4b5563', '⛽']
            ];
            const match = reglas.find(r => c.includes(r[0]));
            if (match) return `<div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg" style="background:${match[1]}">${match[2]}</div>`;
            return `<div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg bg-slate-700">${concepto.charAt(0).toUpperCase()}</div>`;
        }

        function actualizarInterfaz() {
            const hoy = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value;
            let saldoReal = 0, gFuturos = 0, iFuturos = 0;
            let dExplora = 0, dAqua = 0;
            
            document.getElementById('listaPasado').innerHTML = '';
            document.getElementById('listaFuturo').innerHTML = ''; 

            appData.forEach(g => {
                const val = Math.abs(parseFloat(g.importe)), esI = categIngresos.includes(g.categoria), esP = g.fecha <= hoy;
                
                // Cálculo de deudas tarjetas
                if (g.concepto.toLowerCase().includes('gasto explora')) dExplora += val;
                if (g.concepto.toLowerCase().includes('gasto aqua')) dAqua += val;

                if(esP) { esI ? saldoReal += val : saldoReal -= val; } 
                else { esI ? iFuturos += val : gFuturos += val; }
                
                if(g.fecha.startsWith(mesSel)) {
                    document.getElementById('listaPasado').insertAdjacentHTML('beforeend', `
                        <div class="bbva-card p-4 flex justify-between items-center mb-2">
                            <div class="flex items-center gap-3">${obtenerLogo(g.concepto)}
                                <div><p class="text-sm font-bold">${g.concepto}</p><p class="text-[9px] text-slate-500">${g.fecha}</p></div>
                            </div>
                            <p class="font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI?'+':'-'}${isPrivate?'****€':val.toFixed(2)+'€'}</p>
                        </div>`);
                }
            });

            document.getElementById('valReal').innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE') + "€";
            document.getElementById('deuda-explora-v').innerText = isPrivate ? "****€" : dExplora.toLocaleString('de-DE') + "€";
            document.getElementById('deuda-aqua-v').innerText = isPrivate ? "****€" : dAqua.toLocaleString('de-DE') + "€";
            
            updateChart();
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                concepto: document.getElementById('in-concepto').value,
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            e.target.reset(); renderApp(); goToTab(0);
        };

        function updateChart() {
            const ctx = document.getElementById('gastosChart')?.getContext('2d');
            if(!ctx) return;
            if (gastosChart) gastosChart.destroy();
            gastosChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Gastos'], datasets: [{ data: [100], backgroundColor: ['#00e5ff'] }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
