<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v18.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.1s ease;
        }
        .num-btn:active { background: var(--bbva-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--bbva-cyan); transform: scale(0.9); } 

        .bbva-card { background: var(--bbva-navy); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: #ffffff; border: none; border-radius: 1rem; padding: 1rem; width: 100%; color: #072146; font-weight: 800; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; touch-action: pan-y; background: #000;}
        #main-view { display: flex; width: 600%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 16.666%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
        
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }
        .chart-container { position: relative; height: 180px; width: 100%; margin-top: 0.5rem; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* TARJETAS PREMIUM */
        .card-real { position: relative; height: 180px; border-radius: 1.2rem; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; }
        .card-aqua { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255,255,255,0.1); }
        .card-explora { background: linear-gradient(135deg, #004481 0%, #072146 100%); border: 1px solid rgba(0,229,255,0.2); }
        .chip { width: 35px; height: 26px; background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); border-radius: 4px; opacity: 0.8; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header> 

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-lg">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-4xl font-black tracking-tighter text-cyan-400">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Saldo Final</p>
                            <p id="valProj" class="text-xl font-bold text-cyan-400 mt-1">0.00€</p>
                        </div>
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Próximos Pagos</p>
                            <p id="valPend" class="text-xl font-bold text-rose-400 mt-1">0.00€</p>
                        </div>
                    </div>
                    <div class="bbva-card p-4 shadow-xl">
                        <h3 class="text-[10px] font-bold text-white uppercase tracking-widest mb-1">Distribución</h3>
                        <div class="chart-container"><canvas id="gastosChart"></canvas></div>
                    </div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Previsión de Pagos</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Fijos y Suscripciones</h3>
                    <div id="listaRecurrentes" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <input type="month" id="filtroMes" class="bbva-input mb-6" onchange="actualizarInterfaz()">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Movimientos</h3>
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section>

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4">
                        <h2 class="text-xs font-black uppercase text-cyan-400">Nueva Operación</h2>
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-2xl font-bold" required>
                        <select id="in-categoria" class="bbva-input font-bold" required>
                            <optgroup label="INGRESOS"><option value="Sueldo">💰 Sueldo</option></optgroup>
                            <optgroup label="GASTOS">
                                <option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option>
                                <option value="Tarjeta Explora">💳 Tarjeta Explora</option>
                                <option value="Gasolina">⛽ Gasolina</option>
                                <option value="Varios">🛍️ Varios</option>
                            </optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <button type="submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section>

                <section class="tab-content space-y-6">
                    <h3 class="text-xs font-bold text-slate-400 uppercase text-center tracking-widest">Mis Tarjetas Premium</h3>
                    <div class="card-real card-explora">
                        <div class="flex justify-between items-start"><div class="chip"></div><span class="italic font-black text-white">BBVA</span></div>
                        <div><p class="text-blue-200/50 text-[10px] uppercase font-bold">Explora Crédito</p><h3 id="card-explora-val" class="text-white text-3xl font-light">0,00€</h3></div>
                        <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 8823</span><span class="text-white/20 text-xl font-black italic">VISA</span></div>
                    </div>
                    <div class="card-real card-aqua">
                        <div class="flex justify-between items-start"><div class="chip" style="filter:grayscale(1)"></div><span class="italic font-black text-white">BBVA</span></div>
                        <div><p class="text-slate-400 text-[10px] uppercase font-bold">Aqua Débito</p><h3 id="card-aqua-val" class="text-cyan-400 text-3xl font-light">0,00€</h3></div>
                        <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 4412</span><span class="text-white/10 text-xl font-black italic">Mastercard</span></div>
                    </div>
                </section>
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center"><span class="text-xl">🏠</span><span class="text-[8px]">INICIO</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">⏳</span><span class="text-[8px]">PROX</span></button>
            <button onclick="goToTab(2)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">🔄</span><span class="text-[8px]">FIJOS</span></button> 
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">📋</span><span class="text-[8px]">MOVS</span></button>
            <button onclick="goToTab(4)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">➕</span><span class="text-[8px]">OPERAR</span></button>
            <button onclick="goToTab(5)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">💳</span><span class="text-[8px]">CARDS</span></button>
        </nav>
    </div> 

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let pin = "", isPrivate = false, appData = [], currentTabIndex = 0, gastosChart = null;
        const categIngresos = ["Sueldo", "Otros Ingresos"];

        // PIN LOGIC
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        });

        function goToTab(i) {
            currentTabIndex = i;
            document.getElementById('main-view').style.transform = `translateX(-${i * 16.666}%)`;
            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
            if(i === 0) setTimeout(updateChart, 100);
        }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                actualizarInterfaz();
            } catch (e) { console.error("Error API"); }
        }

        function obtenerLogo(concepto) {
            const c = concepto.toLowerCase();
            const reglas = [
                ['nala', '#FFC0CB', '🐶'], ['amazon', '#FF9900', 'A'], ['mercadona', '#00a650', 'M'],
                ['sueldo', '#22c55e', '€'], ['gasolina', '#4b5563', '⛽'], ['tarjeta', '#00e5ff', '💳']
            ];
            const match = reglas.find(r => c.includes(r[0]));
            if (match) return `<div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-lg shadow-lg" style="background:${match[1]}">${match[2]}</div>`;
            return `<div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-lg bg-slate-700 shadow-lg">${concepto.charAt(0).toUpperCase()}</div>`;
        }

        function actualizarInterfaz() {
            const hoy = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value;
            let saldoReal = 0, gFuturos = 0, iFuturos = 0, dExplora = 0, dAqua = 0;
            
            const listaPasado = document.getElementById('listaPasado');
            const listaFuturo = document.getElementById('listaFuturo');
            listaPasado.innerHTML = ''; listaFuturo.innerHTML = '';

            appData.sort((a, b) => b.fecha.localeCompare(a.fecha));

            appData.forEach(g => {
                const val = Math.abs(parseFloat(g.importe)), esI = categIngresos.includes(g.categoria), esP = g.fecha <= hoy;
                const conc = g.concepto.toLowerCase();

                if(conc.includes('explora')) dExplora += val;
                if(conc.includes('aqua')) dAqua += val;

                if(esP) { esI ? saldoReal += val : saldoReal -= val; } 
                else { esI ? iFuturos += val : gFuturos += val; }

                const rowHTML = `
                    <div class="bbva-card p-4 flex justify-between items-center gap-3 ${!esP ? 'opacity-40 border-l-4 border-cyan-400' : ''}">
                        <div class="flex items-center gap-3 flex-1 overflow-hidden">
                            ${obtenerLogo(g.concepto)}
                            <div class="truncate"><p class="text-sm font-bold text-white truncate">${g.concepto}</p><p class="text-[9px] text-slate-500 uppercase mt-1">${g.fecha}</p></div>
                        </div>
                        <p class="font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI ? '+' : '-'}${isPrivate ? '****' : val.toFixed(2)}€</p>
                    </div>`;

                if(g.fecha.startsWith(mesSel)) listaPasado.insertAdjacentHTML('beforeend', rowHTML);
                if(!esP) {
                    listaPasado.insertAdjacentHTML('beforeend', rowHTML); // Mostrar al final de movimientos
                    listaFuturo.insertAdjacentHTML('afterbegin', rowHTML); // También en pestaña Previsión
                }
            });

            document.getElementById('valReal').innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valPend').innerText = isPrivate ? "****€" : "-" + gFuturos.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valProj').innerText = isPrivate ? "****€" : (saldoReal - gFuturos + iFuturos).toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            
            document.getElementById('card-explora-val').innerText = isPrivate ? "****€" : dExplora.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('card-aqua-val').innerText = isPrivate ? "****€" : dAqua.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            
            renderRecurrentes();
            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('gastosChart')?.getContext('2d');
            if(!ctx) return;
            const desglose = {};
            appData.forEach(g => {
                if(!categIngresos.includes(g.categoria) && g.fecha <= new Date().toISOString().split('T')[0]) {
                    desglose[g.categoria] = (desglose[g.categoria] || 0) + Math.abs(parseFloat(g.importe));
                }
            }); 
            if (gastosChart) gastosChart.destroy();
            gastosChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: Object.keys(desglose), datasets: [{ data: Object.values(desglose), backgroundColor: ['#00e5ff','#7c4dff','#ff4081','#ffee33','#4caf50'], borderColor: '#072146', borderWidth: 2 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, cutout: '70%', 
                    plugins: { legend: { display: true, position: 'right', labels: { color: 'white', font: { size: 9 }, boxWidth: 10 } } } 
                }
            });
        }

        function renderRecurrentes() {
            const container = document.getElementById('listaRecurrentes');
            let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            container.innerHTML = recs.map(p => `
                <div class="bbva-card p-4 flex justify-between items-center border-l-4 border-purple-500 mb-2">
                    <div><p class="font-bold text-white">${p.concepto}</p><p class="text-[10px] text-slate-500 uppercase">Día ${p.dia}</p></div>
                    <p class="font-black text-rose-400">-${parseFloat(p.importe).toFixed(2)}€</p>
                </div>`).join('');
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: document.getElementById('in-importe').value, categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            e.target.reset(); renderApp(); goToTab(0);
        };

        function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
