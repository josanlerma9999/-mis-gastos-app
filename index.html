<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v12.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; overflow: hidden; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 2px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN Screen */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 8px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        /* Ajustes de Altura para No Scroll */
        .main-container { height: calc(100vh - 75px); padding-bottom: 10px; }
        nav { height: 65px; padding-bottom: 10px !important; }

        /* Banner Alerta Compacto con Botón */
        #alert-pago {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--bbva-cyan);
            padding: 8px 12px; border-radius: 12px; margin-bottom: 8px;
            display: none; align-items: center; justify-content: space-between;
            font-size: 10px; color: var(--bbva-cyan); font-weight: 800;
        }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="text-center mb-8 italic font-black text-[#00e5ff] text-3xl tracking-tighter">BBVA</div>
        <div class="flex mb-12" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-4">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] opacity-40 uppercase">Reset</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="deleteLast()" class="text-[10px] opacity-40 uppercase">Del</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-3 flex justify-between items-center border-b border-white/10 bg-black">
            <h1 class="font-black text-lg italic tracking-tighter">BBVA <span class="text-[8px] text-cyan-400 not-italic ml-1">v12.1</span></h1>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()" id="eye-icon" class="text-lg">👁️</button>
                <button onclick="location.reload()" class="opacity-30 text-lg">🔒</button>
            </div>
        </header>

        <main class="p-2 main-container">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-2">
                <div id="alert-pago">
                    <span id="alert-text">PAGO PROGRAMADO</span>
                    <button onclick="resetAllAlerts()" class="bg-cyan-400 text-black px-2 py-1 rounded text-[8px] font-black uppercase">Limpiar</button>
                </div>
                
                <div class="p-5 rounded-[2rem] text-center bbva-gradient border border-white/5 shadow-lg">
                    <p class="text-[8px] uppercase tracking-widest text-white/40 mb-1">Patrimonio</p>
                    <h2 id="valReal" class="text-3xl font-black italic">****€</h2>
                </div>

                <div class="bg-bbva-card p-3 rounded-[2rem] flex flex-col items-center">
                    <div style="height:140px; width: 100%;"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-1 w-full mt-3"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2 overflow-y-auto h-full">
                <input type="month" id="filtroMes" class="w-full bg-bbva-card p-2 rounded-xl text-white font-bold outline-none mb-1 text-sm" onchange="renderApp()">
                <div id="listaMes" class="space-y-1 pb-20"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-4 rounded-[2rem] border-t-4 border-cyan-400">
                    <form id="mainForm" class="space-y-3">
                        <input type="hidden" id="in-id">
                        <div>
                            <label class="text-[9px] font-black text-cyan-400 uppercase ml-1">Concepto</label>
                            <input type="text" id="in-concepto" class="w-full p-2 bg-black/40 border border-white/10 rounded-lg text-white outline-none text-sm">
                        </div>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-2 bg-black/40 border border-white/10 rounded-lg font-black text-2xl text-white text-center outline-none">
                        
                        <div class="flex justify-between items-center bg-white/5 p-2 rounded-lg">
                            <span class="text-[9px] font-bold text-white/40 uppercase italic">¿Recurrente?</span>
                            <input type="checkbox" id="in-es-recurrente" class="w-4 h-4 accent-cyan-400">
                            <input type="number" id="in-dia-pago" placeholder="Día" class="hidden w-12 p-1 bg-cyan-900/40 rounded text-center text-xs text-white">
                        </div>

                        <select id="in-categoria" class="w-full p-2 bg-black/40 border border-white/10 rounded-lg text-xs">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="PayPal">💳 PayPal</option>
                            <option value="Amazon">📦 Amazon</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-2 bg-black/40 border border-white/10 rounded-lg text-xs">
                        <button type="submit" class="w-full bg-cyan-400 text-[#072146] font-black py-3 rounded-xl uppercase text-[10px] shadow-lg">Confirmar</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/10 flex justify-around items-center z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab"><span class="text-xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Lista</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00e5ff', '#004481', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185'];
        let appData = [], currentPinInput = "", isPrivate = true, mainChart = null;
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(currentPinInput === (localStorage.getItem('bbva_user_pin') || "1234")) unlock();
                    else { alert("Error"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('eye-icon').innerText = isPrivate ? '👁️' : '🙈'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date();
                const mesSel = document.getElementById('filtroMes').value;
                let total = 0, cats = {};
                const list = document.getElementById('listaMes'); list.innerHTML = '';

                appData.forEach(g => {
                    const v = parseFloat(g.importe);
                    const isI = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoy.toISOString().split('T')[0]) isI ? total += v : total -= v;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + v;
                        list.innerHTML += `<div class="bg-bbva-card p-2 rounded-xl flex justify-between items-center border-l-2 ${isI?'border-cyan-400':'border-rose-500'} text-[11px]"><div class="flex flex-col"><span class="font-bold">${g.concepto}</span><span class="text-[8px] opacity-40 uppercase">${g.fecha}</span></div><div class="flex items-center gap-2"><span class="${isI?'text-cyan-400':'text-rose-400'} font-black">${isPrivate?'****':v.toFixed(2)}€</span><button onclick="deleteGasto('${g._id}')" class="opacity-30 text-xs">🗑️</button></div></div>`;
                    }
                });

                const banner = document.getElementById('alert-pago'); banner.style.display = 'none';
                recurrentes.forEach(r => {
                    if (hoy.getDate() >= r.dia) {
                        total -= r.importe;
                        if(hoy.getDate() === r.dia) { 
                            document.getElementById('alert-text').innerText = `PAGO: ${r.concepto} (-${r.importe}€)`;
                            banner.style.display = 'flex';
                        }
                    }
                });

                document.getElementById('valReal').innerText = isPrivate ? "****€" : total.toLocaleString('de-DE') + "€";
                drawChart(cats);
            } catch (e) {}
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '82%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex justify-between items-center bg-white/5 p-1 px-2 rounded-lg"><div class="flex items-center gap-1"><div class="w-1 h-1 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[7px] font-bold uppercase opacity-50 truncate w-10">${l}</span></div><span class="text-[8px] font-black">${isPrivate?'***':data[l].toFixed(0)}€</span></div>`).join('');
        }

        async function deleteGasto(id) { if(confirm("¿Borrar?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); } }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            if(document.getElementById('in-es-recurrente').checked) {
                recurrentes.push({ concepto: data.concepto, importe: data.importe, dia: parseInt(document.getElementById('in-dia-pago').value) });
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
            }
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-white/40')); 
            el.classList.replace('text-white/40', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function resetAllAlerts() { recurrentes = []; localStorage.setItem('bbva_recurrentes', '[]'); renderApp(); }
        
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
        document.getElementById('in-es-recurrente').addEventListener('change', function() { document.getElementById('in-dia-pago').classList.toggle('hidden', !this.checked); });
    </script>
</body>
</html>
