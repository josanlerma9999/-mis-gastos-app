<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Total Privacy v10.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin:0; overflow-x: hidden; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN System */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        /* Ajustes de Escala Precision v10.5 */
        #tab-cuenta { display: flex; flex-direction: column; gap: 6px; }
        .donut-container { height: 180px; position: relative; margin: -5px 0; }
        .btn-export { background: linear-gradient(90deg, #004481 0%, #00e5ff 100%); border: 1px solid rgba(255,255,255,0.2); }
        
        /* Ojo Privacidad */
        #toggle-visibility { font-size: 1.2rem; cursor: pointer; transition: opacity 0.2s; user-select: none; }
        #toggle-visibility:active { opacity: 0.5; }
    </style>
</head>
<body class="pb-24">

    <div id="pin-screen">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-[900] italic text-[#00e5ff] tracking-tighter">BBVA</h1>
            <p id="pin-instruction" class="text-[9px] uppercase tracking-[0.4em] text-white/40 mt-2">Acceso Privado</p>
        </div>
        <div class="flex mb-16" id="pin-dots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button>
            <button onclick="pressPin('2')" class="num-btn">2</button>
            <button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button>
            <button onclick="pressPin('5')" class="num-btn">5</button>
            <button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button>
            <button onclick="pressPin('8')" class="num-btn">8</button>
            <button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] uppercase font-bold opacity-30 text-center">Reset</button>
            <button onclick="pressPin('0')" class="num-btn">0</button>
            <button onclick="deleteLast()" class="text-[10px] uppercase font-bold opacity-30 text-center">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-black/90 p-4 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
            <div class="flex flex-col">
                <h1 class="font-[900] text-xl italic text-white leading-none">BBVA</h1>
                <span class="text-[9px] font-mono font-bold text-[#00e5ff] mt-1 uppercase tracking-wider">v10.5 Total Privacy</span>
            </div>
            <button onclick="location.reload()" class="bg-white/5 p-2 rounded-full border border-white/10">🔒</button>
        </header>

        <main class="max-w-md mx-auto p-2">
            <section id="tab-cuenta" class="tab-content">
                <div class="p-6 rounded-[2rem] text-center bbva-gradient border border-white/10 shadow-xl relative">
                    <div class="flex justify-center items-center gap-2 mb-1">
                        <p class="text-[9px] uppercase font-black tracking-widest text-cyan-300/40">Patrimonio Neto</p>
                        <span id="toggle-visibility" onclick="togglePrivacy()">👁️</span>
                    </div>
                    <h2 id="valReal" class="text-5xl font-[900] tracking-tighter text-white">0.00€</h2>
                </div>

                <div class="bg-bbva-card p-3 rounded-[2rem] flex flex-col items-center">
                    <div class="donut-container w-full"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 w-full mt-1"></div>
                </div>

                <div class="bg-zinc-900/40 p-4 rounded-2xl border border-white/5 mt-4">
                    <div class="grid grid-cols-3 gap-2 font-mono text-[9px] text-center">
                        <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                            <p class="text-slate-500 mb-1 italic uppercase">Ping</p>
                            <p id="debug-ping" class="text-white font-bold">--</p>
                        </div>
                        <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                            <p class="text-slate-500 mb-1 italic uppercase">Regs</p>
                            <p id="debug-count" class="text-white font-bold">--</p>
                        </div>
                        <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                            <p class="text-slate-500 mb-1 italic uppercase">Sync</p>
                            <p class="text-emerald-500 font-bold">OK</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2">
                <div class="bg-bbva-card p-4 rounded-xl flex justify-between gap-3 items-center">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-black outline-none text-base w-full" onchange="renderApp()">
                    <button onclick="exportarCSV()" class="btn-export text-white font-black text-[10px] px-5 py-3 rounded-xl uppercase whitespace-nowrap shadow-lg">Exportar</button>
                </div>
                <div id="listaMes" class="space-y-2"></div>
            </section>

            <section id="tab-add" class="tab-content hidden h-[60vh] flex flex-col justify-center">
                <div class="bg-bbva-card p-6 rounded-[2.5rem] border-t-4 border-[#00e5ff]">
                    <form id="mainForm" class="space-y-4">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-bold text-3xl text-white outline-none">
                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                            <optgroup label="INGRESOS">
                                <option value="Sueldo">💰 Sueldo</option>
                                <option value="Otros Ingresos">💵 Otros Ingresos</option>
                            </optgroup>
                            <optgroup label="GASTOS">
                                <option value="Amazon">📦 Amazon</option>
                                <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                                <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                                <option value="Imagine">🟣 Imagine</option>
                                <option value="PayPal">💳 PayPal</option>
                                <option value="Gasolina">⛽ Gasolina</option>
                                <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                                <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                            </optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-black py-4 rounded-xl text-[10px] uppercase tracking-widest shadow-xl">Confirmar</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-white/10 flex justify-around p-3 pb-8 z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab"><span class="text-xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Extracto</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#004481', '#00e5ff', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185', '#d946ef', '#4ade80'];
        let appData = [], mainChart = null, currentPinInput = "", isPrivate = false, currentSaldo = 0;
        
        let savedPin = localStorage.getItem('bbva_user_pin');
        if(!savedPin) document.getElementById('pin-instruction').innerText = "CREA TU PIN";

        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                updateDots();
                if(currentPinInput.length === 4) {
                    if(!savedPin) { localStorage.setItem('bbva_user_pin', currentPinInput); savedPin = currentPinInput; unlock(); }
                    else if(currentPinInput === savedPin) unlock();
                    else { alert("PIN INCORRECTO"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; updateDots(); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); updateDots(); }
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
        }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        function togglePrivacy() {
            isPrivate = !isPrivate;
            document.getElementById('toggle-visibility').innerText = isPrivate ? '🙈' : '👁️';
            updateSaldoDisplay();
        }

        function updateSaldoDisplay() {
            const el = document.getElementById('valReal');
            if (isPrivate) el.innerText = "****€";
            else el.innerText = currentSaldo.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
        }

        async function renderApp() {
            const start = Date.now();
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                document.getElementById('debug-ping').innerText = (Date.now() - start) + "ms";
                document.getElementById('debug-count').innerText = appData.length;

                const hoy = new Date().toISOString().split('T')[0], mesSel = document.getElementById('filtroMes').value;
                let real=0, cats={};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML='';

                appData.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
                    const val = parseFloat(g.importe);
                    const esIngreso = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoy) esIngreso ? real+=val : real-=val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!esIngreso) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        lMes.innerHTML += `<div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center border-l-2 ${esIngreso?'border-[#00e5ff]':'border-rose-500'}">
                            <div>
                                <p class="font-bold text-white text-sm mb-1">${g.concepto}</p>
                                <p class="text-[10px] font-bold uppercase"><span class="text-slate-500">${g.categoria}</span><span class="text-slate-700 mx-1">•</span><span style="color: #ffffff !important;">Día ${g.fecha.split('-')[2]}</span></p>
                            </div>
                            <p class="font-black text-lg ${esIngreso?'text-[#00e5ff]':'text-rose-400'}">${esIngreso?'+':''}${val.toFixed(2)}€</p>
                        </div>`;
                    }
                });
                currentSaldo = real;
                updateSaldoDisplay();
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 2, borderColor: '#072146' }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '80%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center justify-between p-2 bg-white/5 rounded-xl border border-white/5"><div class="flex items-center gap-2 truncate"><div class="w-1.5 h-1.5 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[7px] font-bold text-slate-400 uppercase truncate">${l}</span></div><span class="text-[8px] font-black text-white ml-2">${values[i].toFixed(0)}€</span></div>`).join('');
        }

        function exportarCSV() {
            const mes = document.getElementById('filtroMes').value;
            const filtrados = appData.filter(g => g.fecha.startsWith(mes));
            let csv = "\uFEFFFecha,Concepto,Categoria,Importe\n";
            filtrados.forEach(g => csv += `${g.fecha},${g.concepto},${g.categoria},${g.importe}\n`);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `BBVA_Extracto_${mes}.csv`; a.click();
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
