<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gestor Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab { color: #4f46e5; border-top: 3px solid #4f46e5; font-weight: 900; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-24 text-slate-900">

    <nav class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 id="tituloFiltro" class="text-lg font-bold tracking-tight">Mi Cuenta Real</h1>
        <span class="bg-indigo-500 px-2 py-1 rounded text-[10px] font-black uppercase">v6.0 ⚡</span>
    </nav>

    <main class="max-w-md mx-auto p-4">
        <section id="vista-total" class="seccion-tab">
            <div id="tarjetaBalance" class="bg-indigo-600 text-white p-8 rounded-3xl shadow-xl mb-6 text-center transition-all duration-500">
                <p class="text-[10px] uppercase tracking-widest opacity-80 mb-2 font-black">Dinero Real Disponible</p>
                <p id="totalRealCuenta" class="text-5xl font-black">0.00€</p>
            </div>
        </section>

        <section id="vista-prevision" class="seccion-tab hidden">
            <div class="bg-amber-50 border border-amber-100 p-4 rounded-2xl mb-4">
                <p class="text-[10px] font-black text-amber-600 uppercase mb-1">Próximos Movimientos</p>
                <p class="text-xs text-amber-800 italic">Dinero que entrará o saldrá próximamente.</p>
            </div>
            <ul id="listaPrevision" class="space-y-3"></ul>
        </section>

        <section id="vista-mes" class="seccion-tab hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-slate-100">
                <input type="month" id="mesFiltro" class="w-full p-2 bg-slate-50 rounded-xl font-bold text-center border-none outline-none" onchange="cargarDatos()">
            </div>
            <div id="desgloseCategorias" class="space-y-2 mb-6"></div>
            <div class="grid grid-cols-2 gap-3 mb-6 font-black uppercase text-[10px]">
                <div class="bg-green-50 p-4 rounded-2xl border border-green-100 text-center">
                    <p class="text-green-600 mb-1">Entradas</p>
                    <p id="ingresosMes" class="text-lg text-green-700">0.00€</p>
                </div>
                <div class="bg-red-50 p-4 rounded-2xl border border-red-100 text-center">
                    <p class="text-red-600 mb-1">Gastos</p>
                    <p id="gastosMes" class="text-lg text-red-700">0.00€</p>
                </div>
            </div>
            <ul id="listaGastos" class="space-y-3"></ul>
        </section>

        <section id="vista-add" class="seccion-tab hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-black text-slate-800 mb-6">Añadir Registro</h2>
                <form id="gastoForm" class="space-y-4">
                    <input type="text" id="concepto" placeholder="¿Qué es?" class="w-full p-4 bg-slate-50 rounded-xl outline-none" required>
                    <input type="number" id="importe" step="0.01" placeholder="Importe (€)" class="w-full p-4 bg-slate-50 rounded-xl outline-none" required>
                    <select id="categoria" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-medium">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Otros Ingresos">💵 Otros Ingresos</option>
                        <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        <option value="BBVA Tarjeta">🟦 BBVA Tarjeta</option>
                        <option value="Imagine">🟣 Imagine</option>
                        <option value="PayPal">💳 PayPal</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                    </select>
                    <input type="date" id="fecha" class="w-full p-4 bg-slate-50 rounded-xl outline-none" required>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black p-5 rounded-2xl shadow-lg">GUARDAR AHORA</button>
                </form>
                <button onclick="resetearTodo()" class="w-full mt-12 text-red-400 text-[10px] font-black uppercase tracking-widest border border-red-50 p-2 rounded-xl">⚠️ Borrar todo y empezar de cero</button>
            </div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around p-2 pb-6 shadow-lg z-50">
        <button onclick="cambiarTab('vista-total', this)" class="tab-btn flex flex-col items-center p-2 active-tab transition-all">
            <span class="text-2xl">💰</span><span class="text-[10px] font-black uppercase">Cuenta</span>
        </button>
        <button onclick="cambiarTab('vista-prevision', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">🗓️</span><span class="text-[10px] font-black uppercase">Previsión</span>
        </button>
        <button onclick="cambiarTab('vista-mes', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">📊</span><span class="text-[10px] font-black uppercase">Mes</span>
        </button>
        <button onclick="cambiarTab('vista-add', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">➕</span><span class="text-[10px] font-black uppercase">Añadir</span>
        </button>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos'; 

        document.getElementById('mesFiltro').value = new Date().toISOString().slice(0, 7);
        document.getElementById('fecha').valueAsDate = new Date();

        function cambiarTab(id, el) {
            document.querySelectorAll('.seccion-tab').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active-tab'); b.classList.add('text-slate-400'); });
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active-tab'); el.classList.remove('text-slate-400');
            const titulos = {'vista-total': 'Mi Cuenta Real', 'vista-prevision': 'Pendiente', 'vista-mes': 'Resumen Mensual', 'vista-add': 'Nuevo Movimiento'};
            document.getElementById('tituloFiltro').innerText = titulos[id];
        }

        async function cargarDatos() {
            try {
                const res = await fetch(API_URL);
                const todos = await res.json();
                const hoyStr = new Date().toISOString().split('T')[0];
                const mesActual = document.getElementById('mesFiltro').value;

                let balanceReal = 0;
                let ingresosMes = 0;
                let gastosMes = 0;
                let resumenCats = {};

                const listaM = document.getElementById('listaGastos');
                const listaP = document.getElementById('listaPrevision');
                listaM.innerHTML = ''; listaP.innerHTML = '';

                todos.forEach(g => {
                    if (!g.importe || !g.categoria) return;
                    const monto = parseFloat(g.importe);
                    const esIngreso = g.categoria === 'Sueldo' || g.categoria === 'Otros Ingresos';
                    
                    // Lógica: Si la fecha es de HOY o ANTERIOR, cuenta en el balance real
                    if (g.fecha <= hoyStr) {
                        if (esIngreso) balanceReal += monto;
                        else balanceReal -= monto;
                    }

                    // Lista Mensual (Filtro por mes seleccionado)
                    if (g.fecha && g.fecha.startsWith(mesActual)) {
                        if (esIngreso) ingresosMes += monto;
                        else {
                            gastosMes += monto;
                            resumenCats[g.categoria] = (resumenCats[g.categoria] || 0) + monto;
                        }
                        const color = esIngreso ? 'text-green-600' : 'text-red-600';
                        listaM.innerHTML += `<li class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                            <div><p class="font-bold text-sm text-slate-800">${g.concepto}</p><p class="text-[9px] text-slate-400 font-black uppercase">${g.categoria}</p></div>
                            <div class="text-right flex items-center gap-2"><p class="${color} font-black">${monto.toFixed(2)}€</p><button onclick="eliminarGasto('${g._id}')">🗑️</button></div>
                        </li>`;
                    }

                    // Lista Previsión (Solo lo que es estrictamente del FUTURO)
                    if (g.fecha > hoyStr) {
                        listaP.innerHTML += `<li class="bg-amber-100/50 p-4 rounded-2xl border border-amber-200 flex justify-between items-center">
                            <div><p class="font-bold text-sm text-amber-900">${g.concepto}</p><p class="text-[9px] text-amber-600 font-black uppercase">${g.fecha}</p></div>
                            <button onclick="eliminarGasto('${g._id}')" class="text-xs font-bold text-red-400">ANULAR</button>
                        </li>`;
                    }
                });

                document.getElementById('totalRealCuenta').innerText = balanceReal.toFixed(2) + '€';
                document.getElementById('ingresosMes').innerText = ingresosMes.toFixed(2) + '€';
                document.getElementById('gastosMes').innerText = gastosMes.toFixed(2) + '€';
                
                const divCats = document.getElementById('desgloseCategorias');
                divCats.innerHTML = '';
                for (let cat in resumenCats) {
                    divCats.innerHTML += `<div class="bg-white px-4 py-2 rounded-xl border border-slate-100 flex justify-between items-center shadow-sm"><span class="text-[10px] font-black text-slate-500 uppercase">${cat}</span><span class="text-sm font-black text-indigo-600">${resumenCats[cat].toFixed(2)}€</span></div>`;
                }

                const tarjeta = document.getElementById('tarjetaBalance');
                if (balanceReal < 0) tarjeta.className = 'bg-red-600 text-white p-8 rounded-3xl shadow-xl mb-6 text-center animate-pulse';
                else if (balanceReal < 100) tarjeta.className = 'bg-orange-500 text-white p-8 rounded-3xl shadow-xl mb-6 text-center';
                else tarjeta.className = 'bg-indigo-600 text-white p-8 rounded-3xl shadow-xl mb-6 text-center';
            } catch (e) { console.error(e); }
        }

        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevo = { concepto: document.getElementById('concepto').value, importe: document.getElementById('importe').value, categoria: document.getElementById('categoria').value, fecha: document.getElementById('fecha').value };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nuevo) });
            e.target.reset(); document.getElementById('fecha').valueAsDate = new Date();
            await cargarDatos(); cambiarTab('vista-mes', document.querySelectorAll('.tab-btn')[2]);
        });

        async function eliminarGasto(id) { if (confirm("¿Borrar?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); await cargarDatos(); } }
        async function resetearTodo() {
            if (confirm("⚠️ ¿Borrar TODO?")) {
                const res = await fetch(API_URL);
                const todos = await res.json();
                for (let g of todos) { await fetch(`${API_URL}/${g._id}`, { method: 'DELETE' }); }
                location.reload();
            }
        }
        cargarDatos();
    </script>
</body>
</html>
