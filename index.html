<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Financiero v7.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .active-tab { color: #10b981; border-top: 3px solid #10b981; font-weight: 900; }
        .hidden { display: none; }
        .font-black { font-weight: 900; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-24 text-slate-900">

    <nav class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-lg font-black tracking-tighter italic">Mi Cuenta Real</h1>
        <span class="bg-emerald-500 px-2 py-1 rounded text-[10px] font-black uppercase tracking-tighter">v7.1 💎</span>
    </nav>

    <main class="max-w-md mx-auto p-4">
        <section id="vista-total" class="seccion-tab">
            <div id="tarjetaBalance" class="bg-emerald-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center transition-all">
                <p class="text-[10px] uppercase tracking-widest opacity-90 mb-1 font-black">Dinero Actual</p>
                <p id="totalRealCuenta" class="text-4xl font-black italic">0.00€</p>
            </div>
            <div class="bg-slate-800 text-white p-5 rounded-[2rem] shadow-lg mb-6 flex justify-between items-center px-8 border-b-4 border-indigo-500">
                <div class="text-center">
                    <p class="text-[9px] uppercase tracking-widest opacity-70 font-black text-indigo-300">Final Mes</p>
                    <p id="totalEstimado" class="text-xl font-black">0.00€</p>
                </div>
                <div class="h-8 w-[1px] bg-slate-700"></div>
                <div class="text-center">
                    <p class="text-[9px] uppercase tracking-widest opacity-70 font-black text-emerald-300">En Plan</p>
                    <p id="totalPendiente" class="text-xl font-black text-emerald-400">0.00€</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 mb-6">
                <div class="relative h-48 mb-6"><canvas id="graficoGastos"></canvas></div>
                <div id="leyendaPersonalizada" class="grid grid-cols-2 gap-2 mt-4"></div>
            </div>
        </section>

        <section id="vista-prevision" class="seccion-tab hidden">
            <div class="bg-indigo-50 p-4 rounded-2xl mb-4 text-center text-indigo-600 font-black text-[10px] uppercase italic border border-indigo-100">
                🗓️ Movimientos Programados
            </div>
            <ul id="listaPrevision" class="space-y-3 pt-2"></ul>
        </section>

        <section id="vista-mes" class="seccion-tab hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 text-center border border-slate-100">
                <input type="month" id="mesFiltro" class="font-black outline-none border-none bg-transparent" onchange="cargarDatos()">
            </div>
            <div class="grid grid-cols-2 gap-3 mb-6 font-black uppercase text-[10px]">
                <div class="bg-emerald-50 p-4 rounded-2xl text-center text-emerald-700 border border-emerald-100">
                    <p>Ingresos</p><p id="ingresosMes" class="text-lg font-black">0.00€</p>
                </div>
                <div class="bg-rose-50 p-4 rounded-2xl text-center text-rose-700 border border-rose-100">
                    <p>Gastos</p><p id="gastosMes" class="text-lg font-black">0.00€</p>
                </div>
            </div>
            <ul id="listaGastos" class="space-y-2"></ul>
        </section>

        <section id="vista-add" class="seccion-tab hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 id="tituloForm" class="text-center font-black uppercase text-[10px] mb-4 text-slate-400 tracking-widest">Añadir Movimiento</h2>
                <form id="gastoForm" class="space-y-4">
                    <input type="hidden" id="edit_id" value="">
                    <input type="text" id="concepto" placeholder="Concepto" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" required>
                    <input type="number" id="importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-black text-2xl" required>
                    <select id="categoria" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Otros Ingresos">💵 Otros Ingresos</option>
                        <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                        <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                        <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                        <option value="Imagine">🟣 Imagine</option>
                        <option value="PayPal">💳 PayPal</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                    </select>
                    <input type="date" id="fecha" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" required>
                    <button type="submit" id="btnGuardar" class="w-full bg-slate-900 text-white font-black p-5 rounded-2xl shadow-xl">GUARDAR</button>
                    <button type="button" id="btnCancelarEdicion" onclick="cancelarEdicion()" class="hidden w-full text-rose-500 font-black p-2 text-[10px] uppercase">Cancelar Edición</button>
                </form>
            </div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around p-2 pb-6 shadow-2xl z-50">
        <button onclick="cambiarTab('vista-total', this)" class="tab-btn flex flex-col items-center p-2 active-tab">
            <span class="text-2xl">💰</span><span class="text-[9px] uppercase font-black">Cuenta</span>
        </button>
        <button onclick="cambiarTab('vista-prevision', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">🗓️</span><span class="text-[9px] uppercase font-black">Plan</span>
        </button>
        <button onclick="cambiarTab('vista-mes', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">📊</span><span class="text-[9px] uppercase font-black">Mes</span>
        </button>
        <button onclick="cambiarTab('vista-add', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">➕</span><span class="text-[9px] uppercase font-black">Add</span>
        </button>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos'; 
        let miGrafico = null;
        let gastosCache = [];
        const COLORES = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#3b82f6', '#0f172a'];

        document.getElementById('mesFiltro').value = new Date().toISOString().slice(0, 7);
        document.getElementById('fecha').valueAsDate = new Date();

        function cambiarTab(id, el) {
            document.querySelectorAll('.seccion-tab').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active-tab'); b.classList.add('text-slate-400'); });
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active-tab'); el.classList.remove('text-slate-400');
            if (id !== 'vista-add') cargarDatos();
        }

        async function cargarDatos() {
            try {
                const res = await fetch(API_URL);
                gastosCache = await res.json();
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const hoyStr = hoy.toISOString().split('T')[0];
                const mesSel = document.getElementById('mesFiltro').value;

                let balAct = 0, balPrev = 0, inMes = 0, gasMes = 0, resCats = {};
                const listaM = document.getElementById('listaGastos'), listaP = document.getElementById('listaPrevision');
                listaM.innerHTML = ''; listaP.innerHTML = '';

                gastosCache.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach(g => {
                    const monto = parseFloat(g.importe), esIn = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    const botones = `<div class="flex gap-3"><button onclick="prepararEdicion('${g._id}')" class="text-blue-500">✏️</button><button onclick="eliminarGasto('${g._id}')" class="text-slate-300">🗑️</button></div>`;

                    if (g.fecha <= hoyStr) { if (esIn) balAct += monto; else balAct -= monto; } 
                    else {
                        if (esIn) balPrev += monto; else balPrev -= monto;
                        listaP.innerHTML += `<li class="bg-white p-4 rounded-2xl border-l-4 border-amber-400 shadow-sm flex justify-between items-center mb-2 animate-fade">
                            <div><p class="font-black text-sm text-slate-800">${g.concepto}</p><p class="text-[9px] text-amber-600 font-black uppercase">${g.fecha}</p></div>
                            <div class="flex items-center gap-3 font-black"><p class="${esIn?'text-emerald-500':'text-rose-500'}">${monto.toFixed(2)}€</p>${botones}</div>
                        </li>`;
                    }
                    if (g.fecha.startsWith(mesSel)) {
                        if (esIn) inMes += monto; else { gasMes += monto; resCats[g.categoria] = (resCats[g.categoria] || 0) + monto; }
                        listaM.innerHTML += `<li class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center animate-fade">
                            <div><p class="font-bold text-xs text-slate-700 font-black">${g.concepto}</p><p class="text-[8px] text-slate-400 font-black uppercase">${g.categoria}</p></div>
                            <div class="flex items-center gap-3 font-black"><p class="text-xs ${esIn?'text-emerald-500':'text-rose-500'}">${monto.toFixed(2)}€</p>${botones}</div>
                        </li>`;
                    }
                });
                document.getElementById('totalRealCuenta').innerText = balAct.toFixed(2) + '€';
                document.getElementById('totalEstimado').innerText = (balAct + balPrev).toFixed(2) + '€';
                document.getElementById('totalPendiente').innerText = (balPrev >= 0 ? '+' : '') + balPrev.toFixed(2) + '€';
                document.getElementById('ingresosMes').innerText = inMes.toFixed(2) + '€';
                document.getElementById('gastosMes').innerText = gasMes.toFixed(2) + '€';
                
                const ctx = document.getElementById('graficoGastos').getContext('2d');
                if (miGrafico) miGrafico.destroy();
                const divLeyenda = document.getElementById('leyendaPersonalizada'); divLeyenda.innerHTML = '';
                const cats = Object.keys(resCats);
                if (cats.length > 0) {
                    miGrafico = new Chart(ctx, { type: 'doughnut', data: { labels: cats, datasets: [{ data: Object.values(resCats), backgroundColor: COLORES, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '75%' } });
                    cats.forEach((cat, i) => {
                        const porc = ((resCats[cat] / gasMes) * 100).toFixed(0);
                        divLeyenda.innerHTML += `<div class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-100"><div class="w-2 h-2 rounded-full" style="background:${COLORES[i]}"></div><div class="flex flex-col leading-tight"><span class="text-[8px] font-black uppercase text-slate-400">${cat}</span><span class="text-[10px] font-black text-slate-700">${resCats[cat].toFixed(1)}€ (${porc}%)</span></div></div>`;
                    });
                }
                const tj = document.getElementById('tarjetaBalance');
                tj.className = balAct < 0 ? 'bg-rose-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center' : 'bg-emerald-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center';
            } catch (e) { console.error(e); }
        }

        function prepararEdicion(id) {
            const g = gastosCache.find(i => i._id === id); if (!g) return;
            document.getElementById('edit_id').value = g._id;
            document.getElementById('concepto').value = g.concepto;
            document.getElementById('importe').value = g.importe;
            document.getElementById('categoria').value = g.categoria;
            document.getElementById('fecha').value = g.fecha;
            document.getElementById('btnGuardar').innerText = "GUARDAR CAMBIOS";
            document.getElementById('btnGuardar').classList.replace('bg-slate-900', 'bg-orange-500');
            document.getElementById('btnCancelarEdicion').classList.remove('hidden');
            document.getElementById('tituloForm').innerText = "Modo Edición";
            cambiarTab('vista-add', document.querySelectorAll('.tab-btn')[3]);
        }

        function cancelarEdicion() {
            document.getElementById('edit_id').value = ""; document.getElementById('gastoForm').reset();
            document.getElementById('btnGuardar').innerText = "GUARDAR";
            document.getElementById('btnGuardar').className = "w-full bg-slate-900 text-white font-black p-5 rounded-2xl shadow-xl";
            document.getElementById('btnCancelarEdicion').classList.add('hidden');
            document.getElementById('tituloForm').innerText = "Añadir Movimiento";
            document.getElementById('fecha').valueAsDate = new Date();
        }

        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idViejo = document.getElementById('edit_id').value;
            const data = {
                concepto: document.getElementById('concepto').value,
                importe: parseFloat(document.getElementById('importe').value),
                categoria: document.getElementById('categoria').value,
                fecha: document.getElementById('fecha').value
            };

            try {
                // ESTRATEGIA INFALIBLE: SI EDITAMOS, PRIMERO BORRAMOS EL VIEJO
                if (idViejo) {
                    await fetch(`${API_URL}/${idViejo}`, { method: 'DELETE' });
                }
                
                // LUEGO CREAMOS EL NUEVO (O SIMPLEMENTE CREAMOS SI NO ES EDICIÓN)
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    cancelarEdicion(); await cargarDatos();
                    cambiarTab('vista-total', document.querySelectorAll('.tab-btn')[0]);
                } else { alert("Error al guardar."); }
            } catch (err) { console.error(err); alert("Error de conexión."); }
        });

        async function eliminarGasto(id) { if (confirm("¿Eliminar?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); await cargarDatos(); } }
        cargarDatos();
    </script>
</body>
</html>
