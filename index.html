<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        /* Estilos anteriores intactos */
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--bbva-cyan); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="pb-24">
    <section id="tab-add" class="tab-content hidden h-[70vh] flex flex-col justify-center">
        <div class="bg-bbva-card p-6 rounded-[2.5rem] border-t-4 border-[#00e5ff]">
            <form id="mainForm" class="space-y-3">
                <input type="text" id="in-concepto" placeholder="Nombre del pago (ej: El Pavo)" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                <input type="number" id="in-importe" step="0.01" placeholder="Importe 0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-bold text-2xl text-white outline-none">
                
                <div class="toggle-container">
                    <span class="text-[10px] font-black uppercase text-slate-400">¿Es un pago recurrente?</span>
                    <label class="switch"><input type="checkbox" id="in-es-recurrente"><span class="slider"></span></label>
                </div>

                <div id="config-recurrente" class="hidden space-y-2">
                    <p class="text-[9px] text-cyan-400 font-bold uppercase ml-2">Día de cobro mensual:</p>
                    <input type="number" id="in-dia-pago" min="1" max="31" placeholder="Día (1-31)" class="w-full p-3 bg-black/60 border border-cyan-900/30 rounded-xl text-white outline-none">
                </div>

                <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                    </select>
                <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-black py-4 rounded-xl text-[10px] uppercase tracking-widest">Guardar Configuración</button>
            </form>
        </div>
    </section>

    <script>
        // Lógica para mostrar/ocultar config recurrente
        document.getElementById('in-es-recurrente').addEventListener('change', function() {
            document.getElementById('config-recurrente').classList.toggle('hidden', !this.checked);
        });

        // Almacenamiento local para los recurrentes
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        async function renderApp() {
            // 1. Cargar datos de API
            // 2. Sumar/Restar recurrentes al saldo 'real'
            const hoy = new Date();
            const diaHoy = hoy.getDate();
            
            recurrentes.forEach(r => {
                if (diaHoy >= r.dia) {
                    // Si ya pasó el día este mes, lo restamos del saldo visual
                    currentSaldo -= r.importe;
                    if(diaHoy === r.dia) {
                        document.getElementById('alert-payday').innerText = `⚠️ HOY TOCA: ${r.concepto} (-${r.importe}€)`;
                        document.getElementById('alert-payday').style.display = 'block';
                    }
                }
            });

            // ... (Resto de lógica de render v10.7) ...
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const esRec = document.getElementById('in-es-recurrente').checked;
            const data = { 
                concepto: document.getElementById('in-concepto').value, 
                importe: parseFloat(document.getElementById('in-importe').value),
                dia: parseInt(document.getElementById('in-dia-pago').value)
            };

            if(esRec) {
                recurrentes.push(data);
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
                alert(`Pago recurrente de "${data.concepto}" configurado para el día ${data.dia}`);
            }
            
            // ... Enviar también a la API normal ...
        });
    </script>
</body>
</html>
