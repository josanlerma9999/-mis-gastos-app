<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Auto-Pilot v10.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin:0; overflow-x: hidden; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN System */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        /* Banner Alerta */
        #alert-payday {
            background: linear-gradient(90deg, rgba(0, 68, 129, 0.9) 0%, rgba(0, 229, 255, 0.2) 100%);
            border-left: 4px solid var(--bbva-cyan);
            padding: 12px; border-radius: 12px; margin-bottom: 10px; display: none;
            font-size: 10px; font-weight: 900; text-transform: uppercase;
        }

        /* Toggle Switch */
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--bbva-cyan); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body class="pb-24">

    <div id="pin-screen">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-[900] italic text-[#00e5ff] tracking-tighter">BBVA</h1>
            <p id="pin-instruction" class="text-[9px] uppercase tracking-[0.4em] text-white/40 mt-2">Acceso Privado</p>
        </div>
        <div class="flex mb-16" id="pin-dots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button>
            <button onclick="pressPin('2')" class="num-btn">2</button>
            <button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button>
            <button onclick="pressPin('5')" class="num-btn">5</button>
            <button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button>
            <button onclick="pressPin('8')" class="num-btn">8</button>
            <button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] uppercase font-bold opacity-30">Reset</button>
            <button onclick="pressPin('0')" class="num-btn">0</button>
            <button onclick="deleteLast()" class="text-[10px] uppercase font-bold opacity-30">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-black/90 p-4 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
            <div class="flex flex-col">
                <h1 class="font-[900] text-xl italic text-white leading-none">BBVA</h1>
                <span class="text-[9px] font-bold text-[#00e5ff] mt-1 uppercase tracking-wider">v10.8 Auto-Pilot</span>
            </div>
            <button onclick="location.reload()" class="bg-white/5 p-2 rounded-full border border-white/10">🔒</button>
        </header>

        <main class="max-w-md mx-auto p-2">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-2">
                <div id="alert-payday" class="text-center"></div>

                <div class="p-6 rounded-[2rem] text-center bbva-gradient border border-white/10 relative">
                    <div class="flex justify-center items-center gap-2 mb-1">
                        <p class="text-[9px] uppercase font-black tracking-widest text-cyan-300/40">Patrimonio Neto</p>
                        <span id="toggle-visibility" onclick="togglePrivacy()" class="cursor-pointer">👁️</span>
                    </div>
                    <h2 id="valReal" class="text-5xl font-[900] tracking-tighter text-white">0.00€</h2>
                </div>

                <div class="bg-bbva-card p-3 rounded-[2rem] flex flex-col items-center">
                    <div style="height: 180px; width: 100%; position: relative;"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 w-full mt-2"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2">
                <div class="bg-bbva-card p-4 rounded-xl flex justify-between gap-3 items-center">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-black outline-none w-full" onchange="renderApp()">
                    <button onclick="exportarCSV()" class="bg-gradient-to-r from-[#004481] to-[#00e5ff] text-white font-black text-[10px] px-4 py-2 rounded-lg uppercase">Exportar</button>
                </div>
                <div id="listaMes" class="space-y-2"></div>
            </section>

            <section id="tab-add" class="tab-content hidden h-[75vh] flex flex-col justify-center">
                <div class="bg-bbva-card p-6 rounded-[2.5rem] border-t-4 border-[#00e5ff]">
                    <form id="mainForm" class="space-y-4">
                        <input type="text" id="in-concepto" placeholder="Concepto (ej: El Pavo)" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-bold text-2xl text-white outline-none" required>
                        
                        <div class="toggle-container">
                            <span class="text-[10px] font-black uppercase text-slate-400">¿Es un pago recurrente?</span>
                            <label class="switch">
                                <input type="checkbox" id="in-es-recurrente">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div id="config-recurrente" class="hidden animate-pulse">
                            <input type="number" id="in-dia-pago" min="1" max="31" placeholder="Día del mes (1-31)" class="w-full p-4 bg-cyan-900/20 border border-cyan-500/30 rounded-xl text-white outline-none">
                        </div>

                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Amazon">📦 Amazon</option>
                            <option value="Gasolina">⛽ Gasolina</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-black py-4 rounded-xl text-[10px] uppercase tracking-widest shadow-lg">Confirmar Operación</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-white/10 flex justify-around p-3 pb-8 z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab"><span class="text-xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Extracto</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#004481', '#00e5ff', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185'];
        let appData = [], mainChart = null, currentPinInput = "", isPrivate = false, currentSaldo = 0;
        
        // Cargar Recurrentes
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        // Lógica PIN
        let savedPin = localStorage.getItem('bbva_user_pin');
        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                updateDots();
                if(currentPinInput.length === 4) {
                    if(!savedPin) { localStorage.setItem('bbva_user_pin', currentPinInput); savedPin = currentPinInput; unlock(); }
                    else if(currentPinInput === savedPin) unlock();
                    else { alert("PIN INCORRECTO"); clearPin(); }
                }
            }
        }
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
        }
        function clearPin() { currentPinInput = ""; updateDots(); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); updateDots(); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        // Mostrar/Ocultar campo recurrente
        document.getElementById('in-es-recurrente').addEventListener('change', function() {
            document.getElementById('config-recurrente').classList.toggle('hidden', !this.checked);
        });

        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('toggle-visibility').innerText = isPrivate ? '🙈' : '👁️'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date();
                const diaHoy = hoy.getDate();
                const mesSel = document.getElementById('filtroMes').value;
                let real = 0, cats = {};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML = '';

                // Calcular Saldo API
                appData.forEach(g => {
                    const val = parseFloat(g.importe);
                    const esIngreso = (g.categoria === "Sueldo");
                    if (g.fecha <= hoy.toISOString().split('T')[0]) esIngreso ? real += val : real -= val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!esIngreso) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        const disp = isPrivate ? "****€" : (esIngreso?'+':'') + val.toFixed(2) + '€';
                        lMes.innerHTML += `<div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center border-l-2 ${esIngreso?'border-[#00e5ff]':'border-rose-500'}">
                            <div><p class="font-bold text-white text-sm">${g.concepto}</p><p class="text-[10px] text-slate-500 uppercase">${g.categoria} • Día ${g.fecha.split('-')[2]}</p></div>
                            <p class="font-black ${esIngreso?'text-[#00e5ff]':'text-rose-400'}">${disp}</p></div>`;
                    }
                });

                // Aplicar Recurrentes
                document.getElementById('alert-payday').style.display = 'none';
                recurrentes.forEach(r => {
                    if (diaHoy >= r.dia) {
                        real -= r.importe;
                        if(diaHoy === r.dia) {
                            document.getElementById('alert-payday').innerText = `🔔 HOY: ${r.concepto} (-${r.importe}€)`;
                            document.getElementById('alert-payday').style.display = 'block';
                        }
                    }
                });

                document.getElementById('valReal').innerText = isPrivate ? "****€" : real.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, cutout: '80%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center justify-between p-2 bg-white/5 rounded-xl"><span class="text-[7px] font-bold text-slate-400 uppercase">${l}</span><span class="text-[8px] font-black">${isPrivate ? "***€" : values[i].toFixed(0) + "€"}</span></div>`).join('');
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const esRec = document.getElementById('in-es-recurrente').checked;
            const data = { 
                concepto: document.getElementById('in-concepto').value, 
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };

            if(esRec) {
                const recData = { concepto: data.concepto, importe: data.importe, dia: parseInt(document.getElementById('in-dia-pago').value) };
                recurrentes.push(recData);
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
            }

            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
