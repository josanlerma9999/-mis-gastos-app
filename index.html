<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Maxi v9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 4px solid var(--bbva-cyan); }
        input, select { font-size: 16px !important; } /* Evita zoom en iOS */
    </style>
</head>
<body class="pb-32">

    <header class="bg-black/90 backdrop-blur-md p-5 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
        <div class="flex flex-col">
            <h1 class="font-[900] text-2xl tracking-tighter italic leading-none text-[#00e5ff]">BBVA</h1>
            <span class="text-[8px] uppercase tracking-[0.4em] font-bold opacity-60">Private Suite</span>
        </div>
        <span class="text-[9px] font-mono text-[#00e5ff] border border-[#00e5ff]/30 px-2 py-1 rounded">v9.5-MAXI</span>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <section id="tab-cuenta" class="tab-content space-y-6">
            <div class="py-12 px-6 rounded-[2.5rem] text-center bbva-gradient border border-white/10 shadow-2xl">
                <p class="text-[10px] uppercase font-black tracking-[0.3em] mb-3 text-cyan-300 opacity-70">Saldo Total Consolidado</p>
                <h2 id="valReal" class="text-6xl font-[900] tracking-tighter">0.00€</h2>
            </div>
            
            <div class="bg-bbva-card p-8 rounded-[2.5rem]">
                <h3 class="text-center text-[10px] uppercase font-black tracking-widest mb-8 opacity-40">Distribución de Gastos</h3>
                <div class="h-72 mb-10"><canvas id="chartGastos"></canvas></div>
                
                <div id="legendBox" class="space-y-3"></div>
            </div>

            <div class="bg-zinc-900/40 p-6 rounded-2xl border border-dashed border-zinc-800">
                <p class="text-[9px] font-mono uppercase mb-4 opacity-40">System Diagnostics</p>
                <div class="font-mono text-[10px] space-y-2 opacity-60">
                    <p>> NETWORK: <span class="text-emerald-400">CONNECTED</span></p>
                    <p>> LATENCY: <span id="debug-ping" class="text-[#00e5ff]">--ms</span></p>
                    <p>> RECORDS: <span id="debug-count" class="text-[#00e5ff]">0</span></p>
                </div>
            </div>
        </section>

        <section id="tab-add" class="tab-content hidden h-[70vh] flex flex-col justify-center">
            <div class="bg-bbva-card p-10 rounded-[3rem] shadow-2xl border-t-4 border-[#00e5ff]">
                <h2 class="text-center font-black uppercase text-xs text-[#00e5ff] mb-8 tracking-[0.5em]">Nueva Transacción</h2>
                <form id="mainForm" class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[9px] uppercase font-black opacity-40 ml-2">Concepto de pago</label>
                        <input type="text" id="in-concepto" placeholder="Ej. Compra Amazon" class="w-full p-5 bg-black/50 border border-white/10 rounded-2xl text-white text-lg outline-none focus:border-[#00e5ff] transition-all">
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-[9px] uppercase font-black opacity-40 ml-2">Importe total</label>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-6 bg-black/50 border border-white/10 rounded-2xl font-[900] text-5xl text-white outline-none focus:text-[#00e5ff]">
                    </div>

                    <div class="space-y-2">
                        <label class="text-[9px] uppercase font-black opacity-40 ml-2">Categoría</label>
                        <select id="in-categoria" class="w-full p-5 bg-black/50 border border-white/10 rounded-2xl text-white text-lg outline-none appearance-none">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Amazon">📦 Amazon</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                            <option value="Imagine">🟣 Imagine</option>
                            <option value="PayPal">💳 PayPal</option>
                            <option value="Gasolina">⛽ Gasolina</option>
                            <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                            <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                            <option value="Otros Ingresos">💵 Otros</option>
                        </select>
                    </div>

                    <input type="date" id="in-fecha" class="w-full p-5 bg-black/50 border border-white/10 rounded-2xl text-white text-lg outline-none">
                    
                    <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-[900] py-6 rounded-2xl text-sm uppercase tracking-[0.3em] shadow-[0_10px_30px_rgba(0,229,255,0.3)] active:scale-95 transition-all mt-4">Confirmar Orden</button>
                </form>
            </div>
        </section>

        <section id="tab-mes" class="tab-content hidden space-y-4">
            <div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center">
                <input type="month" id="filtroMes" class="bg-transparent text-white font-bold outline-none invert" onchange="renderApp()">
                <button onclick="exportarCSV()" class="text-[#00e5ff] font-black text-xs uppercase">Descargar CSV</button>
            </div>
            <div id="listaMes" class="space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-xl border-t border-white/10 flex justify-around p-4 pb-10 z-50">
        <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-2 active-tab">
            <span class="text-3xl">🏦</span><span class="text-[8px] font-black uppercase">Global</span>
        </button>
        <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-2 text-slate-500">
            <span class="text-3xl">📋</span><span class="text-[8px] font-black uppercase">Extracto</span>
        </button>
        <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-2 text-slate-500">
            <span class="text-3xl">➕</span><span class="text-[8px] font-black uppercase">Añadir</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#004481', '#00e5ff', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185', '#d946ef', '#4ade80'];
        let appData = [], mainChart = null;

        async function renderApp() {
            const start = Date.now();
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                document.getElementById('debug-ping').innerText = (Date.now() - start) + "ms";
                document.getElementById('debug-count').innerText = appData.length;

                const hoy = new Date().toISOString().split('T')[0], mesSel = document.getElementById('filtroMes').value;
                let real=0, cats={};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML='';

                appData.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
                    const val = parseFloat(g.importe), isI = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    if (g.fecha <= hoy) isI ? real+=val : real-=val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        lMes.innerHTML += itemHTML(g, isI);
                    }
                });
                document.getElementById('valReal').innerText = real.toFixed(2)+"€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function itemHTML(g, isI) {
            return `<div class="bg-bbva-card p-6 rounded-2xl flex justify-between items-center border-l-4 ${isI?'border-[#00e5ff]':'border-rose-500'}">
                <div>
                    <p class="font-black text-white text-base mb-1">${g.concepto}</p>
                    <p class="text-[10px] font-black uppercase tracking-widest">
                        <span class="text-slate-500">${g.categoria}</span> 
                        <span class="mx-2 text-slate-800">•</span> 
                        <span style="color: #00e5ff !important;">Día ${g.fecha.split('-')[2]}</span>
                    </p>
                </div>
                <p class="font-[900] text-xl ${isI?'text-[#00e5ff]':'text-rose-400'}">${parseFloat(g.importe).toFixed(2)}€</p>
            </div>`;
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            if (labels.length === 0) return;
            
            mainChart = new Chart(ctx, { 
                type: 'doughnut', 
                data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 4, borderColor: '#072146', hoverOffset: 20 }] }, 
                options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '75%' } 
            });

            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-4">
                        <div class="w-3 h-3 rounded-full" style="background:${COLORS[i]}"></div>
                        <span class="text-xs font-black text-slate-300 uppercase">${l}</span>
                    </div>
                    <span class="text-sm font-[900] text-white">${values[i].toFixed(2)}€</span>
                </div>`).join('');
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }
        
        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
        renderApp();
    </script>
</body>
</html>
