<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v12.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; overflow-x: hidden; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        .main-container { height: calc(100vh - 70px); overflow-y: auto; padding: 5px; }
        nav { height: 70px; padding-bottom: 15px !important; }

        #alert-pago {
            background: linear-gradient(90deg, #004481 0%, #072146 100%);
            border-left: 5px solid var(--bbva-cyan);
            padding: 12px; border-radius: 10px; margin-bottom: 5px;
            display: none; align-items: center; justify-content: space-between;
            font-size: 11px; color: var(--bbva-cyan); font-weight: 900;
        }

        /* Estilo para los botones de edición */
        .btn-action { padding: 8px; border-radius: 10px; font-size: 16px; opacity: 0.6; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 1; }
        .btn-edit { color: var(--bbva-cyan); background: rgba(0, 229, 255, 0.1); }
        .btn-delete { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body class="bg-black">

    <div id="pin-screen">
        <div class="text-center mb-10 italic font-[900] text-[#00e5ff] text-4xl tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] opacity-30 font-bold uppercase">Reset</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="deleteLast()" class="text-[10px] opacity-30 font-bold uppercase">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-3 flex justify-between items-center bg-black border-b border-white/10 sticky top-0 z-50">
            <div class="flex flex-col">
                <h1 class="font-[900] text-xl italic leading-none">BBVA</h1>
                <span class="text-[8px] text-cyan-400 uppercase tracking-widest font-black mt-1">v12.3 Master</span>
            </div>
            <div class="flex gap-4 items-center">
                <button onclick="togglePrivacy()" id="eye-icon" class="text-xl">👁️</button>
                <button onclick="location.reload()" class="opacity-40">🔒</button>
            </div>
        </header>

        <main class="main-container">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-2">
                <div id="alert-pago">
                    <span id="alert-text">ALERTA DE PAGO INMINENTE</span>
                    <button onclick="resetAllAlerts()" class="bg-cyan-400 text-navy-900 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase text-[#072146]">OK</button>
                </div>
                
                <div class="p-8 rounded-[2rem] text-center bbva-gradient border border-white/5 relative overflow-hidden shadow-2xl">
                    <p class="text-[10px] uppercase tracking-[0.2em] text-white/40 mb-2 font-bold">Patrimonio Neto</p>
                    <h2 id="valReal" class="text-5xl font-black italic tracking-tighter text-white">****€</h2>
                </div>

                <div class="bg-bbva-card p-4 rounded-[2rem] border border-white/5">
                    <div style="height:190px"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 mt-5"></div>
                </div>
                
                <button onclick="resetAllAlerts()" class="text-[8px] text-zinc-600 uppercase font-black mt-3">Limpiar configuración alertas</button>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2">
                <div class="bg-bbva-card p-3 rounded-xl border border-white/5">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-black outline-none w-full text-lg" onchange="renderApp()">
                </div>
                <div id="listaMes" class="space-y-2 pb-24"></div>
            </section>

            <section id="tab-add" class="tab-content hidden pt-1">
                <div class="bg-bbva-card p-6 rounded-[2.5rem] border-t-4 border-cyan-400 shadow-xl">
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="in-id">
                        <div>
                            <label class="text-[10px] font-black text-cyan-400 uppercase ml-2 tracking-widest">Concepto</label>
                            <input type="text" id="in-concepto" placeholder="Concepto (ej: Alquiler)" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-400/50" required>
                        </div>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-black text-4xl text-white text-center outline-none" required>
                        
                        <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/10">
                            <span class="text-[10px] font-black uppercase text-white/40 italic">¿Pago Programado?</span>
                            <input type="checkbox" id="in-es-recurrente" class="w-6 h-6 accent-cyan-400">
                        </div>
                        <div id="config-recurrente" class="hidden">
                            <input type="number" id="in-dia-pago" min="1" max="31" placeholder="Día del mes (1-31)" class="w-full p-4 bg-cyan-900/30 border border-cyan-400/30 rounded-xl text-white outline-none font-bold">
                        </div>

                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-lg font-bold">
                            <optgroup label="INGRESOS"><option value="Sueldo">💰 Sueldo</option><option value="Otros Ingresos">💵 Otros Ingresos</option></optgroup>
                            <optgroup label="GASTOS"><option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option><option value="Amazon">📦 Amazon</option><option value="PayPal">💳 PayPal</option><option value="Gasolina">⛽ Gasolina</option></optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-sm font-bold">
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-navy-900 font-black py-5 rounded-2xl uppercase text-[11px] shadow-xl text-[#072146] tracking-widest">Confirmar Operación</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/10 flex justify-around items-center z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab"><span class="text-2xl">🏦</span><span class="text-[7px] font-black uppercase tracking-widest">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-2xl">📋</span><span class="text-[7px] font-black uppercase tracking-widest">Lista</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-2xl">➕</span><span class="text-[7px] font-black uppercase tracking-widest">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00e5ff', '#004481', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185'];
        let appData = [], currentPinInput = "", isPrivate = true, mainChart = null;
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(currentPinInput === (localStorage.getItem('bbva_user_pin') || "1234")) unlock();
                    else { alert("PIN Incorrecto"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('eye-icon').innerText = isPrivate ? '👁️' : '🙈'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date();
                const mesSel = document.getElementById('filtroMes').value;
                let total = 0, cats = {};
                const list = document.getElementById('listaMes'); list.innerHTML = '';

                appData.forEach(g => {
                    const v = parseFloat(g.importe) || 0;
                    const isI = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoy.toISOString().split('T')[0]) esI ? total += v : total -= v;

                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + v;
                        list.innerHTML += `
                            <div class="bg-bbva-card p-3 rounded-2xl flex justify-between items-center border-l-4 ${isI?'border-cyan-400':'border-rose-500'}">
                                <div><p class="font-bold text-white text-base">${g.concepto}</p><p class="text-[9px] text-white/40 uppercase font-black">${g.categoria} • ${g.fecha}</p></div>
                                <div class="flex items-center gap-2">
                                    <p class="font-black text-lg ${isI?'text-cyan-400':'text-rose-400'}">${isPrivate?'****':v.toFixed(2)}€</p>
                                    <button onclick="preEdit('${g._id}')" class="btn-action btn-edit">✏️</button>
                                    <button onclick="deleteGasto('${g._id}')" class="btn-action btn-delete">🗑️</button>
                                </div>
                            </div>`;
                    }
                });

                // Alerta Recurrentes
                const banner = document.getElementById('alert-pago'); banner.style.display = 'none';
                recurrentes.forEach(r => {
                    if (hoy.getDate() >= r.dia) {
                        total -= r.importe;
                        if(hoy.getDate() === r.dia) {
                            document.getElementById('alert-text').innerText = `⚠️ ATENCIÓN: Hoy toca el pago de "${r.concepto}" (-${r.importe}€)`;
                            banner.style.display = 'flex';
                        }
                    }
                });

                document.getElementById('valReal').innerText = isPrivate ? "****€" : total.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0, hoverOffset: 10 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="bg-white/5 p-3 rounded-2xl flex justify-between items-center border border-white/5 overflow-hidden">
                    <div class="flex items-center gap-2 truncate"><div class="w-3 h-3 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[10px] font-bold uppercase text-slate-400 truncate w-20">${l}</span></div>
                    <span class="text-xs font-black text-white">${isPrivate?'***':data[l].toFixed(0)}€</span>
                </div>`).join('');
        }

        async function deleteGasto(id) {
            if(confirm("¿Eliminar este registro permanentemente?")) {
                const g = appData.find(x => x._id === id);
                recurrentes = recurrentes.filter(r => r.concepto !== g.concepto);
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                renderApp();
            }
        }

        // FUNCIÓN PRE-EDICIÓN (NUEVA)
        function preEdit(id) {
            const g = appData.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            document.getElementById('btn-submit').innerText = "Actualizar Registro";
            // Cambiar a la pestaña "Operar"
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { 
                concepto: document.getElementById('in-concepto').value, 
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            
            // Si es un POST (nuevo), añadir a recurrentes si aplica. En PUT (edición) no lo tocamos.
            if(!id && document.getElementById('in-es-recurrente').checked) {
                recurrentes.push({ concepto: data.concepto, importe: data.importe, dia: parseInt(document.getElementById('in-dia-pago').value) });
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
            }
            
            // Decidir si es PUT (edición) o POST (nuevo)
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            
            // Limpiar formulario y resetear botón
            document.getElementById('mainForm').reset();
            document.getElementById('in-id').value = "";
            document.getElementById('btn-submit').innerText = "Confirmar Operación";
            
            // Volver a la pestaña principal
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-white/40')); 
            el.classList.replace('text-white/40', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function resetAllAlerts() { if(confirm("¿Limpiar caché de alertas?")) { recurrentes = []; localStorage.setItem('bbva_recurrentes', '[]'); renderApp(); } }
        
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
        document.getElementById('in-es-recurrente').addEventListener('change', function() { document.getElementById('config-recurrente').classList.toggle('hidden', !this.checked); });
    </script>
</body>
</html>
