<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Presupuesto Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans pb-10">

    <nav class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 text-center">
        <h1 class="text-xl font-bold">Control de Gastos 📈</h1>
    </nav>

    <main class="max-w-md mx-auto p-4">

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6 mt-2">
            <div class="mb-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Presupuesto de:</label>
                <input type="month" id="mesSeleccionado" class="w-full p-2 bg-slate-50 rounded-xl border-none text-lg font-bold text-slate-700" onchange="cargarGastos()">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-green-50 p-3 rounded-2xl border border-green-100">
                    <p class="text-[10px] text-green-600 font-bold uppercase">Entradas</p>
                    <p id="totalIngresos" class="text-lg font-black text-green-700">0.00€</p>
                </div>
                <div class="bg-red-50 p-3 rounded-2xl border border-red-100">
                    <p class="text-[10px] text-red-600 font-bold uppercase">Salidas</p>
                    <p id="totalGastos" class="text-lg font-black text-red-700">0.00€</p>
                </div>
            </div>

            <div id="balanceContainer" class="mt-4 p-4 rounded-2xl text-center shadow-inner transition-colors duration-500">
                <p class="text-xs font-medium opacity-80 mb-1 uppercase tracking-tighter">Disponible en cuenta</p>
                <p id="balanceTotal" class="text-3xl font-black">0.00€</p>
            </div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
            <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="bg-indigo-100 p-1 rounded-md text-indigo-600">➕</span> Nuevo Movimiento
            </h2>
            <form id="gastoForm" class="space-y-3">
                <input type="text" id="concepto" placeholder="¿En qué lo gastaste?" class="w-full p-3 bg-slate-50 rounded-xl border-none focus:ring-2 focus:ring-indigo-500 outline-none" required>
                <input type="number" id="importe" step="0.01" placeholder="Importe (0.00€)" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" required>
               <select id="categoria" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none font-medium text-slate-700">
    <option value="Sueldo">💰 Sueldo</option>
    <option value="Otros Ingresos">💵 Otros Ingresos</option>
    <option value="El Corte Inglés">🛍️ El Corte Inglés</option>
    <option value="BBVA Tarjeta">🟦 BBVA Tarjeta</option>
    <option value="BBVA Explora">🚀 BBVA Explora</option>
    <option value="Imagine">🟣 Imagine</option>
    <option value="PayPal">💳 PayPal</option>
    <option value="Amazon">📦 Amazon</option>
    <option value="Gasolina">⛽ Gasolina</option>
</select>

                <input type="date" id="fecha" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-4 rounded-2xl transition-all shadow-lg shadow-indigo-100">Registrar Movimiento</button>
            </form>
        </div>

        <div class="mb-2 flex justify-between items-center px-2">
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-widest">Movimientos del mes</h2>
        </div>
        <ul id="listaGastos" class="space-y-3">
            </ul>
    </main>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos'; 
        // <-- IMPORTANTE: Pon tu URL real aquí

        // Poner el mes actual por defecto
        document.getElementById('mesSeleccionado').value = new Date().toISOString().slice(0, 7);
        document.getElementById('fecha').valueAsDate = new Date();

        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoGasto = {
                concepto: document.getElementById('concepto').value,
                importe: document.getElementById('importe').value,
                categoria: document.getElementById('categoria').value,
                fecha: document.getElementById('fecha').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoGasto)
            });

            e.target.reset();
            document.getElementById('fecha').valueAsDate = new Date();
            cargarGastos();
        });

        async function cargarGastos() {
            const res = await fetch(API_URL);
            const gastos = await res.json();
            const mesActual = document.getElementById('mesSeleccionado').value;

            let ingresos = 0;
            let gastosTotales = 0;
            const lista = document.getElementById('listaGastos');
            lista.innerHTML = '';

            // Filtrar por el mes elegido
            const filtrados = gastos.filter(g => g.fecha && g.fecha.startsWith(mesActual));

            filtrados.reverse().forEach(g => {
                const monto = parseFloat(g.importe);
                const esIngreso = g.categoria === 'Sueldo' || g.categoria === 'Otros Ingresos';
                
                if (esIngreso) ingresos += monto;
                else gastosTotales += monto;

                const colorImporte = esIngreso ? 'text-green-600' : 'text-red-600';
                const simbolo = esIngreso ? '+' : '-';

                lista.innerHTML += `
                    <li class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center animate-fade-in">
                        <div class="flex items-center gap-3">
                            <button onclick="eliminarGasto('${g._id}')" class="bg-red-50 text-red-400 p-2 rounded-xl hover:bg-red-100 transition-colors">🗑️</button>
                            <div>
                                <p class="font-bold text-slate-800 text-sm">${g.concepto}</p>
                                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter">${g.categoria}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="${colorImporte} font-black">${simbolo}${monto.toFixed(2)}€</p>
                            <p class="text-[10px] text-slate-300 font-medium">${g.fecha}</p>
                        </div>
                    </li>`;
            });

            // Actualizar Totales
            document.getElementById('totalIngresos').innerText = ingresos.toFixed(2) + '€';
            document.getElementById('totalGastos').innerText = gastosTotales.toFixed(2) + '€';
            
            const balance = ingresos - gastosTotales;
            const balanceElem = document.getElementById('balanceTotal');
            const container = document.getElementById('balanceContainer');
            
            balanceElem.innerText = balance.toFixed(2) + '€';
            
            if (balance >= 0) {
                container.className = 'mt-4 p-4 rounded-2xl text-center shadow-md bg-indigo-600 text-white';
            } else {
                container.className = 'mt-4 p-4 rounded-2xl text-center shadow-md bg-red-600 text-white';
            }
        }

        async function eliminarGasto(id) {
            if (!confirm("¿Eliminar este registro?")) return;
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            cargarGastos();
        }

        cargarGastos();
    </script>
</body>
</html>
