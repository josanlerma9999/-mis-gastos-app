    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let touchstartX = 0, touchendX = 0, currentTabIndex = 0;
        let pin = "", isPrivate = false, appData = [];
        const categIngresos = ["Sueldo", "Otros Ingresos"];
        let gastosChart = null; 
let pagosProcesados = false; 
let lastFetch = 0; 



        // PIN PAD
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        }); 

        function goToTab(i) {
            currentTabIndex = i;
            document.getElementById('main-view').style.transform = `translateX(-${i * 16.666}%)`;

            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
            if(i === 0) setTimeout(updateChart, 100);
        } 

                async function renderApp() {
    // 1. PRIORIDAD ABSOLUTA: Cargar lo que el usuario ve en su móvil
    const cache = localStorage.getItem('appData_cache');
    if (cache) {
        appData = JSON.parse(cache);
        actualizarInterfaz();
    }

    // 2. Gestión de títulos y conexión (Estético)
    document.title = navigator.onLine ? "BBVA Premium v16.6" : "BBVA (Sin conexión) ⚠️";

    // 3. CONTROL DE SEGURIDAD (Para evitar que el servidor "resucite" gastos borrados)
    const now = Date.now();
    if (now < lastFetch) { 
        console.log("Bloqueo de seguridad activo: Esperando al servidor...");
        return; 
    }
    
    if (now - lastFetch < 5000) {
        console.log("Datos frescos en pantalla. No hace falta descargar.");
        return; 
    }

    // 4. DESCARGA REAL DEL SERVIDOR
    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("API error"); 

        lastFetch = Date.now(); 
        const dataFresh = await res.json();
        const hoy = new Date().toISOString().split('T')[0]; 

        appData = dataFresh.map(g => ({ ...g, importe: parseFloat(g.importe) })); 

        // Ordenación de la lista
        appData.sort((a, b) => {
            if (a.fecha <= hoy && b.fecha > hoy) return -1;
            if (a.fecha > hoy && b.fecha <= hoy) return 1;
            return b.fecha.localeCompare(a.fecha);
        }); 

        // Guardamos la verdad del servidor en la caché
        localStorage.setItem('appData_cache', JSON.stringify(appData));
        actualizarInterfaz();
        procesarPagosAutomaticos(); 

    } catch (e) {
        console.error("Error cargando datos:", e);
    }
}


function obtenerLogo(concepto) {
    const c = concepto.toLowerCase();
    // Definimos las reglas: [Palabra clave, Color Fondo, Letra/Icono]
                const reglas = [
        ['nala', '#FFC0CB', '🐶'],
        ['portátil', '#475569', '💻'],
        ['recarga', '#22c55e', '⚡️'],
        ['tarjeta', '#00e5ff', '💳'], // <-- Nueva regla para cualquier concepto con "tarjeta"
        ['amazon', '#FF9900', 'A'],
        ['mercadona', '#00a650', 'M'],
        ['netflix', '#E50914', 'N'],
        ['spotify', '#1DB954', 'S'],
        ['carrefour', '#0046BE', 'C'],
        ['sueldo', '#22c55e', '€'],
        ['nomina', '#22c55e', '€'],
        ['gasolina', '#4b5563', '⛽'],
        ['hbo', '#000000', 'H'],
        ['zara', '#000000', 'Z'],
        ['apple', '#000000', '🍎']
];



    const match = reglas.find(r => c.trim().includes(r[0]));

    if (match) {
        return `<div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-lg" style="background:${match[1]}">${match[2]}</div>`;
    }
    
    // Si no lo reconoce, usa la primera letra en gris
    const inicial = concepto.charAt(0).toUpperCase();
    return `<div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg bg-slate-700 shadow-lg">${inicial}</div>`;
}

       function actualizarInterfaz() {
    // 1. Definimos "HOY" al principio del día (00:00:00) para evitar problemas de horas
    const ahora = new Date();
    const hoyStr = ahora.getFullYear() + '-' + String(ahora.getMonth() + 1).padStart(2, '0') + '-' + String(ahora.getDate()).padStart(2, '0');
    const hoyRef = new Date(hoyStr + "T00:00:00").getTime();
    
    const mesSel = document.getElementById('filtroMes').value;
    let saldoReal = 0, gFuturos = 0, iFuturos = 0;
    
    let deudaAqua = 0;
    let deudaExplora = 0; 

    document.getElementById('listaPasado').innerHTML = '';
    document.getElementById('listaFuturo').innerHTML = ''; 

    appData.forEach(g => {
        const val = Math.abs(parseFloat(g.importe));
        const esI = categIngresos.includes(g.categoria);
        
        // 2. Convertimos la fecha del gasto también al inicio del día
        const fechaGastoRef = new Date(g.fecha + "T00:00:00").getTime();
        
        // Si la fecha del gasto es MENOR O IGUAL a hoy, es PASADO (Saldo Real)
        const esP = fechaGastoRef <= hoyRef; 
        
        if (g.categoria === "Tarjeta Aqua") deudaAqua += val;
        if (g.categoria === "Tarjeta Explora") deudaExplora += val; 

        if(esP) { 
            esI ? saldoReal += val : saldoReal -= val; 
        } else { 
            esI ? iFuturos += val : gFuturos += val; 
        }
        
        const disp = isPrivate ? "****€" : val.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€"; 

        // RENDER LISTA MOVIMIENTOS
        if(g.fecha.startsWith(mesSel)) {
            const logoHTML = obtenerLogo(g.concepto); 
            
            // CLAVE: La opacidad y el borde azul SOLO si es estrictamente posterior a hoy (esP es falso)
            const estiloFuturo = !esP ? 'opacity-40 border-l-4 border-cyan-400' : '';
            
            document.getElementById('listaPasado').insertAdjacentHTML('beforeend', `
                <div class="bbva-card p-4 flex justify-between items-center gap-3 ${val > 100 && !esI ? 'border-r-4 border-rose-500/30' : ''} ${estiloFuturo}">
                    <div class="flex items-center gap-3 flex-1 overflow-hidden">
                        ${logoHTML}
                        <div class="truncate">
                            <p class="text-sm font-bold text-white truncate">${g.concepto}</p>
                            <p class="text-[9px] text-slate-500 uppercase mt-1">${g.fecha} • ${g.categoria}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <p class="font-black whitespace-nowrap ${esI ? 'text-cyan-400' : (val > 100 ? 'text-rose-400' : 'text-white')}">
                            ${esI ? '+' : '-'}${disp}
                        </p>
                        <button onclick="event.stopPropagation(); deleteGasto('${g._id}')" class="btn-action text-rose-500">🗑️</button>
                    </div>
                </div>`);
        } 

        // RENDER LISTA PREVISIÓN (Solo si es futuro estricto)
        if(!esP) {
            document.getElementById('listaFuturo').insertAdjacentHTML('beforeend', `
                <div class="bbva-card border-l-4 border-cyan-400 p-5 flex justify-between items-center">
                    <div><p class="font-black text-white">${g.concepto}</p><p class="text-[10px] text-slate-500">${g.fecha}</p></div>
                    <p class="text-xl font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI ? '+' : '-'}${disp}</p>
                </div>`);
        }
    });

    // Actualización de textos de saldo...
    const valRealElement = document.getElementById('valReal');
    valRealElement.innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
    valRealElement.className = "text-6xl font-black tracking-tighter leading-tight transition-all duration-500 " + 
        (saldoReal > 200 ? 'text-cyan-400' : (saldoReal >= 100 ? 'text-amber-400' : 'text-rose-500')); 

    document.getElementById('valPend').innerText = isPrivate ? "****€" : "-" + gFuturos.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
    document.getElementById('valProj').innerText = isPrivate ? "****€" : (saldoReal - gFuturos + iFuturos).toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
    
    document.getElementById('card-aqua-val').innerText = isPrivate ? "****€" : deudaAqua.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
    document.getElementById('card-explora-val').innerText = isPrivate ? "****€" : deudaExplora.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€"; 

    renderRecurrentes();
    updateChart();
}


document.getElementById('mainForm').onsubmit = async (e) => {
    e.preventDefault();
    const concepto = document.getElementById('in-concepto').value;
    const importe = parseFloat(document.getElementById('in-importe').value);
    const categoria = document.getElementById('in-categoria').value;
    const fecha = document.getElementById('in-fecha').value;
    const esRecurrente = document.getElementById('check-recurrente').checked; 

    // 1. ACTUALIZACIÓN OPTIMISTA (Inmediata)
    const nuevoGastoLocal = {
        _id: "temp-" + Date.now(), 
        concepto,
        importe,
        categoria,
        fecha
    };

    // Añadimos al principio del array y refrescamos la pantalla ya mismo
    appData.unshift(nuevoGastoLocal);
    actualizarInterfaz();
    goToTab(0); // Volvemos al inicio para ver el nuevo saldo
    
    // Limpiamos el formulario para que quede listo
    e.target.reset();

    // 2. ENVÍO REAL A LA API (Por detrás)
    try {
        await fetch(API_URL, { 
            method: 'POST', 
            headers: {'Content-Type':'application/json'}, 
            body: JSON.stringify({ concepto, importe, categoria, fecha }) 
        }); 

        if(esRecurrente) {
            const diaPago = fecha.split('-')[2];
            let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            if (!recs.some(p => p.concepto === concepto)) {
                recs.push({ concepto, importe, dia: diaPago, categoria, id: Date.now() });
                localStorage.setItem('recurrentes', JSON.stringify(recs));
            }
        }
        
        // Actualizamos la caché de fondo
        localStorage.setItem('appData_cache', JSON.stringify(appData));

    } catch (error) {
        console.error("Error al guardar en el servidor:", error);
    }
}; 
 
function updateChart() {
    const canvas = document.getElementById('gastosChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const mesActual = new Date().toISOString().slice(0, 7);
    const desglose = {};
    
    appData.forEach(g => {
        if(g.fecha.startsWith(mesActual) && !categIngresos.includes(g.categoria) && g.fecha <= new Date().toISOString().split('T')[0]) {
            desglose[g.categoria] = (desglose[g.categoria] || 0) + Math.abs(parseFloat(g.importe));
        }
    });

    const labels = Object.keys(desglose);
    const data = Object.values(desglose);

    // --- AQUÍ PEGAS TU MEJORA ---
    if (gastosChart) {
        gastosChart.destroy();
    }
    // ---------------------------

    gastosChart = new Chart(ctx, {
        type: 'doughnut',
        data: { 
            labels, 
            datasets: [{ 
                data, 
                backgroundColor: ['#00e5ff','#7c4dff','#ff4081','#ffee33','#4caf50','#ff9800','#E0E0E0','#0091EA','#8D6E63','#26A69A'], 
                borderColor: '#072146', 
                borderWidth: 2 
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            cutout: '75%', 
            plugins: { 
                legend: { 
                    position: 'right', 
                    labels: { color: 'white', font: { size: 10 }, boxWidth: 10 } 
                } 
            },
            onClick: (e, i) => { if(i.length > 0) aplicarFiltroCategoria(labels[i[0].index]); }
        }
    });
}
 
function aplicarFiltroCategoria(cat) {
            const lista = document.getElementById('listaPasado');
            const catLimpia = cat.replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '').trim().toLowerCase();
            goToTab(3); 
            setTimeout(() => {
                let encontrados = 0;
                lista.querySelectorAll('.bbva-card').forEach(card => {
                    const match = card.innerText.toLowerCase().includes(catLimpia);
                    card.style.display = match ? 'flex' : 'none';
                    if(match) encontrados++;
                });
                const oldBtn = document.getElementById('btn-quitar-filtro'); if (oldBtn) oldBtn.remove();
                const btn = document.createElement('button');
                btn.id = 'btn-quitar-filtro';
                btn.className = "w-full mb-4 py-3 bg-cyan-400/10 text-cyan-400 text-[11px] font-black uppercase rounded-xl border border-cyan-400/20";
                btn.innerHTML = `Filtrado: ${cat} (${encontrados}) ✕`;
                btn.onclick = () => { renderApp(); btn.remove(); };
                lista.prepend(btn);
            }, 350);
        } 

        function renderRecurrentes() {
            const container = document.getElementById('listaRecurrentes');
            let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            container.innerHTML = recs.map(p => `
                <div class="bbva-card p-4 flex justify-between items-center border-l-4 border-purple-500">
                    <div><p class="font-bold text-white">${p.concepto}</p><p class="text-[10px] text-slate-500">Día ${p.dia} de cada mes</p></div>
                    <div class="flex items-center gap-2"><p class="font-black text-rose-400">-${parseFloat(p.importe).toFixed(2)}€</p>
                    <button onclick="borrarRecurrente(${p.id})" class="text-xs opacity-30">🗑️</button></div>
                </div>`).join('');
        } 

        async function procesarPagosAutomaticos() {
    // Si ya se procesaron en esta sesión, no hace nada más
    if (pagosProcesados) return; 

    const hoy = new Date();
    const diaHoy = hoy.getDate();
    const mesActual = hoy.toISOString().slice(0, 7);
    let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");

    for (let p of recs) {
        if (diaHoy >= parseInt(p.dia)) {
            const f = `${mesActual}-${p.dia.padStart(2, '0')}`;
            
            // AQUÍ ESTÁ TU MEJORA: Comprobación triple (Concepto + Fecha + Categoría)
            const yaExiste = appData.some(g => 
                g.concepto === p.concepto && 
                g.fecha === f &&
                g.categoria === p.categoria
            );

            if (!yaExiste) {
                await fetch(API_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({ 
                        concepto: p.concepto, 
                        importe: p.importe, 
                        categoria: p.categoria, 
                        fecha: f 
                    }) 
                });
            }
        }
    }
    
    pagosProcesados = true;
    console.log("Pagos automáticos revisados con triple validación.");
}
async function borrarRecurrente(id) {
            if(!confirm("¿Borrar por completo de fijos, movimientos y saldo final?")) return;
            let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            const pagoFijo = recs.find(p => p.id === id);
            if (pagoFijo) {
                const mesActual = new Date().toISOString().slice(0, 7);
                const gastosABorrar = appData.filter(g => 
                    g.concepto === pagoFijo.concepto && g.fecha.startsWith(mesActual)
                );
                for (let gasto of gastosABorrar) {
                    try { await fetch(`${API_URL}/${gasto._id}`, { method: 'DELETE' }); } catch (err) { console.error("Error:", err); }
                }
                appData = appData.filter(g => !(g.concepto === pagoFijo.concepto && g.fecha.startsWith(mesActual)));
            }
            recs = recs.filter(p => p.id !== id);
            localStorage.setItem('recurrentes', JSON.stringify(recs));
            localStorage.removeItem('appData_cache');
            renderApp();
        }

        async function deleteGasto(id) {
    if (confirm("¿Eliminar este movimiento?")) {
        // 1. ELIMINACIÓN LOCAL RADICAL
        // Lo quitamos de appData y de la caché antes de hacer nada más
        appData = appData.filter(g => g._id !== id);
        localStorage.setItem('appData_cache', JSON.stringify(appData));
        
        // 2. ACTUALIZAR PANTALLA YA
        actualizarInterfaz();

        // 3. BLOQUEAR QUE EL SERVIDOR LO RESUCITE
        // Ponemos lastFetch con el tiempo actual para que renderApp 
        // no pida datos al servidor en los próximos 10 segundos
        lastFetch = Date.now() + 5000; 

        // 4. AVISO AL SERVIDOR EN SEGUNDO PLANO
        if (!id.toString().startsWith('temp-')) {
            try {
                const res = await fetch(`${API_URL}/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    console.log("Servidor: Borrado confirmado.");
                    // Solo después de que el servidor confirma, permitimos volver a pedir datos
                    lastFetch = 0; 
                }
            } catch (err) {
                console.error("Error de red, pero el gasto sigue borrado en tu móvil:", err);
            }
        }
    }
}


 
        function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); } 

        const vp = document.getElementById('viewport');
        vp.addEventListener('touchstart', e => touchstartX = e.changedTouches[0].screenX, {passive:true});
        vp.addEventListener('touchend', e => { 
            touchendX = e.changedTouches[0].screenX; 
            const dx = touchendX - touchstartX;
            if(Math.abs(dx) > 80) dx < 0 ? (currentTabIndex < 5 && goToTab(currentTabIndex+1)) : (currentTabIndex > 0 && goToTab(currentTabIndex-1));
        }, {passive:true});
        
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
