<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Financiero v6.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .active-tab { color: #10b981; border-top: 3px solid #10b981; font-weight: 900; }
        .hidden { display: none; }
        .font-black { font-weight: 900; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-24 text-slate-900">

    <nav class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 id="tituloFiltro" class="text-lg font-black tracking-tighter">Mi Cuenta Real</h1>
        <span class="bg-emerald-500 px-2 py-1 rounded text-[10px] font-black uppercase tracking-tighter">v6.6 💎</span>
    </nav>

    <main class="max-w-md mx-auto p-4">
        <section id="vista-total" class="seccion-tab">
            <div id="tarjetaBalance" class="bg-emerald-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center transition-all duration-500">
                <p class="text-[10px] uppercase tracking-widest opacity-90 mb-1 font-black">Dinero Actual</p>
                <p id="totalRealCuenta" class="text-4xl font-black italic">0.00€</p>
            </div>

            <div class="bg-slate-800 text-white p-5 rounded-[2rem] shadow-lg mb-6 text-center border-b-4 border-indigo-500 flex justify-between items-center px-8">
                <div>
                    <p class="text-[9px] uppercase tracking-widest opacity-70 font-black text-indigo-300 font-black">Final Mes</p>
                    <p id="totalEstimado" class="text-xl font-black">0.00€</p>
                </div>
                <div class="h-8 w-[1px] bg-slate-700"></div>
                <div>
                    <p class="text-[9px] uppercase tracking-widest opacity-70 font-black text-emerald-300 font-black">En Plan</p>
                    <p id="totalPendiente" class="text-xl font-black text-emerald-400">0.00€</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 mb-6">
                <h3 class="text-[11px] font-black uppercase text-slate-400 mb-4 text-center tracking-widest font-black">Gastos del Mes</h3>
                <div class="relative h-64">
                    <canvas id="graficoGastos"></canvas>
                </div>
                <div id="mensajeSinDatos" class="hidden text-center py-10 text-slate-400 text-xs italic font-black">No hay gastos este mes.</div>
            </div>
        </section>

        <section id="vista-prevision" class="seccion-tab hidden">
            <div class="bg-indigo-50 p-4 rounded-2xl mb-4 border border-indigo-100">
                <p class="text-[10px] font-black text-indigo-600 uppercase font-black italic text-center">🗓️ Movimientos Programados</p>
            </div>
            <ul id="listaPrevision" class="space-y-3 pt-2"></ul>
        </section>

        <section id="vista-mes" class="seccion-tab hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-slate-100 text-center">
                <input type="month" id="mesFiltro" class="font-black outline-none border-none bg-transparent" onchange="cargarDatos()">
            </div>
            <div class="grid grid-cols-2 gap-3 mb-6 font-black uppercase text-[10px]">
                <div class="bg-emerald-50 p-4 rounded-2xl text-center text-emerald-700 border border-emerald-100">
                    <p class="font-black">Ingresos</p><p id="ingresosMes" class="text-lg font-black">0.00€</p>
                </div>
                <div class="bg-rose-50 p-4 rounded-2xl text-center text-rose-700 border border-rose-100">
                    <p class="font-black">Gastos</p><p id="gastosMes" class="text-lg font-black">0.00€</p>
                </div>
            </div>
            <ul id="listaGastos" class="space-y-2"></ul>
        </section>

        <section id="vista-add" class="seccion-tab hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <form id="gastoForm" class="space-y-4">
                    <input type="text" id="concepto" placeholder="¿Qué es?" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" required>
                    <input type="number" id="importe" step="0.01" placeholder="Importe (€)" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-black" required>
                    <select id="categoria" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Otros Ingresos">💵 Otros Ingresos</option>
                        <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                        <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                        <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                        <option value="Imagine">🟣 Imagine</option>
                        <option value="PayPal">💳 PayPal</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                    </select>
                    <input type="date" id="fecha" class="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" required>
                    <button type="submit" class="w-full bg-slate-900 text-white font-black p-5 rounded-2xl shadow-xl">GUARDAR</button>
                </form>
                <button onclick="resetearTodo()" class="w-full mt-10 text-slate-300 text-[9px] font-black uppercase p-2 tracking-widest italic">♻️ Borrar todo y empezar de cero</button>
            </div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around p-2 pb-6 shadow-2xl z-50">
        <button onclick="cambiarTab('vista-total', this)" class="tab-btn flex flex-col items-center p-2 active-tab">
            <span class="text-2xl">💰</span><span class="text-[9px] uppercase font-black">Cuenta</span>
        </button>
        <button onclick="cambiarTab('vista-prevision', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">🗓️</span><span class="text-[9px] uppercase font-black">Plan</span>
        </button>
        <button onclick="cambiarTab('vista-mes', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">📊</span><span class="text-[9px] uppercase font-black">Mes</span>
        </button>
        <button onclick="cambiarTab('vista-add', this)" class="tab-btn flex flex-col items-center p-2 text-slate-400">
            <span class="text-2xl">➕</span><span class="text-[9px] uppercase font-black">Add</span>
        </button>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos'; 
        let miGrafico = null;

        document.getElementById('mesFiltro').value = new Date().toISOString().slice(0, 7);
        document.getElementById('fecha').valueAsDate = new Date();

        function cambiarTab(id, el) {
            document.querySelectorAll('.seccion-tab').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active-tab'); b.classList.add('text-slate-400'); });
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active-tab'); el.classList.remove('text-slate-400');
            cargarDatos();
        }

        async function cargarDatos() {
            try {
                const res = await fetch(API_URL);
                const todos = await res.json();
                
                // Fecha de HOY exacta para comparar
                const hoy = new Date();
                hoy.setHours(0,0,0,0);
                const hoyStr = hoy.toISOString().split('T')[0];

                const mesSel = document.getElementById('mesFiltro').value;

                let balanceActual = 0, balancePrevision = 0, ingresosMes = 0, gastosMes = 0;
                let resumenCats = {};

                const listaM = document.getElementById('listaGastos');
                const listaP = document.getElementById('listaPrevision');
                listaM.innerHTML = ''; listaP.innerHTML = '';

                todos.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach(g => {
                    if (!g.importe || !g.categoria) return;
                    const monto = parseFloat(g.importe);
                    const esIn = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    
                    // Separar Actual de Futuro
                    if (g.fecha <= hoyStr) {
                        if (esIn) balanceActual += monto; else balanceActual -= monto;
                    } else {
                        if (esIn) balancePrevision += monto; else balancePrevision -= monto;
                        // Mostrar en pestaña PLAN
                        listaP.innerHTML += `<li class="bg-white p-4 rounded-2xl border-l-4 border-amber-400 shadow-sm flex justify-between items-center mb-2 animate-fade-in">
                            <div><p class="font-black text-sm text-slate-800">${g.concepto}</p><p class="text-[9px] text-amber-600 font-black uppercase tracking-tighter">${g.fecha}</p></div>
                            <div class="text-right flex items-center gap-3 font-black"><p class="${esIn?'text-emerald-500':'text-rose-500'}">${monto.toFixed(2)}€</p><button onclick="eliminarGasto('${g._id}')">🗑️</button></div>
                        </li>`;
                    }

                    // Historial del Mes y Gráfico
                    if (g.fecha.startsWith(mesSel)) {
                        if (esIn) ingresosMes += monto;
                        else {
                            gastosMes += monto;
                            resumenCats[g.categoria] = (resumenCats[g.categoria] || 0) + monto;
                        }
                        listaM.innerHTML += `<li class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                            <div><p class="font-bold text-xs text-slate-700">${g.concepto}</p><p class="text-[8px] text-slate-400 font-black uppercase">${g.categoria}</p></div>
                            <div class="text-right flex items-center gap-2"><p class="font-black text-xs ${esIn?'text-emerald-500':'text-rose-500'}">${monto.toFixed(2)}€</p><button onclick="eliminarGasto('${g._id}')">🗑️</button></div>
                        </li>`;
                    }
                });

                document.getElementById('totalRealCuenta').innerText = balanceActual.toFixed(2) + '€';
                document.getElementById('totalEstimado').innerText = (balanceActual + balancePrevision).toFixed(2) + '€';
                document.getElementById('totalPendiente').innerText = (balancePrevision >= 0 ? '+' : '') + balancePrevision.toFixed(2) + '€';
                document.getElementById('ingresosMes').innerText = ingresosMes.toFixed(2) + '€';
                document.getElementById('gastosMes').innerText = gastosMes.toFixed(2) + '€';
                
                // Gráfico Circular
                const ctx = document.getElementById('graficoGastos').getContext('2d');
                if (miGrafico) miGrafico.destroy();
                if (Object.keys(resumenCats).length > 0) {
                    document.getElementById('mensajeSinDatos').classList.add('hidden');
                    miGrafico = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(resumenCats),
                            datasets: [{ data: Object.values(resumenCats), backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#3b82f6'], borderWidth: 0 }]
                        },
                        options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9, weight: '900' } } } }, maintainAspectRatio: false }
                    });
                } else { document.getElementById('mensajeSinDatos').classList.remove('hidden'); }

                const tj = document.getElementById('tarjetaBalance');
                tj.className = balanceActual < 0 ? 'bg-rose-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center animate-pulse' : 'bg-emerald-500 text-white p-6 rounded-[2rem] shadow-xl mb-4 text-center';

            } catch (e) { console.error(e); }
        }

        document.getElementById('gastoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n = { concepto: document.getElementById('concepto').value, importe: document.getElementById('importe').value, categoria: document.getElementById('categoria').value, fecha: document.getElementById('fecha').value };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(n) });
            e.target.reset(); document.getElementById('fecha').valueAsDate = new Date();
            await cargarDatos(); cambiarTab('vista-total', document.querySelectorAll('.tab-btn')[0]);
        });

        async function eliminarGasto(id) { if (confirm("¿Borrar este movimiento?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); await cargarDatos(); } }
        async function resetearTodo() { if (confirm("⚠️ ¡PELIGRO! Se borrarán todos tus datos. ¿Confirmas?")) { const res = await fetch(API_URL); const todos = await res.json(); for (let g of todos) { await fetch(`${API_URL}/${g._id}`, { method: 'DELETE' }); } location.reload(); } }
        
        cargarDatos();
    </script>
</body>
</html>
