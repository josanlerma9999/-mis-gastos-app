<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA v9.9 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin:0; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN Overlay */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 8px; }
        .pin-dot.filled { background: var(--bbva-cyan); }
    </style>
</head>
<body class="pb-24">

    <div id="pin-screen">
        <h1 class="font-[900] text-2xl text-[#00e5ff] mb-2 italic">BBVA</h1>
        <p class="text-[10px] uppercase tracking-[0.3em] mb-12 opacity-50">Private Access</p>
        <div class="flex mb-12" id="pin-dots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-6">
            <button onclick="pressPin(1)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">1</button>
            <button onclick="pressPin(2)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">2</button>
            <button onclick="pressPin(3)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">3</button>
            <button onclick="pressPin(4)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">4</button>
            <button onclick="pressPin(5)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">5</button>
            <button onclick="pressPin(6)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">6</button>
            <button onclick="pressPin(7)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">7</button>
            <button onclick="pressPin(8)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">8</button>
            <button onclick="pressPin(9)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">9</button>
            <div></div><button onclick="pressPin(0)" class="w-16 h-16 rounded-full border border-white/10 text-xl font-bold">0</button>
            <button onclick="clearPin()" class="text-[10px] uppercase font-bold opacity-40">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-black/90 p-4 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
            <h1 class="font-[900] text-xl tracking-tighter italic text-[#00e5ff]">BBVA</h1>
            <span class="text-[8px] font-mono opacity-50">PRO-SECURE v9.9</span>
        </header>

        <main class="max-w-md mx-auto p-2">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-2">
                <div class="p-8 rounded-[2rem] text-center bbva-gradient border border-white/10 shadow-2xl">
                    <p class="text-[10px] uppercase font-black tracking-widest mb-1 text-cyan-300/40 italic">Patrimonio Neto</p>
                    <h2 id="valReal" class="text-5xl font-[900] tracking-tighter text-white">0.00€</h2>
                </div>

                <div class="bg-bbva-card p-3 rounded-[2rem] flex flex-col items-center">
                    <div class="h-[210px] w-full"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 w-full mt-2"></div>
                </div>

                <div class="bg-zinc-900/40 p-5 rounded-2xl border border-white/5 mt-8 font-mono text-[9px] text-slate-400 space-y-2">
                    <p class="text-[#00e5ff] font-bold uppercase mb-2 text-[10px] tracking-widest">Advanced Debug Trace</p>
                    <p>> STATUS: <span class="text-emerald-400">ENCRYPTED_SESSION</span></p>
                    <p>> PING: <span id="debug-ping" class="text-white">--</span></p>
                    <p>> DB_RECORDS: <span id="debug-count" class="text-white">--</span></p>
                    <p>> MEMORY: <span id="debug-mem" class="text-white">-- MB</span></p>
                    <p>> AGENT: <span id="debug-ua" class="text-white truncate block">--</span></p>
                    <p>> CRYPTO: <span class="text-white">SHA-256 ACTIVE</span></p>
                    <p class="opacity-20 text-center pt-4">© BBVA PRIVATE BANKING CORE v9.9.2</p>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2">
                <div class="bg-bbva-card p-3 rounded-xl flex justify-between gap-2">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-bold outline-none invert text-xs w-full" onchange="renderApp()">
                    <button onclick="exportarExcel()" class="bg-[#00e5ff] text-[#072146] font-black text-[9px] px-4 py-2 rounded-lg uppercase whitespace-nowrap">Exportar Datos</button>
                </div>
                <div id="listaMes" class="space-y-2"></div>
            </section>

            <section id="tab-add" class="tab-content hidden h-[60vh] flex flex-col justify-center">
                <div class="bg-bbva-card p-6 rounded-[2rem] border-t-2 border-[#00e5ff]">
                    <form id="mainForm" class="space-y-4">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-bold text-3xl text-white outline-none">
                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Amazon">📦 Amazon</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                            <option value="PayPal">💳 PayPal</option>
                            <option value="Gasolina">⛽ Gasolina</option>
                            <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-black py-4 rounded-xl text-xs uppercase">Ejecutar Orden</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/5 flex justify-around p-3 pb-8 z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab"><span class="text-xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Extracto</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#004481', '#00e5ff', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185', '#d946ef'];
        const CORRECT_PIN = "1234"; // CAMBIA TU PIN AQUÍ
        let currentPin = "", appData = [], mainChart = null;

        function pressPin(n) {
            if(currentPin.length < 4) {
                currentPin += n;
                updateDots();
                if(currentPin === CORRECT_PIN) unlock();
                else if(currentPin.length === 4) { alert("PIN INCORRECTO"); clearPin(); }
            }
        }
        function clearPin() { currentPin = ""; updateDots(); }
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => i < currentPin.length ? d.classList.add('filled') : d.classList.remove('filled'));
        }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        async function renderApp() {
            const start = Date.now();
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                document.getElementById('debug-ping').innerText = (Date.now() - start) + "ms";
                document.getElementById('debug-count').innerText = appData.length;
                document.getElementById('debug-mem').innerText = (window.performance.memory ? Math.round(window.performance.memory.usedJSHeapSize/1024/1024) : 'N/A');
                document.getElementById('debug-ua').innerText = navigator.userAgent;

                const hoy = new Date().toISOString().split('T')[0], mesSel = document.getElementById('filtroMes').value;
                let real=0, cats={};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML='';

                appData.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
                    const val = parseFloat(g.importe), isI = ["Sueldo"].includes(g.categoria);
                    if (g.fecha <= hoy) isI ? real+=val : real-=val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        lMes.innerHTML += itemHTML(g, isI);
                    }
                });
                document.getElementById('valReal').innerText = real.toFixed(2)+"€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function itemHTML(g, isI) {
            return `<div class="bg-bbva-card p-4 rounded-xl flex justify-between items-center border-l-2 ${isI?'border-[#00e5ff]':'border-rose-500'}">
                <div><p class="font-bold text-white text-[13px] mb-1">${g.concepto}</p>
                <p class="text-[9px] font-bold uppercase">
                <span class="text-slate-500">${g.categoria}</span> <span class="text-slate-700 mx-1">•</span> 
                <span style="color: #00e5ff !important;">Día ${g.fecha.split('-')[2]}</span></p></div>
                <p class="font-black text-base ${isI?'text-[#00e5ff]':'text-rose-400'}">${parseFloat(g.importe).toFixed(2)}€</p></div>`;
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 2, borderColor: '#072146' }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '80%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center justify-between p-2 bg-white/5 rounded-lg border border-white/5"><div class="flex items-center gap-2 truncate"><div class="w-1.5 h-1.5 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[7px] font-bold text-slate-400 uppercase truncate">${l}</span></div><span class="text-[8px] font-black text-white ml-2">${values[i].toFixed(0)}€</span></div>`).join('');
        }

        function exportarExcel() {
            const mes = document.getElementById('filtroMes').value;
            const filtrados = appData.filter(g => g.fecha.startsWith(mes));
            let csv = "Fecha,Concepto,Categoria,Importe\n";
            filtrados.forEach(g => csv += `${g.fecha},${g.concepto},${g.categoria},${g.importe}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `BBVA_Extracto_${mes}.csv`; a.click();
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
