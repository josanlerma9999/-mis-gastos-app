<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v12.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; overflow: hidden; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .num-btn { width: 75px; height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        /* Contenedores sin márgenes negros laterales */
        .main-container { height: calc(100vh - 75px); overflow-y: auto; padding: 0; } /* Padding 0 para ocupar todo el ancho */
        nav { height: 75px; padding-bottom: 20px !important; }

        /* Ajuste sección OPERAR (Foto 3) */
        #tab-add { padding: 0; }
        #tab-add .bg-bbva-card { border-radius: 0 0 2rem 2rem; border-top: none; }

        /* Estilo botones lista */
        .btn-action { padding: 8px; border-radius: 10px; transition: all 0.2s; }
        .btn-edit { background: rgba(0, 229, 255, 0.1); color: var(--bbva-cyan); }
        .btn-delete { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="text-center mb-10 italic font-[900] text-[#00e5ff] text-4xl uppercase">BBVA</div>
        <div class="flex mb-16" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] opacity-30 font-bold">RESET</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="deleteLast()" class="text-[10px] opacity-30 font-bold">DEL</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black border-b border-white/10">
            <div class="flex flex-col">
                <h1 class="font-[900] text-2xl italic leading-none tracking-tighter">BBVA</h1>
                <span class="text-[10px] text-cyan-400 font-black uppercase tracking-widest mt-1">v12.5 Master</span>
            </div>
            <div class="flex gap-5">
                <button onclick="togglePrivacy()" id="eye-icon" class="text-2xl">👁️</button>
                <button onclick="location.reload()" class="opacity-30 text-2xl">🔒</button>
            </div>
        </header>

        <main class="main-container">
            <section id="tab-cuenta" class="tab-content flex flex-col p-3 gap-3">
                <div id="alert-pago" class="hidden bg-cyan-900/40 border-l-4 border-cyan-400 p-4 rounded-xl text-[11px] font-black text-cyan-400 uppercase text-center flex justify-between items-center">
                    <span id="alert-text">ALERTA</span>
                    <button onclick="resetAllAlerts()" class="bg-cyan-400 text-black px-2 py-1 rounded">OK</button>
                </div>
                
                <div class="p-8 rounded-[2rem] text-center bbva-gradient shadow-2xl border border-white/5">
                    <p class="text-[11px] uppercase tracking-[0.3em] text-white/40 mb-2 font-bold">Patrimonio Global</p>
                    <h2 id="valReal" class="text-5xl font-[900] tracking-tighter italic">****€</h2>
                </div>

                <div class="bg-bbva-card p-5 rounded-[2rem]">
                    <div style="height:190px;"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 mt-5"></div>
                    <button onclick="resetAllAlerts()" class="w-full mt-6 py-2 text-[10px] text-zinc-500 uppercase font-black tracking-[0.2em] border-t border-white/5">Limpiar Caché de Alertas</button>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden p-3 space-y-2">
                <input type="month" id="filtroMes" class="w-full bg-bbva-card p-4 rounded-2xl text-white font-black outline-none text-lg mb-2" onchange="renderApp()">
                <div id="listaMes" class="space-y-2 pb-24"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-6 shadow-2xl border-b-4 border-cyan-400">
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="in-id">
                        <div>
                            <label class="text-[11px] font-[900] text-cyan-400 uppercase ml-1">Concepto</label>
                            <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white text-lg outline-none" required>
                        </div>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-2xl font-[900] text-4xl text-white text-center outline-none" required>
                        
                        <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/10">
                            <span class="text-[11px] font-black uppercase text-slate-400 italic">¿Pago Recurrente?</span>
                            <input type="checkbox" id="in-es-recurrente" class="w-6 h-6 accent-cyan-400">
                        </div>

                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-lg font-bold appearance-none text-center">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="PayPal">💳 PayPal</option>
                            <option value="Amazon">📦 Amazon</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-lg font-bold text-center">
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-[#072146] font-[900] py-5 rounded-2xl uppercase text-base shadow-2xl tracking-widest">Confirmar Operación</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/10 flex justify-around items-center z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab"><span class="text-3xl">🏦</span><span class="text-[8px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center text-slate-500"><span class="text-3xl">📋</span><span class="text-[8px] font-black uppercase">Lista</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center text-slate-500"><span class="text-3xl">➕</span><span class="text-[8px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00e5ff', '#004481', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185'];
        let appData = [], currentPinInput = "", isPrivate = true, mainChart = null;
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(currentPinInput === "1234") unlock();
                    else clearPin();
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('eye-icon').innerText = isPrivate ? '👁️' : '🙈'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoyStr = new Date().toISOString().split('T')[0];
                const mesSel = document.getElementById('filtroMes').value;
                let total = 0, cats = {};
                const list = document.getElementById('listaMes'); list.innerHTML = '';

                appData.forEach(g => {
                    const v = parseFloat(g.importe);
                    const isI = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoyStr) isI ? total += v : total -= v;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + v;
                        list.innerHTML += `
                            <div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center border-l-4 ${isI?'border-cyan-400':'border-rose-500'}">
                                <div><p class="font-[900] text-white text-base">${g.concepto}</p><p class="text-[10px] text-slate-500 uppercase font-black">${g.fecha}</p></div>
                                <div class="flex items-center gap-3">
                                    <p class="font-[900] text-xl ${isI?'text-cyan-400':'text-rose-400'}">${isPrivate?'****':v.toFixed(2)}€</p>
                                    <button onclick="preEdit('${g._id}')" class="btn-action btn-edit text-xs">✏️</button>
                                    <button onclick="deleteGasto('${g._id}')" class="btn-action btn-delete text-xs">🗑️</button>
                                </div>
                            </div>`;
                    }
                });
                document.getElementById('valReal').innerText = isPrivate ? "****€" : total.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) {}
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="bg-white/5 p-3 rounded-2xl flex justify-between items-center border border-white/5">
                    <div class="flex items-center gap-2 truncate"><div class="w-3 h-3 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[10px] font-black uppercase text-slate-400 truncate w-16">${l}</span></div>
                    <span class="text-xs font-black text-white">${isPrivate?'***':data[l].toFixed(0)}€</span>
                </div>`).join('');
        }

        async function deleteGasto(id) { if(confirm("¿Borrar?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); } }

        function preEdit(id) {
            const g = appData.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            document.getElementById('btn-submit').innerText = "Actualizar";
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(id ? `${API_URL}/${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            document.getElementById('in-id').value = "";
            document.getElementById('btn-submit').innerText = "Confirmar Operación";
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function resetAllAlerts() { alert("Caché limpia"); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
