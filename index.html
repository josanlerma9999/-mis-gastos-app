<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Cuenta Real v8.6 BBVA Blue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        /* PALETA BBVA */
        :root { 
            --bbva-navy: #072146; 
            --bbva-blue: #004481; 
            --bbva-light: #1464A5; 
            --bbva-cyan: #028484; 
        }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #000000; color: #ffffff; }
        .active-tab { color: #00a8e1; border-top: 4px solid #00a8e1; }
        .hidden { display: none !important; }
        .font-900 { font-weight: 900; }
        .bg-dark-card { background-color: #0a0a0a; border: 1px solid #1a1a1a; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.4s ease-out; }
    </style>
</head>
<body class="pb-28">

    <div id="pantalla-pin" class="fixed inset-0 bg-[#072146] z-[100] flex flex-col items-center justify-center p-6 text-white text-center">
        <div class="mb-8">
            <h2 class="font-900 text-3xl tracking-tighter italic mb-1">BBVA</h2>
            <p class="text-[8px] uppercase tracking-[0.3em] opacity-60">Mis Finanzas Pro</p>
        </div>
        <p id="pin-msg" class="text-[10px] uppercase font-black mb-8 tracking-widest text-cyan-400">Introduce tu PIN</p>
        <div class="flex gap-4 mb-12" id="pin-dots">
            <div class="w-4 h-4 rounded-full border-2 border-white/20"></div>
            <div class="w-4 h-4 rounded-full border-2 border-white/20"></div>
            <div class="w-4 h-4 rounded-full border-2 border-white/20"></div>
            <div class="w-4 h-4 rounded-full border-2 border-white/20"></div>
        </div>
        <div class="grid grid-cols-3 gap-6 max-w-[280px]">
            <script>
                for(let i=1; i<=9; i++) document.write(`<button onclick="teclado(${i})" class="w-16 h-16 bg-white/5 rounded-full font-black text-2xl active:bg-cyan-500 transition-colors">${i}</button>`);
            </script>
            <div></div>
            <button onclick="teclado(0)" class="w-16 h-16 bg-white/5 rounded-full font-black text-2xl active:bg-cyan-500">0</button>
            <button onclick="borrarPin()" class="w-16 h-16 text-rose-400 font-black text-[10px] uppercase">Borrar</button>
        </div>
    </div>

    <header class="bg-black/90 backdrop-blur-md text-white p-5 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
        <div class="flex flex-col">
            <h1 class="font-900 text-xl tracking-tighter italic leading-none">BBVA</h1>
            <span class="text-[7px] uppercase tracking-widest text-cyan-400 font-black">Cuenta Real</span>
        </div>
        <div class="flex gap-2">
            <button onclick="checkRecurrentes(true)" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-lg">🔄</button>
            <button onclick="togglePrivacy()" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-lg">
                <span id="ojo-icon">👁️</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <div id="statsComp" class="hidden bg-dark-card p-4 rounded-2xl mb-4 text-center border-l-4 border-cyan-500 animate-up">
            <p id="compTexto" class="text-[10px] font-black uppercase tracking-widest text-slate-400"></p>
        </div>

        <section id="tab-cuenta" class="tab-content animate-up">
            <div id="cardMain" class="p-10 rounded-[2.5rem] text-center mb-6 transition-all duration-700 bbva-gradient border border-white/10 shadow-[0_20px_60px_rgba(0,68,129,0.4)]">
                <p class="text-[11px] uppercase font-black tracking-[0.2em] mb-2 text-cyan-300">Balance Disponible</p>
                <h2 id="valReal" class="text-6xl font-900 tracking-tighter">0.00€</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-dark-card p-5 rounded-[2rem] text-center border-b-4 border-cyan-600/50">
                    <p class="text-[9px] font-black uppercase text-slate-500 mb-1">Final de Mes</p>
                    <p id="valEstimado" class="text-xl font-900 text-white">0.00€</p>
                </div>
                <div class="bg-dark-card p-5 rounded-[2rem] text-center border-b-4 border-cyan-400/50">
                    <p class="text-[9px] font-black uppercase text-slate-500 mb-1">Pendiente</p>
                    <p id="valPendiente" class="text-xl font-900 text-white">0.00€</p>
                </div>
            </div>

            <div class="bg-dark-card p-6 rounded-[2.5rem] mb-20 shadow-inner">
                <div class="h-56 mb-6"><canvas id="chartGastos"></canvas></div>
                <div id="legendBox" class="grid grid-cols-2 gap-2"></div>
            </div>
        </section>

        <section id="tab-mes" class="tab-content hidden animate-up">
            <div class="bg-dark-card p-4 rounded-2xl mb-4 flex justify-between items-center border border-white/5">
                <input type="month" id="filtroMes" class="font-black bg-transparent outline-none text-white invert opacity-80" onchange="renderApp()">
                <button onclick="exportarCSV()" class="text-cyan-400 text-[10px] font-black px-4 py-2 bg-cyan-400/10 rounded-xl uppercase">Descargar CSV</button>
            </div>
            <div id="resumenMes" class="grid grid-cols-2 gap-3 mb-4"></div>
            <div id="listaMes" class="space-y-2"></div>
        </section>

        <section id="tab-add" class="tab-content hidden animate-up">
            <div class="bg-dark-card p-8 rounded-[2.5rem] border border-white/5">
                <h2 id="formTitle" class="text-center font-black uppercase text-[10px] text-cyan-500 mb-6 tracking-[0.3em]">Nuevo Registro</h2>
                <form id="mainForm" class="space-y-4">
                    <input type="hidden" id="in-id">
                    <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black border border-white/10 rounded-2xl font-bold text-white outline-none focus:border-cyan-500 transition-all" required>
                    <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black border border-white/10 rounded-2xl font-900 text-4xl text-white outline-none" required>
                    
                    <div class="flex items-center gap-3 p-4 bg-slate-900/50 rounded-2xl border border-white/5">
                        <input type="checkbox" id="in-recurrente" class="w-5 h-5 accent-cyan-500">
                        <label for="in-recurrente" class="text-xs font-black text-slate-400 uppercase tracking-tighter">Guardar como recurrente</label>
                    </div>

                    <select id="in-categoria" class="w-full p-4 bg-black border border-white/10 rounded-2xl font-bold text-white outline-none">
                        <optgroup label="INGRESOS"><option value="Sueldo">💰 Sueldo</option><option value="Otros Ingresos">💵 Otros</option></optgroup>
                        <optgroup label="GASTOS"><option value="El Corte Inglés">🏬 El Corte Inglés</option><option value="Cuenta BBVA">🏦 BBVA</option><option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option><option value="Tarjeta Explora">🧭 Explora</option><option value="Imagine">🟣 Imagine</option><option value="PayPal">💳 PayPal</option><option value="Amazon">📦 Amazon</option><option value="Gasolina">⛽ Gasolina</option></optgroup>
                    </select>
                    <input type="date" id="in-fecha" class="w-full p-4 bg-black border border-white/10 rounded-2xl font-bold text-white outline-none" required>
                    <button type="submit" id="btnSubmit" class="w-full bg-cyan-600 text-white font-900 p-5 rounded-2xl shadow-xl active:scale-95 transition-all uppercase tracking-widest text-sm">Confirmar Pago</button>
                </form>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10 flex justify-around p-3 pb-8 z-50">
        <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab">
            <span class="text-2xl">🏦</span><span class="text-[8px] font-black uppercase tracking-widest">Global</span>
        </button>
        <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-600">
            <span class="text-2xl">🗓️</span><span class="text-[8px] font-black uppercase tracking-widest">Extracto</span>
        </button>
        <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-600">
            <span class="text-2xl">➕</span><span class="text-[8px] font-black uppercase tracking-widest">Operar</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00a8e1', '#004481', '#1464A5', '#028484', '#0072CE', '#00c3e3', '#072146'];
        let appData = [], mainChart = null, pinEntrada = "", privacyMode = false;

        // PIN SEGURIDAD
        const pinGuardado = localStorage.getItem('user_pin');
        function teclado(num) { if (pinEntrada.length < 4) { pinEntrada += num; updateDots(); if (pinEntrada.length === 4) setTimeout(checkPin, 200); } }
        function updateDots() { const dots = document.getElementById('pin-dots').children; for (let i=0; i<4; i++) dots[i].className = i < pinEntrada.length ? "w-4 h-4 rounded-full bg-cyan-400" : "w-4 h-4 rounded-full border-2 border-white/20"; }
        function borrarPin() { pinEntrada = ""; updateDots(); }
        function checkPin() { if (!pinGuardado) { localStorage.setItem('user_pin', pinEntrada); desbloquear(); } else if (pinEntrada === pinGuardado) desbloquear(); else { alert("PIN Incorrecto"); borrarPin(); } }
        function desbloquear() { document.getElementById('pantalla-pin').classList.add('hidden'); renderApp(); }

        // MOTOR RENDER
        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date().toISOString().split('T')[0], mesSel = document.getElementById('filtroMes').value;
                
                // Comparativa mes anterior
                const fechaPrev = new Date(mesSel + "-01"); fechaPrev.setMonth(fechaPrev.getMonth() - 1);
                const mesPrev = fechaPrev.toISOString().slice(0, 7);

                let real=0, plan=0, inM=0, outM=0, outPrev=0, cats={};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML='';

                appData.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach(g => {
                    const val=parseFloat(g.importe), isIn=["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    if (g.fecha <= hoy) isIn ? real+=val : real-=val;
                    else isIn ? plan+=val : plan-=val;

                    if (g.fecha.startsWith(mesSel)) {
                        isIn ? inM+=val : (outM+=val, cats[g.categoria]=(cats[g.categoria]||0)+val);
                        lMes.innerHTML += itemHTML(g, isIn);
                    }
                    if (g.fecha.startsWith(mesPrev) && !isIn) outPrev += val;
                });

                document.getElementById('valReal').innerText = mask(real.toFixed(2)+"€");
                document.getElementById('valEstimado').innerText = mask((real+plan).toFixed(2)+"€");
                document.getElementById('valPendiente').innerText = mask(plan.toFixed(2)+"€");
                
                if (outPrev > 0) {
                    const diff = ((outM / outPrev) * 100 - 100).toFixed(1);
                    const elComp = document.getElementById('statsComp');
                    elComp.classList.remove('hidden');
                    elComp.innerHTML = diff < 0 
                        ? `<p class="text-[10px] font-black uppercase tracking-widest text-slate-400">📉 Ahorras un <span class="text-cyan-400">${Math.abs(diff)}%</span> vs mes pasado</p>`
                        : `<p class="text-[10px] font-black uppercase tracking-widest text-slate-400">📈 Gastas un <span class="text-rose-400">${diff}%</span> más que mes pasado</p>`;
                }

                document.getElementById('resumenMes').innerHTML = `
                    <div class="bg-dark-card p-4 rounded-2xl border border-cyan-500/20"><p class="text-[8px] text-slate-500 font-black uppercase">Abonos</p><p class="text-cyan-400 font-900">${mask(inM.toFixed(2)+"€")}</p></div>
                    <div class="bg-dark-card p-4 rounded-2xl border border-rose-500/20"><p class="text-[8px] text-slate-500 font-black uppercase">Cargos</p><p class="text-rose-400 font-900">${mask(outM.toFixed(2)+"€")}</p></div>
                `;
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function itemHTML(g, isI) {
            return `<div class="bg-dark-card p-4 rounded-2xl flex justify-between items-center border border-white/5">
                <div><p class="font-black text-slate-200 text-sm">${g.concepto}</p><p class="text-[8px] font-black uppercase text-slate-600">${g.categoria} · ${g.fecha.split('-')[2]}</p></div>
                <div class="flex items-center gap-3">
                    <p class="font-900 ${isI?'text-cyan-400':'text-rose-400'}">${mask(parseFloat(g.importe).toFixed(2)+"€")}</p>
                    <button onclick="editMode('${g._id}')" class="p-2 bg-slate-900 rounded-lg text-[10px]">✏️</button>
                    <button onclick="deleteItem('${g._id}')" class="p-2 bg-slate-900 rounded-lg text-slate-600 text-[10px]">🗑️</button>
                </div>
            </div>`;
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            if (labels.length === 0 || privacyMode) return;
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center gap-2 p-2 bg-slate-900/50 rounded-xl"><div class="w-1.5 h-1.5 rounded-full" style="background:${COLORS[i]}"></div><div class="flex flex-col"><span class="text-[7px] font-black text-slate-500 uppercase">${l}</span><span class="text-[9px] font-900 text-slate-300">${data[l].toFixed(0)}€</span></div></div>`).join('');
        }

        // AUX
        function togglePrivacy() { privacyMode = !privacyMode; document.getElementById('ojo-icon').innerText = privacyMode ? "🙈" : "👁️"; renderApp(); }
        function mask(v) { return privacyMode ? "****€" : v; }
        function switchTab(id, el) { document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-600')); el.classList.replace('text-slate-600', 'active-tab'); document.getElementById(id).classList.remove('hidden'); renderApp(); }
        function exportarCSV() { let csv = "Fecha,Concepto,Importe,Categoria\n"; appData.forEach(g => { csv += `${g.fecha},${g.concepto},${g.importe},${g.categoria}\n`; }); const blob = new Blob([csv], { type: 'text/csv' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `BBVA_Extracto.csv`; link.click(); }
        async function deleteItem(id) { if(confirm("¿Anular movimiento?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); } }
        
        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            if (document.getElementById('in-recurrente').checked) { let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]"); recs.push(data); localStorage.setItem('recurrentes', JSON.stringify(recs)); }
            const idV = document.getElementById('in-id').value;
            if (idV) await fetch(`${API_URL}/${idV}`, { method: 'DELETE' });
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
