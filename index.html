<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Cuenta Real v8.2 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-tab { color: #10b981; border-top: 4px solid #10b981; }
        .hidden { display: none !important; }
        .font-900 { font-weight: 900; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: slideUp 0.4s ease-out; }
    </style>
</head>
<body class="bg-slate-50 pb-28">

    <div id="pantalla-pin" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-6">
        <h2 class="text-white font-900 text-2xl mb-2 italic tracking-tighter">MI CUENTA REAL</h2>
        <p id="pin-msg" class="text-emerald-500 text-[10px] uppercase font-black mb-8 tracking-widest text-center">Configura tu nuevo PIN</p>
        <div class="flex gap-4 mb-12" id="pin-dots">
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
        </div>
        <div class="grid grid-cols-3 gap-6 max-w-[280px]">
            <button onclick="teclado(1)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">1</button>
            <button onclick="teclado(2)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">2</button>
            <button onclick="teclado(3)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">3</button>
            <button onclick="teclado(4)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">4</button>
            <button onclick="teclado(5)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">5</button>
            <button onclick="teclado(6)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">6</button>
            <button onclick="teclado(7)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">7</button>
            <button onclick="teclado(8)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">8</button>
            <button onclick="teclado(9)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">9</button>
            <div></div>
            <button onclick="teclado(0)" class="w-16 h-16 bg-slate-800 text-white rounded-full font-black text-2xl active:bg-emerald-500">0</button>
            <button onclick="borrarPin()" class="w-16 h-16 text-rose-500 font-black text-[10px] uppercase">DEL</button>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <h1 class="font-900 text-xl tracking-tighter italic">MI CUENTA REAL</h1>
        </div>
        <button onclick="togglePrivacy()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-lg">
            <span id="ojo-icon">👁️</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <div id="alertHoy" class="hidden bg-rose-600 text-white p-4 rounded-2xl mb-4 text-center shadow-xl">
            <p class="text-[10px] font-black uppercase tracking-widest">⚠️ Tienes pagos para hoy</p>
        </div>

        <section id="tab-cuenta" class="tab-content animate-up">
            <div id="cardMain" class="p-8 rounded-[2.5rem] text-center shadow-2xl mb-6 transition-all duration-500">
                <p class="text-[11px] uppercase font-black tracking-[0.2em] mb-2 opacity-80">Saldo Actual</p>
                <h2 id="valReal" class="text-5xl font-900 tracking-tighter transition-all">0.00€</h2>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-800 text-white p-5 rounded-[2rem] text-center border-b-4 border-indigo-500">
                    <p class="text-[9px] font-black uppercase text-indigo-300 mb-1">Final Mes</p>
                    <p id="valEstimado" class="text-xl font-900">0.00€</p>
                </div>
                <div class="bg-slate-800 text-white p-5 rounded-[2rem] text-center border-b-4 border-emerald-500">
                    <p class="text-[9px] font-black uppercase text-emerald-300 mb-1">Previsión</p>
                    <p id="valPendiente" class="text-xl font-900">0.00€</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 mb-20">
                <div class="h-56 mb-6"><canvas id="chartGastos"></canvas></div>
                <div id="legendBox" class="grid grid-cols-2 gap-2"></div>
            </div>
        </section>

        <section id="tab-plan" class="tab-content hidden animate-up">
            <h3 class="font-black uppercase text-[10px] text-slate-400 mb-4 px-2 tracking-widest">Calendario de Pagos</h3>
            <div id="listaPlan" class="space-y-3"></div>
        </section>

        <section id="tab-mes" class="tab-content hidden animate-up">
            <div class="bg-white p-4 rounded-2xl mb-4 shadow-sm flex justify-center border border-slate-100">
                <input type="month" id="filtroMes" class="font-black bg-transparent outline-none text-slate-700" onchange="renderApp()">
            </div>
            <div id="resumenMes" class="grid grid-cols-2 gap-3 mb-4"></div>
            <div id="listaMes" class="space-y-2"></div>
        </section>

        <section id="tab-add" class="tab-content hidden animate-up">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h2 id="formTitle" class="text-center font-black uppercase text-[10px] text-slate-400 mb-6 tracking-widest">Nuevo Movimiento</h2>
                <form id="mainForm" class="space-y-4">
                    <input type="hidden" id="in-id">
                    <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-emerald-500 transition-all" required>
                    <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-slate-50 rounded-2xl font-900 text-3xl outline-none" required>
                    <select id="in-categoria" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Otros Ingresos">💵 Otros Ingresos</option>
                        <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                        <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                        <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                        <option value="Imagine">🟣 Imagine</option>
                        <option value="PayPal">💳 PayPal</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                    </select>
                    <input type="date" id="in-fecha" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" required>
                    <button type="submit" id="btnSubmit" class="w-full bg-slate-900 text-white font-900 p-5 rounded-2xl shadow-xl active:scale-95 transition-all">GUARDAR</button>
                    <button type="button" id="btnCancel" onclick="resetForm()" class="hidden w-full text-rose-500 font-black text-[10px] uppercase py-2">Cancelar</button>
                </form>
            </div>
        </section>
    </main>

    <nav id="navBar" class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-100 flex justify-around p-3 pb-8 z-50">
        <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab">
            <span class="text-2xl">💰</span><span class="text-[9px] font-black uppercase">Cuenta</span>
        </button>
        <button onclick="switchTab('tab-plan', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <span class="text-2xl">🗓️</span><span class="text-[9px] font-black uppercase">Plan</span>
        </button>
        <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <span class="text-2xl">📊</span><span class="text-[9px] font-black uppercase">Mes</span>
        </button>
        <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <span class="text-2xl">➕</span><span class="text-[9px] font-black uppercase">Nuevo</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#3b82f6', '#0f172a'];
        let appData = [];
        let mainChart = null;
        let pinEntrada = "";
        let privacyMode = false;

        // --- SISTEMA DE SEGURIDAD (PIN) ---
        const pinGuardado = localStorage.getItem('user_pin');
        if (pinGuardado) {
            document.getElementById('pin-msg').innerText = "Introduce tu PIN de acceso";
        }

        function teclado(num) {
            if (pinEntrada.length < 4) {
                pinEntrada += num;
                actualizarDots();
                if (pinEntrada.length === 4) {
                    setTimeout(verificarPin, 200);
                }
            }
        }

        function actualizarDots() {
            const dots = document.getElementById('pin-dots').children;
            for (let i = 0; i < 4; i++) {
                dots[i].className = i < pinEntrada.length ? "w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]" : "w-4 h-4 rounded-full border-2 border-slate-700";
            }
        }

        function borrarPin() {
            pinEntrada = "";
            actualizarDots();
        }

        function verificarPin() {
            if (!pinGuardado) {
                localStorage.setItem('user_pin', pinEntrada);
                alert("✅ PIN creado con éxito");
                desbloquearApp();
            } else if (pinEntrada === pinGuardado) {
                desbloquearApp();
            } else {
                alert("❌ PIN Incorrecto");
                borrarPin();
            }
        }

        function desbloquearApp() {
            document.getElementById('pantalla-pin').classList.add('hidden');
            renderApp();
        }

        // --- MODO PRIVACIDAD ---
        function togglePrivacy() {
            privacyMode = !privacyMode;
            document.getElementById('ojo-icon').innerText = privacyMode ? "🙈" : "👁️";
            renderApp();
        }

        function mask(valor) {
            return privacyMode ? "****€" : valor;
        }

        // --- LÓGICA DE LA APP ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
            document.getElementById('in-fecha').valueAsDate = new Date();
        });

        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-400'));
            el.classList.replace('text-slate-400', 'active-tab');
            document.getElementById(id).classList.remove('hidden');
            if(id !== 'tab-add') renderApp();
        }

        async function renderApp() {
            try {
                const response = await fetch(API_URL);
                appData = await response.json();
                const hoy = new Date().toISOString().split('T')[0];
                const mesSel = document.getElementById('filtroMes').value;

                let real = 0, plan = 0, inM = 0, outM = 0, cats = {}, alertH = false;
                const lPlan = document.getElementById('listaPlan'), lMes = document.getElementById('listaMes');
                lPlan.innerHTML = ''; lMes.innerHTML = '';

                appData.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach(g => {
                    const val = parseFloat(g.importe), isIn = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    if (g.fecha <= hoy) { isIn ? real += val : real -= val; }
                    else { isIn ? plan += val : plan -= val; lPlan.innerHTML += itemHTML(g, isIn, true); }
                    if (g.fecha === hoy && !isIn) alertH = true;
                    if (g.fecha.startsWith(mesSel)) {
                        isIn ? inM += val : (outM += val, cats[g.categoria] = (cats[g.categoria] || 0) + val);
                        lMes.innerHTML += itemHTML(g, isIn, false);
                    }
                });

                document.getElementById('valReal').innerText = mask(real.toFixed(2) + "€");
                document.getElementById('valEstimado').innerText = mask((real + plan).toFixed(2) + "€");
                document.getElementById('valPendiente').innerText = mask(plan.toFixed(2) + "€");
                document.getElementById('cardMain').className = real >= 0 ? "p-8 rounded-[2.5rem] text-center shadow-2xl mb-6 bg-emerald-500 text-white" : "p-8 rounded-[2.5rem] text-center shadow-2xl mb-6 bg-rose-500 text-white";
                document.getElementById('alertHoy').classList.toggle('hidden', !alertH);
                document.getElementById('resumenMes').innerHTML = `
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center"><p class="text-[8px] font-black uppercase text-slate-400">Ingresos</p><p class="text-emerald-500 font-900">${mask(inM.toFixed(2)+"€")}</p></div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center"><p class="text-[8px] font-black uppercase text-slate-400">Gastos</p><p class="text-rose-500 font-900">${mask(outM.toFixed(2)+"€")}</p></div>
                `;
                drawChart(cats, outM);
            } catch (e) { console.log(e); }
        }

        function itemHTML(g, isI, isPlan) {
            return `<div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                <div><p class="font-black text-slate-800 text-sm">${g.concepto}</p><p class="text-[9px] font-black uppercase text-slate-400">${isPlan ? g.fecha : g.categoria}</p></div>
                <div class="flex items-center gap-3">
                    <p class="font-900 ${isI?'text-emerald-500':'text-rose-500'}">${mask(parseFloat(g.importe).toFixed(2)+"€")}</p>
                    <button onclick="editMode('${g._id}')" class="p-2 bg-slate-50 rounded-lg">✏️</button>
                    <button onclick="deleteItem('${g._id}')" class="p-2 bg-slate-50 rounded-lg text-slate-300">🗑️</button>
                </div>
            </div>`;
        }

        function drawChart(data, total) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            if (labels.length === 0 || privacyMode) { document.getElementById('legendBox').innerHTML = ""; return; }
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl"><div class="w-2 h-2 rounded-full" style="background:${COLORS[i]}"></div><div class="flex flex-col"><span class="text-[7px] font-black text-slate-400 uppercase">${l}</span><span class="text-[10px] font-900 text-slate-700">${data[l].toFixed(1)}€</span></div></div>`).join('');
        }

        async function deleteItem(id) { if(confirm("¿Eliminar?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); } }

        function editMode(id) {
            const g = appData.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            document.getElementById('btnSubmit').innerText = "ACTUALIZAR";
            document.getElementById('btnSubmit').classList.replace('bg-slate-900', 'bg-orange-500');
            document.getElementById('btnCancel').classList.remove('hidden');
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[3]);
        }

        function resetForm() {
            document.getElementById('mainForm').reset();
            document.getElementById('in-id').value = "";
            document.getElementById('btnSubmit').innerText = "GUARDAR";
            document.getElementById('btnSubmit').className = "w-full bg-slate-900 text-white font-900 p-5 rounded-2xl shadow-xl";
            document.getElementById('btnCancel').classList.add('hidden');
            document.getElementById('in-fecha').valueAsDate = new Date();
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idV = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            if (idV) await fetch(`${API_URL}/${idV}`, { method: 'DELETE' });
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            resetForm();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
        });
    </script>
</body>
</html>
