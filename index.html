<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v17.5 - Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* PIN PAD */
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.1); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); color: white; transition: all 0.1s ease;
        }
        .num-btn:active { background: var(--bbva-cyan); color: #000; transform: scale(0.9); } 

        .bbva-card { background: var(--bbva-navy); border-radius: 1.25rem; border: 1px solid rgba(255,255,255,0.05); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 1.5rem; }
        .bbva-input { background: #fff; border: none; border-radius: 0.8rem; padding: 0.8rem; width: 100%; color: #072146; font-weight: 700; outline: none; }
        
        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; }
        #main-view { display: flex; width: 600%; height: 100%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 16.666%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
        
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }

        /* DISEÑO DE TARJETAS PREMIUM */
        .card-real {
            position: relative; height: 190px; border-radius: 1.2rem; padding: 1.5rem;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); overflow: hidden;
        }
        .card-aqua { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255,255,255,0.1); }
        .card-explora { background: linear-gradient(135deg, #004481 0%, #072146 100%); border: 1px solid rgba(0,229,255,0.2); }
        .chip { width: 40px; height: 30px; background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); border-radius: 4px; margin-bottom: 10px; opacity: 0.8; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-10 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-12" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-6" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header> 

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-xl">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo disponible</p>
                        <h2 id="valReal" class="text-4xl font-black italic">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase">Saldo Final</p>
                            <p id="valProj" class="text-lg font-bold text-cyan-400">0.00€</p>
                        </div>
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase">Previsión</p>
                            <p id="valPend" class="text-lg font-bold text-rose-400">0.00€</p>
                        </div>
                    </div>
                    <div class="bbva-card p-4 h-48"><canvas id="gastosChart"></canvas></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Pagos Futuros</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Suscripciones</h3>
                    <div id="listaRecurrentes" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <input type="month" id="filtroMes" class="bbva-input mb-4" onchange="actualizarInterfaz()">
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section>

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-2xl font-bold" required>
                        <select id="in-categoria" class="bbva-input font-bold" required>
                            <option value="Varios">🛍️ Varios</option>
                            <option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option>
                            <option value="Tarjeta Explora">💳 Tarjeta Explora</option>
                            <option value="Sueldo">💰 Sueldo</option>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <button type="submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section>

                <section class="tab-content space-y-8">
                    <h3 class="text-xs font-bold text-slate-400 uppercase text-center tracking-widest">Mis Tarjetas Premium</h3>
                    
                    <div class="card-real card-explora">
                        <div class="flex justify-between items-start">
                            <div class="chip"></div>
                            <span class="text-white font-black italic text-xl">BBVA</span>
                        </div>
                        <div>
                            <p class="text-blue-200/60 text-[10px] uppercase font-bold tracking-widest">Explora Crédito</p>
                            <h3 id="card-explora-val" class="text-white text-3xl font-bold mt-1">0,00€</h3>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-white/40 text-xs font-mono">**** 8823</span>
                            <span class="text-white/20 text-xl font-black italic">VISA</span>
                        </div>
                    </div>

                    <div class="card-real card-aqua">
                        <div class="flex justify-between items-start">
                            <div class="chip" style="background: linear-gradient(135deg, #e0e0e0 0%, #888 100%);"></div>
                            <span class="text-white font-black italic text-xl">BBVA</span>
                        </div>
                        <div>
                            <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest">Aqua Débito</p>
                            <h3 id="card-aqua-val" class="text-cyan-400 text-3xl font-bold mt-1">0,00€</h3>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-white/40 text-xs font-mono">**** 4412</span>
                            <span class="text-white/10 text-xl font-black italic uppercase">Mastercard</span>
                        </div>
                    </div>
                </section>
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center"><span class="text-xl">🏠</span><span class="text-[8px]">INICIO</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">⏳</span><span class="text-[8px]">PROX</span></button>
            <button onclick="goToTab(2)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">🔄</span><span class="text-[8px]">FIJOS</span></button> 
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">📋</span><span class="text-[8px]">MOVS</span></button>
            <button onclick="goToTab(4)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">➕</span><span class="text-[8px]">OPERAR</span></button>
            <button onclick="goToTab(5)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center"><span class="text-xl">💳</span><span class="text-[8px]">CARDS</span></button>
        </nav>
    </div> 

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let pin = "", isPrivate = false, appData = [], currentTabIndex = 0;
        let chart = null;

        // PIN LOGIC
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        });

        function goToTab(i) {
            currentTabIndex = i;
            document.getElementById('main-view').style.transform = `translateX(-${i * 16.666}%)`;
            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
        }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                actualizarInterfaz();
            } catch (e) { console.error("Error API"); }
        }

        function obtenerLogo(concepto) {
            const c = concepto.toLowerCase();
            if(c.includes('nala')) return '🐶';
            if(c.includes('mercadona')) return '🛒';
            if(c.includes('amazon')) return '📦';
            if(c.includes('sueldo')) return '💰';
            if(c.includes('aqua') || c.includes('explora')) return '💳';
            return '📄';
        }

        function actualizarInterfaz() {
            const hoy = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value || hoy.slice(0, 7);
            let saldoReal = 0, gFuturos = 0, dExplora = 0, dAqua = 0;
            
            const listaPasado = document.getElementById('listaPasado');
            const listaFuturo = document.getElementById('listaFuturo');
            listaPasado.innerHTML = ''; listaFuturo.innerHTML = '';

            appData.forEach(g => {
                const val = Math.abs(parseFloat(g.importe));
                const esIngreso = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                const conc = g.concepto.toLowerCase();

                // SUMAR A TARJETAS SIEMPRE (No importa la fecha)
                if(conc.includes('explora') || g.categoria === "Tarjeta Explora") dExplora += val;
                if(conc.includes('aqua') || g.categoria === "Tarjeta Aqua") dAqua += val;

                if (g.fecha <= hoy) {
                    esIngreso ? saldoReal += val : saldoReal -= val;
                    if (g.fecha.startsWith(mesSel)) {
                        listaPasado.insertAdjacentHTML('beforeend', `
                            <div class="bbva-card p-4 flex justify-between items-center mb-2 shadow-sm">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-lg">${obtenerLogo(g.concepto)}</div>
                                    <div><p class="font-bold text-sm">${g.concepto}</p><p class="text-[9px] text-slate-500 uppercase">${g.fecha}</p></div>
                                </div>
                                <p class="font-black ${esIngreso ? 'text-cyan-400' : 'text-white'}">${isPrivate ? '****' : (esIngreso?'+':'-')+val.toFixed(2)}€</p>
                            </div>`);
                    }
                } else {
                    gFuturos += val;
                    listaFuturo.insertAdjacentHTML('beforeend', `
                        <div class="bbva-card p-4 border-l-4 border-cyan-400 flex justify-between">
                            <p class="font-bold">${g.concepto}</p><p class="font-black text-cyan-400">${val.toFixed(2)}€</p>
                        </div>`);
                }
            });

            document.getElementById('valReal').innerText = (isPrivate ? "****" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits:2})) + "€";
            document.getElementById('valPend').innerText = (isPrivate ? "****" : "-" + gFuturos.toFixed(2)) + "€";
            document.getElementById('valProj').innerText = (isPrivate ? "****" : (saldoReal - gFuturos).toFixed(2)) + "€";
            
            document.getElementById('card-explora-val').innerText = (isPrivate ? "****" : dExplora.toLocaleString('de-DE', {minimumFractionDigits:2})) + "€";
            document.getElementById('card-aqua-val').innerText = (isPrivate ? "****" : dAqua.toLocaleString('de-DE', {minimumFractionDigits:2})) + "€";
            
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('gastosChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [saldoReal < 0 ? 1 : saldoReal, 500], backgroundColor: ['#00e5ff', '#004481'], borderWidth: 0 }] },
                options: { cutout: '80%', maintainAspectRatio: false }
            });
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                concepto: document.getElementById('in-concepto').value,
                importe: document.getElementById('in-importe').value,
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            e.target.reset(); renderApp(); goToTab(0);
        };

        function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
