<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v16.6</title> 

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#072146">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.1s ease; touch-action: manipulation;
        }
        .num-btn:active { background: var(--bbva-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--bbva-cyan); transform: scale(0.9); } 

        .bbva-card { background: var(--bbva-navy); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: #ffffff; border: none; border-radius: 1rem; padding: 1rem; width: 100%; color: #072146; font-weight: 800; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); } 

        input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; opacity: 0.7; }

        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; touch-action: pan-y; background: #000;}
        #main-view { display: flex; width: 600%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 16.666%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; } 

        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }

        .chart-container { position: relative; height: 180px; width: 100%; margin-top: 0.5rem; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .card-real { position: relative; height: 180px; border-radius: 1.2rem; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; }
        .card-aqua { background: linear-gradient(135deg, #004481 0%, #041c3d 100%); border: 1px solid rgba(255,255,255,0.08); }
        .card-explora { background: linear-gradient(150deg, #072146 0%, #040c1d 100%); border: 1px solid rgba(0,229,255,0.25); }
        .chip { width: 35px; height: 26px; background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); border-radius: 4px; opacity: 0.8; }

        .card-container { perspective: 1000px; height: 190px; width: 100%; margin-bottom: 1.5rem; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 1.2rem; }
        .card-back { background: linear-gradient(135deg, #041c3d 0%, #072146 100%); transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; border: 1px solid rgba(0, 229, 255, 0.3); }
        .chart-card-container { width: 100%; height: 100%; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex-col text-white flex">
        <div class="px-4 mb-2 pt-4">
            <h2 id="saludo-texto" class="text-3xl font-black text-white tracking-tighter">Hola</h2>
            <p id="animo-financiero" class="text-[10px] font-bold text-cyan-400 uppercase tracking-[0.2em] opacity-80">SISTEMA PREMIUM</p>
        </div>

        <header class="p-4 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter text-white">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header>

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-4">
                    <div class="p-4 bbva-gradient text-center shadow-lg mx-2 rounded-3xl"> 
                        <p class="text-[9px] font-bold uppercase tracking-widest text-cyan-300/60 mb-1">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-4xl font-black tracking-tighter">0.00€</h2>
                    </div>

                    <div class="px-2 mb-4">
                        <div class="bbva-card flex items-center shadow-xl overflow-hidden h-[75px]">
                            <div class="flex-1 text-center border-r border-white/10 py-2">
                                <p class="text-[8px] text-slate-400 uppercase font-black tracking-widest">Saldo Final</p>
                                <p id="valProj" class="text-base font-black text-cyan-400">0.00€</p>
                            </div>
                            <div class="flex-1 text-center py-2">
                                <p class="text-[8px] text-slate-400 uppercase font-black tracking-widest">Próximos Pagos</p>
                                <p id="valPend" class="text-base font-black text-rose-400">0.00€</p>
                            </div>
                        </div>
                    </div>

                    <div class="px-2 mb-4">
                        <div class="bbva-card p-4">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Presupuesto</h3>
                                <span id="txt-limite" class="text-[10px] font-black text-white">0%</span>
                            </div>
                            <div class="w-full h-3 bg-black/50 rounded-full p-0.5 border border-white/10">
                                <div id="barra-presupuesto" class="h-full rounded-full bg-cyan-400" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="px-2 pb-6">
                        <div class="bbva-card p-4 shadow-xl">
                            <div class="chart-container"> 
                                <canvas id="gastosChart"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Previsión</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Fijos</h3>
                    <div id="listaRecurrentes" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <div class="relative mb-6">
                        <input type="month" id="filtroMes" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white font-bold outline-none" onchange="renderApp()">
                    </div>
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section> 

                <section class="tab-content space-y-4 pt-8">
                    <div class="card-container" onclick="flipCard(this)">
                        <div class="card-inner">
                            <div class="card-real card-explora card-front">
                                <div class="flex justify-between items-start"><div class="chip"></div><span class="italic font-black">BBVA</span></div>
                                <div><p class="text-blue-200/50 text-[10px] uppercase font-bold">Explora</p><h3 id="card-explora-val" class="text-white text-3xl font-light">0,00€</h3></div>
                                <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 8823</span><span class="text-white/20 text-xl font-black italic">VISA</span></div>
                            </div>
                            <div class="card-back"><p class="text-[9px] font-black text-cyan-400">HISTORIAL</p></div>
                        </div>
                    </div>

                    <div class="card-container" onclick="flipCard(this)">
                        <div class="card-inner">
                            <div class="card-real card-aqua card-front">
                                <div class="flex justify-between items-start"><div class="chip" style="filter:grayscale(1)"></div><span class="italic font-black">BBVA</span></div>
                                <div><p class="text-slate-400 text-[10px] uppercase font-bold">Aqua</p><h3 id="card-aqua-val" class="text-cyan-400 text-3xl font-light">0,00€</h3></div>
                                <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 4412</span><span class="text-white/20 text-xl font-black italic">VISA</span></div>
                            </div>
                            <div class="card-back"><p class="text-[9px] font-black text-cyan-400">HISTORIAL</p></div>
                        </div>
                    </div>
                </section>

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4">
                       <h2 class="text-xs font-black uppercase text-cyan-400 tracking-widest mb-4">Nueva Operación</h2>
                       <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                       <input type="number" id="in-importe" step="0.01" placeholder="0.00 €" class="bbva-input" required>
                       <select id="in-categoria" class="bbva-input" required>
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                            <option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option>
                            <option value="Tarjeta Explora">💳 Tarjeta Explora</option>
                       </select>
                       <input type="date" id="in-fecha" class="bbva-input" required>
                       <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section> 
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center gap-1">🏠<span class="text-[8px] uppercase">Inicio</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1">⏳<span class="text-[8px] uppercase">Previsión</span></button>
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1">📋<span class="text-[8px] uppercase">Movs</span></button>
            <button onclick="goToTab(4)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1">💳<span class="text-[8px] uppercase">Cards</span></button>
            <button onclick="goToTab(5)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1">➕<span class="text-[8px] uppercase">Operar</span></button>
        </nav>
    </div> 

    <script>
    const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos'; 
    const SECURE_KEY = 'YakoNala99'; 
    let pin = "", isPrivate = false, appData = [], gastosChart = null;
    const categIngresos = ["Sueldo", "Otros Ingresos"];

    // PIN PAD
    [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
        const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
        b.onclick = () => {
            if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
            document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
            if(pin === "1763") { 
                document.getElementById('pin-screen').remove(); 
                document.getElementById('app-content').classList.remove('hidden'); 
                document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
                renderApp(); 
            }
        };
        document.getElementById('pin-pad').appendChild(b);
    });

    async function renderApp() {
        try {
            // ELIMINAMOS EL CACHE PARA FORZAR ACTUALIZACION REAL
            localStorage.removeItem('appData_cache');
            const res = await fetch(API_URL, { headers: { 'x-api-key': SECURE_KEY } });
            appData = await res.json(); 
            actualizarInterfaz();
        } catch (e) { console.error("Error:", e); }
    }

    function actualizarInterfaz() {
        const mesSel = document.getElementById('filtroMes').value;
        const hoyStr = new Date().toISOString().split('T')[0];
        let saldoReal = 0, gFuturos = 0, deudas = { "Tarjeta Aqua": 0, "Tarjeta Explora": 0 };
        
        document.getElementById('listaPasado').innerHTML = '';
        document.getElementById('listaFuturo').innerHTML = '';
        let lastDate = "";

        appData.sort((a,b) => b.fecha.localeCompare(a.fecha)).forEach(g => {
            const val = Math.abs(parseFloat(g.importe));
            const esI = categIngresos.includes(g.categoria);
            
            // Calculo Saldo
            if (g.fecha <= hoyStr) { esI ? saldoReal += val : saldoReal -= val; }
            else { esI ? gFuturos -= val : gFuturos += val; }

            if (g.categoria === "Tarjeta Aqua") deudas["Tarjeta Aqua"] += val;
            if (g.categoria === "Tarjeta Explora") deudas["Tarjeta Explora"] += val;

            // Renderizado Movimientos
            if(g.fecha.startsWith(mesSel)) {
                const itemHTML = `
                    <div class="bbva-card p-4 flex justify-between items-center mb-2">
                        <div><p class="text-sm font-bold">${g.concepto}</p><p class="text-[9px] opacity-40 uppercase">${g.categoria}</p></div>
                        <p class="font-black ${esI?'text-cyan-400':'text-white'}">${esI?'+':'-'}${val.toFixed(2)}€</p>
                    </div>`;
                
                if (g.fecha > hoyStr) {
                    document.getElementById('listaFuturo').insertAdjacentHTML('beforeend', itemHTML);
                } else {
                    document.getElementById('listaPasado').insertAdjacentHTML('beforeend', itemHTML);
                }
            }
        });

        document.getElementById('valReal').innerText = (isPrivate ? "****" : saldoReal.toFixed(2)) + "€";
        document.getElementById('valPend').innerText = "-" + gFuturos.toFixed(2) + "€";
        document.getElementById('valProj').innerText = (saldoReal - gFuturos).toFixed(2) + "€";
        document.getElementById('card-aqua-val').innerText = deudas["Tarjeta Aqua"].toFixed(2) + "€";
        document.getElementById('card-explora-val').innerText = deudas["Tarjeta Explora"].toFixed(2) + "€";
        
        document.getElementById('saludo-texto').innerText = saldoReal > 0 ? "¡Buen trabajo! 🤑" : "¡Atención! 💀";
        updateChart();
    }

    function updateChart() {
        const canvas = document.getElementById('gastosChart');
        const mesActual = document.getElementById('filtroMes').value; 
        const desglose = {};
        appData.filter(g => g.fecha.startsWith(mesActual) && !categIngresos.includes(g.categoria))
               .forEach(g => desglose[g.categoria] = (desglose[g.categoria] || 0) + parseFloat(g.importe));

        if (gastosChart) gastosChart.destroy();
        gastosChart = new Chart(canvas.getContext('2d'), {
            type: 'doughnut',
            data: { labels: Object.keys(desglose), datasets: [{ data: Object.values(desglose), backgroundColor: ['#00e5ff','#7c4dff','#ff4081','#4caf50'], borderWeight: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } }
        });
    }

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const btnSubmit = document.getElementById('btn-submit');
        btnSubmit.disabled = true; btnSubmit.innerText = "Guardando...";

        const payload = {
            concepto: document.getElementById('in-concepto').value,
            importe: parseFloat(document.getElementById('in-importe').value),
            categoria: document.getElementById('in-categoria').value,
            fecha: document.getElementById('in-fecha').value
        };

        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': SECURE_KEY },
                body: JSON.stringify(payload)
            });
            document.getElementById('mainForm').reset();
            await renderApp(); // RECUPERA LOS DATOS REALES DE LA API TRAS GUARDAR
            goToTab(0);
        } catch (error) { alert("Error al guardar"); }
        finally { btnSubmit.disabled = false; btnSubmit.innerText = "Confirmar"; }
    };

    function goToTab(i) {
        document.getElementById('main-view').style.transform = `translateX(-${i * 16.666}%)`; 
        document.querySelectorAll('.nav-btn').forEach((b, idx) => {
            if(idx === i || (i===3 && idx===2) || (i===4 && idx===3) || (i===5 && idx===4)) b.classList.add('active-tab');
            else b.classList.remove('active-tab');
        });
    }

    function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); }
    function flipCard(el) { el.querySelector('.card-inner').classList.toggle('is-flipped'); }
</script>
</body>
</html>
