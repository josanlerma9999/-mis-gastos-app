<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v16.7 - Secured</title> 

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#072146">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #040c1d; --bbva-blue: #072146; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.1s ease; touch-action: manipulation;
        }
        .num-btn:active { background: var(--bbva-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--bbva-cyan); transform: scale(0.9); } 

        .bbva-card { background: #072146; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: #ffffff; border: none; border-radius: 1rem; padding: 1rem; width: 100%; color: #072146; font-weight: 800; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); } 

        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; touch-action: pan-y; background: #000;}
        #main-view { display: flex; width: 600%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 16.666%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; } 

        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }

        .card-real { position: relative; height: 180px; border-radius: 1.2rem; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; }
        
        /* TARJETAS ACTUALIZADAS */
        .card-aqua { background: linear-gradient(135deg, #004481 0%, #041c3d 100%); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
        .card-explora { background: linear-gradient(150deg, #072146 0%, #040c1d 100%); border: 1px solid rgba(0,229,255,0.25); box-shadow: 0 0 15px rgba(0,229,255,0.1); }
        
        .chip { width: 35px; height: 26px; background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); border-radius: 4px; opacity: 0.8; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header> 

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-lg">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-4xl font-black tracking-tighter">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Saldo Final</p>
                            <p id="valProj" class="text-xl font-bold text-cyan-400 mt-1">0.00€</p>
                        </div>
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Próximos Pagos</p>
                            <p id="valPend" class="text-xl font-bold text-rose-400 mt-1">0.00€</p>
                        </div>
                    </div>
                    <div class="bbva-card p-4 shadow-xl">
                        <div class="h-[180px] w-full"><canvas id="gastosChart"></canvas></div>
                    </div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Previsión de Pagos</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Suscripciones</h3>
                    <div id="listaRecurrentes" class="space-y-3"></div>
                </section> 

                <section class="tab-content">
                    <input type="month" id="filtroMes" class="bbva-input mb-6" onchange="actualizarInterfaz()">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Movimientos</h3>
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section> 

                <section class="tab-content space-y-6 pt-8">
                    <div class="card-real card-explora">
                        <div class="flex justify-between items-start"><div class="chip"></div><span class="italic font-black">BBVA</span></div>
                        <div><p class="text-blue-200/50 text-[10px] uppercase font-bold">Explora Crédito</p><h3 id="card-explora-val" class="text-3xl font-light">0,00€</h3></div>
                        <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 8823</span><span class="text-white/20 text-xl font-black italic">VISA</span></div>
                    </div>
                    <div class="card-real card-aqua">
                        <div class="flex justify-between items-start"><div class="chip" style="filter:grayscale(1)"></div><span class="italic font-black">BBVA</span></div>
                        <div><p class="text-slate-400 text-[10px] uppercase font-bold">Aqua Crédito</p><h3 id="card-aqua-val" class="text-3xl font-light">0,00€</h3></div>
                        <div class="flex justify-between items-end"><span class="text-white/30 text-xs font-mono">**** 4412</span><span class="text-white/20 text-xl font-black italic">VISA</span></div>
                    </div>
                </section> 

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4 shadow-xl">
                        <h2 class="text-xs font-black uppercase text-cyan-400 tracking-widest mb-2">Nueva Operación</h2>
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-3xl text-center font-bold" required>
                        <select id="in-categoria" class="bbva-input font-bold" required>
                            <optgroup label="INGRESOS"><option value="Sueldo">💰 Sueldo</option><option value="Otros Ingresos">💵 Otros Ingresos</option></optgroup>
                            <optgroup label="GASTOS"><option value="Cuenta BBVA">🏦 Cuenta BBVA</option><option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option><option value="Tarjeta Explora">💳 Tarjeta Explora</option><option value="Amazon">📦 Amazon</option><option value="Gasolina">⛽ Gasolina</option><option value="Varios">🛍️ Varios</option></optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10">
                            <input type="checkbox" id="check-recurrente" class="w-5 h-5 accent-cyan-400">
                            <label for="check-recurrente" class="text-[10px] font-black uppercase text-slate-400">Pago fijo mensual</label>
                        </div> 
                        <button type="submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section> 
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center gap-1"><span class="text-xl">🏠</span><span class="text-[8px] uppercase">Inicio</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">⏳</span><span class="text-[8px] uppercase">Previsión</span></button>
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">📋</span><span class="text-[8px] uppercase">Movs</span></button>
            <button onclick="goToTab(4)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">💳</span><span class="text-[8px] uppercase">Cards</span></button>
            <button onclick="goToTab(5)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">➕</span><span class="text-[8px] uppercase">Operar</span></button>
        </nav>
    </div> 

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        // CONFIGURA AQUÍ TU LLAVE (DEBE COINCIDIR CON LA DE RENDER)
        const SECURE_KEY = 'YakoNala99'; 
        
        let appData = [], currentTabIndex = 0, isPrivate = false;
        const categIngresos = ["Sueldo", "Otros Ingresos"];
        let gastosChart = null; 

        // PIN PAD
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                let pinDots = document.querySelectorAll('#pin-dots div');
                let currentPin = window.pinVal || "";
                if(v === 'C') currentPin = ""; else if(v === 'DEL') currentPin = currentPin.slice(0,-1); else if(currentPin.length < 4) currentPin += v;
                window.pinVal = currentPin;
                pinDots.forEach((d, i) => d.style.background = i < currentPin.length ? '#00e5ff' : 'transparent');
                if(currentPin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        }); 

        async function renderApp() {
            try {
                // FETCH BLINDADO CON API KEY
                const res = await fetch(API_URL, {
                    headers: { 'x-api-key': SECURE_KEY }
                });
                const dataFresh = await res.json();
                const hoyStr = new Date().toISOString().split('T')[0]; 

                appData = dataFresh.map(g => ({ ...g, importe: parseFloat(g.importe) })); 
                
                // MANTENEMOS TU ORDENACIÓN: Pasado arriba, Futuro abajo
                appData.sort((a, b) => {
                    if (a.fecha <= hoyStr && b.fecha > hoyStr) return -1;
                    if (a.fecha > hoyStr && b.fecha <= hoyStr) return 1;
                    return b.fecha.localeCompare(a.fecha);
                }); 

                actualizarInterfaz();
            } catch (e) { console.error("Error cargando datos:", e); }
        } 

        function actualizarInterfaz() {
            const hoyStr = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value;
            let saldoReal = 0, gFuturos = 0, iFuturos = 0, dAqua = 0, dExplora = 0; 

            document.getElementById('listaPasado').innerHTML = '';
            document.getElementById('listaFuturo').innerHTML = ''; 

            appData.forEach(g => {
                const val = Math.abs(g.importe);
                const esI = categIngresos.includes(g.categoria);
                const esP = g.fecha <= hoyStr; 

                if (g.categoria === "Tarjeta Aqua") dAqua += val;
                if (g.categoria === "Tarjeta Explora") dExplora += val; 

                if(esP) { esI ? saldoReal += val : saldoReal -= val; } 
                else { esI ? iFuturos += val : gFuturos += val; }
                
                const disp = isPrivate ? "****€" : val.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€"; 

                if(g.fecha.startsWith(mesSel)) {
                    const estiloFuturo = !esP ? 'opacity-40 border-l-4 border-cyan-400' : '';
                    document.getElementById('listaPasado').insertAdjacentHTML('beforeend', `
                        <div class="bbva-card p-4 flex justify-between items-center gap-3 ${estiloFuturo}">
                            <div class="flex items-center gap-3 truncate">
                                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold">${g.concepto.charAt(0)}</div>
                                <div class="truncate">
                                    <p class="text-sm font-bold truncate">${g.concepto}</p>
                                    <p class="text-[9px] text-slate-500 uppercase">${g.fecha}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <p class="font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI ? '+' : '-'}${disp}</p>
                                <button onclick="deleteGasto('${g._id}')" class="btn-action text-rose-500">🗑️</button>
                            </div>
                        </div>`);
                } 

                if(!esP) {
                    document.getElementById('listaFuturo').insertAdjacentHTML('beforeend', `
                        <div class="bbva-card border-l-4 border-cyan-400 p-5 flex justify-between items-center">
                            <div><p class="font-black">${g.concepto}</p><p class="text-[10px] text-slate-500">${g.fecha}</p></div>
                            <p class="text-xl font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI ? '+' : '-'}${disp}</p>
                        </div>`);
                }
            });

            document.getElementById('valReal').innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valPend').innerText = isPrivate ? "****€" : "-" + gFuturos.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valProj').innerText = isPrivate ? "****€" : (saldoReal - gFuturos + iFuturos).toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('card-aqua-val').innerText = isPrivate ? "****€" : dAqua.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('card-explora-val').innerText = isPrivate ? "****€" : dExplora.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€"; 
            
            updateChart();
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                concepto: document.getElementById('in-concepto').value,
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };

            try {
                // POST BLINDADO
                await fetch(API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'x-api-key': SECURE_KEY }, 
                    body: JSON.stringify(payload) 
                }); 
                e.target.reset();
                renderApp();
                goToTab(0);
            } catch (error) { console.error("Error guardando:", error); }
        };

        async function deleteGasto(id) {
            if (!confirm("¿Eliminar?")) return; 
            try {
                // DELETE BLINDADO
                await fetch(`${API_URL}/${id}`, { 
                    method: 'DELETE',
                    headers: { 'x-api-key': SECURE_KEY }
                });
                renderApp(); 
            } catch (error) { console.error("Error borrando:", error); }
        } 

        function goToTab(i) {
            currentTabIndex = i;
            document.getElementById('main-view').style.transform = `translateX(-${i * 16.666}%)`; 
            document.querySelectorAll('.nav-btn').forEach((b, idx) => {
                idx === i || (i===2 && idx===1) ? b.classList.add('active-tab') : b.classList.remove('active-tab');
            });
        } 

        function togglePrivacy() { isPrivate = !isPrivate; actualizarInterfaz(); } 
        function updateChart() { /* Lógica del ChartJS */ }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
