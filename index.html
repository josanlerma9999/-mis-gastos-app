<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v10.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; height: 100vh; overflow: hidden; }

        /* Contenedor Principal: OCUPA TODO EL ANCHO como en tus fotos */
        .main-container { height: calc(100vh - 85px); overflow-y: auto; padding: 0; -webkit-overflow-scrolling: touch; }
        
        /* Secciones con Scroll independiente */
        .tab-content { width: 100%; padding: 0 0 100px 0; }

        /* Tarjetas Estilo Foto: Sin márgenes laterales, esquinas redondeadas solo abajo si es necesario */
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); width: 100%; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); width: 100%; }

        /* PIN SCREEN */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 75px; height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        /* Navegación Inferior */
        nav { height: 85px; background: #000; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 20px; }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); padding-top: 5px; }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="text-center mb-10 italic font-[900] text-[#00e5ff] text-4xl tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-6">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="resetPin()" class="text-[10px] opacity-30 font-bold uppercase">Reset</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="delPin()" class="text-[10px] opacity-30 font-bold uppercase">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black sticky top-0 z-50">
            <div class="flex flex-col">
                <h1 class="font-[900] text-2xl italic leading-none tracking-tighter">BBVA</h1>
                <span class="text-[10px] text-cyan-400 font-black uppercase tracking-widest mt-1">v10.6 MASTER</span>
            </div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()" id="eye-icon" class="text-2xl">👁️</button>
                <button onclick="location.reload()" class="opacity-20 text-2xl">🔒</button>
            </div>
        </header>

        <main class="main-container">
            <section id="tab-cuenta" class="tab-content space-y-2">
                <div class="p-10 text-center bbva-gradient border-b border-white/10 rounded-b-[2.5rem]">
                    <p class="text-[12px] uppercase tracking-[0.3em] text-white/40 mb-3 font-bold">PATRIMONIO GLOBAL</p>
                    <h2 id="valReal" class="text-6xl font-[900] tracking-tighter italic">****€</h2>
                </div>
                <div class="bg-bbva-card p-6 rounded-[2.5rem] mt-2">
                    <div style="height:250px;"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-3 mt-8"></div>
                </div>
                <button class="w-full py-10 text-[10px] text-zinc-700 uppercase font-black tracking-widest">LIMPIAR CACHÉ DE ALERTAS</button>
            </section>

            <section id="tab-mes" class="tab-content hidden p-4 space-y-4">
                <div id="listaMes" class="space-y-3"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-8 rounded-b-[3rem] border-b-4 border-cyan-400 shadow-2xl">
                    <form id="mainForm" class="space-y-6">
                        <input type="hidden" id="in-id">
                        <div>
                            <label class="text-[11px] font-[900] text-cyan-400 uppercase ml-1">CONCEPTO</label>
                            <input type="text" id="in-concepto" placeholder="Ej: Supermercado" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl text-white outline-none text-xl">
                        </div>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-6 bg-black/40 border border-white/10 rounded-[2rem] font-[900] text-6xl text-white text-center outline-none">
                        
                        <div class="flex justify-between items-center bg-white/5 p-5 rounded-2xl border border-white/10">
                            <span class="text-[11px] font-black uppercase text-slate-400 italic">¿PAGO RECURRENTE?</span>
                            <input type="checkbox" id="in-es-recurrente" class="w-8 h-8 accent-cyan-400 rounded">
                        </div>

                        <select id="in-categoria" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl text-xl font-bold">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Amazon">📦 Amazon</option>
                            <option value="PayPal">💳 PayPal</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl text-xl font-bold text-center">
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-[#072146] font-[900] py-6 rounded-[2rem] uppercase text-xl shadow-2xl tracking-widest mt-4">CONFIRMAR</button>
                    </form>
                </div>
            </section>
        </main>

        <nav>
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab">
                <span class="text-3xl">🏦</span><span class="text-[9px] font-black uppercase mt-1">GLOBAL</span>
            </button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center text-slate-500">
                <span class="text-3xl">📋</span><span class="text-[9px] font-black uppercase mt-1">LISTA</span>
            </button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center text-slate-500">
                <span class="text-3xl">➕</span><span class="text-[9px] font-black uppercase mt-1">OPERAR</span>
            </button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00e5ff', '#004481', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185', '#6366f1'];
        let appData = [], currentPin = "", isPrivate = true, mainChart = null;

        function pressPin(n) {
            if(currentPin.length < 4) {
                currentPin += n;
                updateDots();
                if(currentPin.length === 4) {
                    if(currentPin === "1234") {
                        document.getElementById('pin-screen').classList.add('hidden');
                        document.getElementById('app-content').classList.remove('hidden');
                        renderApp();
                    } else { alert("PIN Incorrecto"); resetPin(); }
                }
            }
        }
        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((d, i) => i < currentPin.length ? d.classList.add('filled') : d.classList.remove('filled'));
        }
        function resetPin() { currentPin = ""; updateDots(); }
        function delPin() { currentPin = currentPin.slice(0, -1); updateDots(); }

        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('eye-icon').innerText = isPrivate ? '👁️' : '🙈'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                let total = 0, cats = {};
                const list = document.getElementById('listaMes'); list.innerHTML = '';

                appData.forEach(g => {
                    const v = parseFloat(g.importe);
                    const isI = (g.categoria === "Sueldo");
                    total += isI ? v : -v;
                    if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + v;
                    
                    list.innerHTML += `
                        <div class="bg-bbva-card p-6 flex justify-between items-center border-l-8 ${isI?'border-cyan-400':'border-rose-500'} rounded-2xl shadow-lg">
                            <div><p class="font-[900] text-white text-xl">${g.concepto}</p><p class="text-xs text-slate-500 font-black uppercase mt-1">${g.fecha}</p></div>
                            <div class="flex items-center gap-4">
                                <p class="font-[900] text-2xl ${isI?'text-cyan-400':'text-rose-400'}">${isPrivate?'****':v.toFixed(2)}€</p>
                                <button onclick="preEdit('${g._id}')" class="text-xl">✏️</button>
                            </div>
                        </div>`;
                });
                document.getElementById('valReal').innerText = isPrivate ? "****€" : total.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) {}
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '82%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                    <div class="flex items-center gap-3"><div class="w-4 h-4 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[11px] font-black uppercase text-slate-400 truncate w-24">${l}</span></div>
                    <span class="text-sm font-black text-white">${isPrivate?'***':data[l].toFixed(0)}€</span>
                </div>`).join('');
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(id ? `${API_URL}/${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
