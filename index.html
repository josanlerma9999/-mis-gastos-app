<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Precision v9.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .hidden { display: none !important; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        /* Ajuste para que la sección ocupe el alto visual */
        .full-view { min-height: calc(100vh - 160px); display: flex; flex-direction: column; justify-content: space-between; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-black/90 backdrop-blur-md p-4 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
        <div class="flex flex-col">
            <h1 class="font-[900] text-xl tracking-tighter italic leading-none text-white">BBVA</h1>
            <span class="text-[7px] uppercase tracking-[0.3em] text-[#00e5ff] font-bold">Private Banking</span>
        </div>
        <span class="text-[8px] font-mono text-[#00e5ff] opacity-60">v9.6-PRECISION</span>
    </header>

    <main class="max-w-md mx-auto p-3">
        
        <section id="tab-cuenta" class="tab-content">
            <div class="full-view">
                <div class="p-5 rounded-[2rem] text-center bbva-gradient border border-white/5">
                    <p class="text-[8px] uppercase font-black tracking-widest mb-1 text-cyan-300/50">Saldo Disponible</p>
                    <h2 id="valReal" class="text-4xl font-[900] tracking-tighter text-white">0.00€</h2>
                </div>
                
                <div class="h-48 my-4"><canvas id="chartGastos"></canvas></div>
                
                <div id="legendBox" class="grid grid-cols-2 gap-2 mb-6"></div>
            </div>

            <div class="bg-zinc-900/40 p-5 rounded-2xl border border-dashed border-zinc-800 mt-10">
                <p class="text-[9px] font-mono uppercase mb-3 opacity-30">Status Monitor</p>
                <div class="font-mono text-[9px] flex justify-between opacity-50">
                    <p>Ping: <span id="debug-ping" class="text-[#00e5ff]">--</span></p>
                    <p>DB: <span id="debug-count" class="text-[#00e5ff]">0</span></p>
                    <p>API: <span class="text-emerald-500">Live</span></p>
                </div>
            </div>
        </section>

        <section id="tab-add" class="tab-content hidden h-[75vh] flex flex-col justify-center">
            <div class="bg-bbva-card p-6 rounded-[2.5rem] shadow-2xl border-b-4 border-[#00e5ff]">
                <h2 class="text-center font-black uppercase text-[10px] text-[#00e5ff] mb-6 tracking-widest">Nueva Operación</h2>
                <form id="mainForm" class="space-y-4">
                    <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white text-base outline-none focus:border-[#00e5ff]">
                    
                    <div class="relative">
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-5 bg-black/40 border border-white/10 rounded-xl font-[900] text-4xl text-white outline-none">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[#00e5ff] font-black text-xl">€</span>
                    </div>

                    <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white text-base outline-none">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                        <option value="Tarjeta Explora">🧭 Tarjeta Explora</option>
                        <option value="Imagine">🟣 Imagine</option>
                        <option value="PayPal">💳 PayPal</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                        <option value="El Corte Inglés">🏬 El Corte Inglés</option>
                        <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                        <option value="Otros Ingresos">💵 Otros</option>
                    </select>

                    <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white text-base outline-none">
                    
                    <button type="submit" class="w-full bg-[#00e5ff] text-[#072146] font-[900] py-5 rounded-xl text-xs uppercase tracking-widest mt-2 shadow-lg active:scale-95 transition-all">Confirmar Envío</button>
                </form>
            </div>
        </section>

        <section id="tab-mes" class="tab-content hidden space-y-3">
            <div class="bg-bbva-card p-3 rounded-xl flex justify-between items-center px-4">
                <input type="month" id="filtroMes" class="bg-transparent text-white font-bold outline-none invert text-sm" onchange="renderApp()">
                <button onclick="exportarCSV()" class="text-[#00e5ff] font-black text-[10px] uppercase">CSV</button>
            </div>
            <div id="listaMes" class="space-y-2"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-xl border-t border-white/5 flex justify-around p-3 pb-8 z-50">
        <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab">
            <span class="text-2xl">🏦</span><span class="text-[7px] font-black uppercase tracking-widest">Global</span>
        </button>
        <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500">
            <span class="text-2xl">📋</span><span class="text-[7px] font-black uppercase tracking-widest">Extracto</span>
        </button>
        <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500">
            <span class="text-2xl">➕</span><span class="text-[7px] font-black uppercase tracking-widest">Operar</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#004481', '#00e5ff', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185', '#d946ef', '#4ade80'];
        let appData = [], mainChart = null;

        async function renderApp() {
            const start = Date.now();
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                document.getElementById('debug-ping').innerText = (Date.now() - start) + "ms";
                document.getElementById('debug-count').innerText = appData.length;

                const hoy = new Date().toISOString().split('T')[0], mesSel = document.getElementById('filtroMes').value;
                let real=0, cats={};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML='';

                appData.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).forEach(g => {
                    const val = parseFloat(g.importe), isI = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    if (g.fecha <= hoy) isI ? real+=val : real-=val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        lMes.innerHTML += itemHTML(g, isI);
                    }
                });
                document.getElementById('valReal').innerText = real.toFixed(2)+"€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function itemHTML(g, isI) {
            return `<div class="bg-bbva-card p-4 rounded-xl flex justify-between items-center border-l-2 ${isI?'border-[#00e5ff]':'border-rose-500'}">
                <div>
                    <p class="font-bold text-white text-[13px] leading-tight mb-1">${g.concepto}</p>
                    <p class="text-[9px] font-black uppercase tracking-tighter">
                        <span class="text-slate-500">${g.categoria}</span> 
                        <span class="mx-1 text-slate-700">•</span> 
                        <span style="color: #00e5ff !important; font-weight: 800;">Día ${g.fecha.split('-')[2]}</span>
                    </p>
                </div>
                <p class="font-[900] text-base ${isI?'text-[#00e5ff]':'text-rose-400'}">${parseFloat(g.importe).toFixed(2)}€</p>
            </div>`;
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            if (labels.length === 0) return;
            
            mainChart = new Chart(ctx, { 
                type: 'doughnut', 
                data: { labels: labels, datasets: [{ data: values, backgroundColor: COLORS, borderWidth: 2, borderColor: '#072146' }] }, 
                options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '80%' } 
            });

            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="flex items-center justify-between p-2 bg-white/5 rounded-lg border border-white/5">
                    <div class="flex items-center gap-2 truncate">
                        <div class="w-1.5 h-1.5 rounded-full" style="background:${COLORS[i]}"></div>
                        <span class="text-[7px] font-bold text-slate-400 uppercase truncate">${l}</span>
                    </div>
                    <span class="text-[8px] font-black text-white ml-2">${values[i].toFixed(0)}€</span>
                </div>`).join('');
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }
        
        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
        renderApp();
    </script>
</body>
</html>
