<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v16.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.1s ease;
        }
        .num-btn:active { background: var(--bbva-cyan) !important; color: #000 !important; box-shadow: 0 0 30px var(--bbva-cyan); transform: scale(0.9); } 
        .bbva-card { background: var(--bbva-navy); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1rem; width: 100%; color: white; outline: none; }
        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; touch-action: pan-y; }
        #main-view { display: flex; width: 500%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 20%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }
    </style>
</head>
<body> 

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div> 

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4"><button onclick="togglePrivacy()">👁️</button><button onclick="location.reload()">🔒</button></div>
        </header> 

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-lg">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-5xl font-black tracking-tighter">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center"><p class="text-[9px] text-slate-400 uppercase tracking-widest">Saldo Final</p><p id="valProj" class="text-xl font-bold text-cyan-400">0.00€</p></div>
                        <div class="bbva-card p-5 text-center"><p class="text-[9px] text-slate-400 uppercase tracking-widest">Próximos Pagos</p><p id="valPend" class="text-xl font-bold text-rose-400">0.00€</p></div>
                    </div>
                    <div class="bbva-card p-6"><canvas id="gastosChart" style="max-height: 200px;"></canvas></div>
                </section>
                <section class="tab-content"><h3 class="text-xs font-bold text-cyan-400 uppercase mb-4">Planes</h3><div id="listaFuturo" class="space-y-3"></div></section>
                <section class="tab-content"><h3 class="text-xs font-bold text-purple-400 uppercase mb-4">Fijos</h3><div id="listaRecurrentes" class="space-y-3"></div></section>
                <section class="tab-content"><input type="month" id="filtroMes" class="bbva-input mb-4" onchange="renderApp()"><div id="listaPasado" class="space-y-2 pb-20"></div></section>
                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-2xl text-center" required>
                        <select id="in-categoria" class="bbva-input"><option value="Varios">Varios</option><option value="Sueldo">Sueldo</option><option value="Tarjeta Aqua">Tarjeta Aqua</option></select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <div class="flex items-center gap-2"><input type="checkbox" id="check-recurrente"> <label class="text-xs">Pago mensual fijo</label></div>
                        <button type="submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section>
            </div>
        </div> 

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center">🏠</button>
            <button onclick="goToTab(1)" class="nav-btn flex-1 flex flex-col items-center text-slate-500">⏳</button>
            <button onclick="goToTab(2)" class="nav-btn flex-1 flex flex-col items-center text-slate-500">🔄</button>
            <button onclick="goToTab(3)" class="nav-btn flex-1 flex flex-col items-center text-slate-500">📋</button>
            <button onclick="goToTab(4)" class="nav-btn flex-1 flex flex-col items-center text-slate-500">➕</button>
        </nav>
    </div> 

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let pin = "", appData = [], currentTabIndex = 0, isPrivate = false;

        // GENERAR PIN PAD (CORREGIDO)
        const pad = document.getElementById('pin-pad');
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button');
            b.className = "num-btn";
            b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; 
                else if(v === 'DEL') pin = pin.slice(0,-1); 
                else if(pin.length < 4) pin += v;
                
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                
                if(pin === "1763") {
                    document.getElementById('pin-screen').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                    renderApp();
                }
            };
            pad.appendChild(b);
        });

        function goToTab(i) {
            currentTabIndex = i;
            document.getElementById('main-view').style.transform = `translateX(-${i * 20}%)`;
            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
        }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date().toISOString().split('T')[0];
                const mesSel = document.getElementById('filtroMes').value || hoy.slice(0, 7);
                let saldoReal = 0, gFuturos = 0;
                
                document.getElementById('listaPasado').innerHTML = '';
                document.getElementById('listaFuturo').innerHTML = '';

                appData.forEach(g => {
                    const val = Math.abs(parseFloat(g.importe));
                    const esI = ["Sueldo", "Otros Ingresos"].includes(g.categoria);
                    const esP = g.fecha <= hoy;
                    
                    if(esP) { esI ? saldoReal += val : saldoReal -= val; } else { if(!esI) gFuturos += val; }
                    
                    if(g.fecha.startsWith(mesSel)) {
                        document.getElementById('listaPasado').insertAdjacentHTML('beforeend', `
                            <div class="bbva-card p-4 flex justify-between items-center mb-2">
                                <div><p class="text-sm font-bold">${g.concepto}</p><p class="text-[9px] text-slate-500">${g.fecha}</p></div>
                                <div class="flex items-center gap-3">
                                    <p class="font-black ${esI ? 'text-cyan-400' : 'text-white'}">${esI?'+':'-'}${val.toFixed(2)}€</p>
                                    <button onclick="deleteGasto('${g._id}')">🗑️</button>
                                </div>
                            </div>`);
                    }
                });

                document.getElementById('valReal').innerText = saldoReal.toFixed(2) + "€";
                document.getElementById('valPend').innerText = "-" + gFuturos.toFixed(2) + "€";
                document.getElementById('valProj').innerText = (saldoReal - gFuturos).toFixed(2) + "€";
                renderRecurrentes();
            } catch (e) { console.error(e); }
        }

        function renderRecurrentes() {
            const recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            document.getElementById('listaRecurrentes').innerHTML = recs.map(p => `
                <div class="bbva-card p-4 flex justify-between items-center border-l-4 border-purple-500">
                    <div><p class="font-bold">${p.concepto}</p><p class="text-[10px] text-slate-500">Día ${p.dia}</p></div>
                    <button onclick="borrarRecurrente(${p.id})">🗑️</button>
                </div>`).join('');
        }

        async function borrarRecurrente(id) {
            if(!confirm("¿Borrar todo rastro de este pago?")) return;
            let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
            const p = recs.find(x => x.id === id);
            if(p) {
                const mes = new Date().toISOString().slice(0, 7);
                const aBorrar = appData.filter(g => g.concepto === p.concepto && g.fecha.startsWith(mes));
                for(let g of aBorrar) await fetch(`${API_URL}/${g._id}`, { method: 'DELETE' });
            }
            localStorage.setItem('recurrentes', JSON.stringify(recs.filter(x => x.id !== id)));
            await renderApp();
        }

        async function deleteGasto(id) { if(confirm("¿Eliminar?")) { await fetch(`${API_URL}/${id}`, {method:'DELETE'}); renderApp(); } }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        
        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                concepto: document.getElementById('in-concepto').value,
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
            if(document.getElementById('check-recurrente').checked) {
                let recs = JSON.parse(localStorage.getItem('recurrentes') || "[]");
                recs.push({...data, id: Date.now(), dia: data.fecha.split('-')[2]});
                localStorage.setItem('recurrentes', JSON.stringify(recs));
            }
            renderApp(); goToTab(0);
        };
    </script>
</body>
</html>
