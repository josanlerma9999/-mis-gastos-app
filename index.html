<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA v8 Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; height: 100vh; overflow: hidden; }

        /* PIN v8 */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .num-btn { width: 75px; height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.on { background: var(--bbva-cyan); box-shadow: 0 0 8px var(--bbva-cyan); }

        /* ESTRUCTURA EDGE-TO-EDGE */
        .main-container { height: calc(100vh - 80px); overflow-y: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        .bbva-header { background-color: var(--bbva-navy); width: 100%; padding: 40px 0; text-align: center; }
        .bbva-section { background-color: var(--bbva-navy); width: 100%; border-top: 1px solid rgba(255,255,255,0.05); }

        /* NAVEGACIÓN */
        nav { height: 80px; background: #000; border-top: 1px solid #111; display: flex; position: fixed; bottom: 0; width: 100%; z-index: 100; padding-bottom: 15px; }
        .nav-link { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; }
        .nav-link.active { color: var(--bbva-cyan); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="mb-10 italic font-[900] text-[#00e5ff] text-3xl uppercase tracking-tighter">BBVA</div>
        <div class="flex mb-14">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-6">
            <button onclick="k('1')" class="num-btn">1</button><button onclick="k('2')" class="num-btn">2</button><button onclick="k('3')" class="num-btn">3</button>
            <button onclick="k('4')" class="num-btn">4</button><button onclick="k('5')" class="num-btn">5</button><button onclick="k('6')" class="num-btn">6</button>
            <button onclick="k('7')" class="num-btn">7</button><button onclick="k('8')" class="num-btn">8</button><button onclick="k('9')" class="num-btn">9</button>
            <button onclick="location.reload()" class="text-[10px] opacity-30 font-bold uppercase">Esc</button>
            <button onclick="k('0')" class="num-btn">0</button>
            <button onclick="del()" class="text-[10px] opacity-30 font-bold uppercase">Del</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black">
            <h1 class="font-[900] text-2xl italic tracking-tighter">BBVA</h1>
            <button onclick="toggleP()" id="eye" class="text-xl">👁️</button>
        </header>

        <div class="main-container">
            <div id="p1" class="page">
                <div class="bbva-header">
                    <p class="text-[10px] uppercase tracking-widest text-white/40 mb-1 font-bold">Posición Global</p>
                    <h2 id="total" class="text-4xl font-[900] tracking-tighter italic">****€</h2>
                </div>
                <div class="bbva-section p-6">
                    <div style="height:250px;"><canvas id="chart"></canvas></div>
                    <div id="legs" class="grid grid-cols-2 gap-4 mt-8"></div>
                </div>
            </div>

            <div id="p2" class="page hidden">
                <div id="lista" class="w-full"></div>
            </div>

            <div id="p3" class="page hidden">
                <div class="bbva-section p-8">
                    <form id="form" class="space-y-4">
                        <input type="text" id="con" placeholder="Concepto" class="w-full p-4 bg-black/20 border border-white/5 rounded text-white outline-none">
                        <input type="number" id="imp" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/20 border border-white/5 rounded font-black text-4xl text-center outline-none">
                        <select id="cat" class="w-full p-4 bg-black/20 border border-white/5 rounded font-bold">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Amazon">📦 Amazon</option>
                        </select>
                        <input type="date" id="fec" class="w-full p-4 bg-black/20 border border-white/5 rounded font-bold text-center">
                        <button type="submit" class="w-full bg-cyan-400 text-[#072146] font-[900] py-5 rounded uppercase tracking-widest">Confirmar Operación</button>
                    </form>
                </div>
            </div>
        </div>

        <nav>
            <button onclick="tab('p1',this)" class="nav-link active"><span class="text-2xl">🏦</span><span class="text-[9px] font-black mt-1">GLOBAL</span></button>
            <button onclick="tab('p2',this)" class="nav-link"><span class="text-2xl">📋</span><span class="text-[9px] font-black mt-1">LISTA</span></button>
            <button onclick="tab('p3',this)" class="nav-link"><span class="text-2xl">➕</span><span class="text-[9px] font-black mt-1">OPERAR</span></button>
        </nav>
    </div>

    <script>
        const API = 'https://mis-gastos-app.onrender.com/api/gastos';
        let store = [], pin = "", priv = true, myChart = null;

        function k(n) {
            if(pin.length < 4) {
                pin += n;
                const ds = document.querySelectorAll('.pin-dot');
                ds[pin.length-1].classList.add('on');
                if(pin.length === 4) {
                    if(pin === "1234") {
                        document.getElementById('pin-screen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                        render();
                    } else { pin = ""; ds.forEach(d => d.classList.remove('on')); }
                }
            }
        }
        function del() { pin = pin.slice(0,-1); document.querySelectorAll('.pin-dot')[pin.length].classList.remove('on'); }

        async function render() {
            const res = await fetch(API); store = await res.json();
            let t = 0, cs = {};
            const l = document.getElementById('lista'); l.innerHTML = '';
            store.forEach(g => {
                const v = parseFloat(g.importe); const isI = g.categoria === "Sueldo";
                t += isI ? v : -v; if(!isI) cs[g.categoria] = (cs[g.categoria]||0) + v;
                l.innerHTML += `<div class="p-5 border-b border-white/5 flex justify-between items-center bg-[#072146]">
                    <div><div class="font-black text-white text-sm">${g.concepto}</div><div class="text-[9px] opacity-40 uppercase font-bold">${g.fecha}</div></div>
                    <div class="font-black text-lg ${isI?'text-cyan-400':'text-rose-400'}">${priv?'****':v.toFixed(2)+'€'}</div>
                </div>`;
            });
            document.getElementById('total').innerText = priv ? "****€" : t.toFixed(2) + "€";
            draw(cs);
        }

        function draw(d) {
            const ctx = document.getElementById('chart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type:'doughnut', data:{ labels:Object.keys(d), datasets:[{data:Object.values(d), backgroundColor:['#00e5ff','#004481','#8b5cf6','#10b981'], borderWidth:0}]}, options:{plugins:{legend:{display:false}}, maintainAspectRatio:false, cutout:'85%'}});
            document.getElementById('legs').innerHTML = Object.keys(d).map((k, i) => `<div class="flex items-center gap-2 text-[10px] font-black uppercase"><div class="w-2 h-2 rounded-full" style="background:${['#00e5ff','#004481','#8b5cf6','#10b981'][i]}"></div>${k}</div>`).join('');
        }

        function tab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active');
        }

        function toggleP() { priv = !priv; document.getElementById('eye').innerText = priv ? '👁️' : '🙈'; render(); }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const b = { concepto: document.getElementById('con').value, importe: parseFloat(document.getElementById('imp').value), categoria: document.getElementById('cat').value, fecha: document.getElementById('fec').value };
            await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
            document.getElementById('form').reset(); render(); tab('p1', document.querySelectorAll('.nav-link')[0]);
        });
        document.getElementById('fec').valueAsDate = new Date();
    </script>
</body>
</html>
