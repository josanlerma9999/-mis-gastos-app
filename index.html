<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v11.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* PIN PREMIUM */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .num-btn { width: 75px; height: 75px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); transition: transform 0.1s; }
        .num-btn:active { transform: scale(0.9); background: var(--bbva-cyan); color: #000; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; transition: all 0.2s; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 15px var(--bbva-cyan); }

        /* ESTRUCTURA Y SCROLL */
        .main-container { height: calc(100vh - 85px); overflow-y: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        .tab-content { width: 100%; padding-bottom: 120px; animation: slideUp 0.3s ease-out; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ESTILO BBVA DE BORDE A BORDE */
        .bg-bbva-card { background-color: var(--bbva-navy); width: 100%; }
        .bbva-gradient { background: linear-gradient(180deg, #072146 0%, #004481 100%); width: 100%; }

        /* NAV BAR ESTILO CRISTAL */
        nav { height: 85px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; z-index: 100; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; width: 33%; color: #555; transition: 0.2s; }
        .active-tab { color: var(--bbva-cyan) !important; font-weight: 900; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="mb-8 italic font-[900] text-[#00e5ff] text-4xl uppercase tracking-tighter">BBVA</div>
        <div class="flex mb-16">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-6">
            <button onclick="press('1')" class="num-btn">1</button><button onclick="press('2')" class="num-btn">2</button><button onclick="press('3')" class="num-btn">3</button>
            <button onclick="press('4')" class="num-btn">4</button><button onclick="press('5')" class="num-btn">5</button><button onclick="press('6')" class="num-btn">6</button>
            <button onclick="press('7')" class="num-btn">7</button><button onclick="press('8')" class="num-btn">8</button><button onclick="press('9')" class="num-btn">9</button>
            <button onclick="location.reload()" class="text-[10px] opacity-30 font-black uppercase tracking-widest">ESC</button>
            <button onclick="press('0')" class="num-btn">0</button>
            <button onclick="del()" class="text-[10px] opacity-30 font-black uppercase tracking-widest">DEL</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black sticky top-0 z-50">
            <div class="flex flex-col">
                <h1 class="font-[900] text-2xl italic tracking-tighter leading-none">BBVA</h1>
                <div class="flex items-center gap-1 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-[8px] text-cyan-400 font-black uppercase tracking-widest opacity-80">Seguridad Activa</span>
                </div>
            </div>
            <div class="flex gap-5">
                <button onclick="toggleP()" id="eye" class="text-2xl transition-transform active:scale-90">👁️</button>
                <button onclick="location.reload()" class="opacity-20 text-2xl">🔒</button>
            </div>
        </header>

        <main class="main-container">
            <section id="tab-cuenta" class="tab-content">
                <div class="p-12 text-center bbva-gradient rounded-b-[3rem] shadow-2xl border-b border-cyan-400/10">
                    <p class="text-[10px] uppercase tracking-[0.4em] text-white/40 mb-2 font-bold">Posición Global Total</p>
                    <h2 id="saldo" class="text-5xl font-[900] tracking-tighter italic">****€</h2>
                </div>
                <div class="bg-bbva-card p-6 mt-3 rounded-[2.5rem] border border-white/5">
                    <div style="height:230px;"><canvas id="myChart"></canvas></div>
                    <div id="legends" class="grid grid-cols-2 gap-3 mt-6"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden p-4">
                <div id="listaItems" class="space-y-3"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-8 rounded-b-[3rem] border-b-4 border-cyan-400 shadow-2xl">
                    <form id="gForm" class="space-y-6">
                        <input type="hidden" id="in-id">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-cyan-400 ml-2 uppercase italic">Nombre del comercio o servicio</label>
                            <input type="text" id="c" placeholder="..." class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl text-white outline-none focus:border-cyan-400 transition-colors">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-cyan-400 ml-2 uppercase italic">Cuantía de la operación</label>
                            <input type="number" id="i" step="0.01" placeholder="0.00" class="w-full p-6 bg-black/40 border border-white/10 rounded-3xl font-[900] text-5xl text-center outline-none focus:text-cyan-400 transition-colors">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <select id="cat" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl font-bold text-sm outline-none">
                                <option value="Sueldo">💰 Ingreso</option>
                                <option value="Tarjeta BBVA">🟦 Tarjeta</option>
                                <option value="Amazon">📦 Compras</option>
                                <option value="Gasolina">⛽ Combustible</option>
                            </select>
                            <input type="date" id="d" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl font-bold text-center text-sm outline-none">
                        </div>
                        <button type="submit" class="w-full bg-cyan-400 text-[#072146] font-[900] py-6 rounded-2xl uppercase tracking-widest text-lg active:scale-95 transition-transform shadow-xl">Confirmar Pago</button>
                    </form>
                </div>
            </section>
        </main>

        <nav>
            <button onclick="tab('tab-cuenta', this)" class="nav-btn active-tab">
                <span class="text-3xl">🏦</span><span class="text-[9px] font-black mt-1 uppercase tracking-widest">Global</span>
            </button>
            <button onclick="tab('tab-mes', this)" class="nav-btn">
                <span class="text-3xl">📋</span><span class="text-[9px] font-black mt-1 uppercase tracking-widest">Lista</span>
            </button>
            <button onclick="tab('tab-add', this)" class="nav-btn">
                <span class="text-3xl">➕</span><span class="text-[9px] font-black mt-1 uppercase tracking-widest">Operar</span>
            </button>
        </nav>
    </div>

    <script>
        const API = 'https://mis-gastos-app.onrender.com/api/gastos';
        let store = [], pinIn = "", isP = true, myChart = null;

        function press(n) {
            if(pinIn.length < 4) {
                pinIn += n;
                const dots = document.querySelectorAll('.pin-dot');
                dots[pinIn.length-1].classList.add('filled');
                if(pinIn.length === 4) {
                    if(pinIn === "1234") {
                        document.getElementById('pin-screen').style.display = 'none';
                        document.getElementById('app-content').classList.remove('hidden');
                        render();
                    } else { pinIn = ""; dots.forEach(d => d.classList.remove('filled')); }
                }
            }
        }
        function del() { pinIn = pinIn.slice(0,-1); document.querySelectorAll('.pin-dot')[pinIn.length].classList.remove('filled'); }

        async function render() {
            try {
                const res = await fetch(API); store = await res.json();
                let t = 0, cs = {};
                const list = document.getElementById('listaItems'); list.innerHTML = '';
                
                store.forEach(g => {
                    const v = parseFloat(g.importe); const isS = g.categoria === "Sueldo";
                    t += isS ? v : -v; if(!isS) cs[g.categoria] = (cs[g.categoria]||0) + v;
                    list.innerHTML += `
                        <div class="bg-bbva-card p-5 flex justify-between items-center border-l-8 ${isS?'border-cyan-400':'border-rose-500'} rounded-xl shadow-lg active:scale-95 transition-transform">
                            <div><p class="font-[900] text-white text-lg">${g.concepto}</p><p class="text-[10px] text-slate-500 uppercase font-black">${g.fecha}</p></div>
                            <div class="flex items-center gap-4"><p class="font-[900] text-xl ${isS?'text-cyan-400':'text-rose-400'}">${isP?'****':v.toFixed(2)+'€'}</p>
                            <button onclick="preEdit('${g._id}')" class="text-xl">✏️</button></div></div>`;
                });
                document.getElementById('saldo').innerText = isP ? "****€" : t.toLocaleString('de-DE') + "€";
                draw(cs);
            } catch (e) {}
        }

        function draw(d) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            const labels = Object.keys(d);
            myChart = new Chart(ctx, { type:'doughnut', data:{ labels:labels, datasets:[{data:Object.values(d), backgroundColor:['#00e5ff','#004481','#8b5cf6','#10b981','#f59e0b'], borderWidth:0}]}, options:{plugins:{legend:{display:false}}, maintainAspectRatio:false, cutout:'85%'}});
            document.getElementById('legends').innerHTML = labels.map((l, i) => `
                <div class="bg-white/5 p-3 rounded-xl flex justify-between items-center border border-white/10">
                    <div class="flex items-center gap-2 truncate"><div class="w-2.5 h-2.5 rounded-full" style="background:${['#00e5ff','#004481','#8b5cf6','#10b981','#f59e0b'][i]}"></div><span class="text-[9px] font-black uppercase text-slate-400 truncate w-16">${l}</span></div>
                    <span class="text-[10px] font-black text-white">${isP?'***':d[l].toFixed(0)+'€'}</span>
                </div>`).join('');
        }

        function tab(id, el) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(id).classList.remove('hidden');
            el.classList.add('active-tab');
        }

        function toggleP() { isP = !isP; document.getElementById('eye').innerText = isP ? '👁️' : '🙈'; render(); }
        
        function preEdit(id) {
            const g = store.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('c').value = g.concepto;
            document.getElementById('i').value = g.importe;
            document.getElementById('cat').value = g.categoria;
            document.getElementById('d').value = g.fecha;
            tab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        }

        document.getElementById('gForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const body = { concepto: document.getElementById('c').value, importe: parseFloat(document.getElementById('i').value), categoria: document.getElementById('cat').value, fecha: document.getElementById('d').value };
            await fetch(id ? `${API}/${id}` : API, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            document.getElementById('gForm').reset();
            document.getElementById('in-id').value = "";
            tab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]); render();
        });
        document.getElementById('d').valueAsDate = new Date();
    </script>
</body>
</html>
