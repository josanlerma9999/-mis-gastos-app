<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v16.6 - Visible PIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* CAMBIO SOLICITADO: NÚMEROS DEL PIN VISIBLES */
        .num-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            border: 1px solid rgba(255,255,255,0.15); 
            font-size: 1.6rem; font-weight: 600; 
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); 
            color: white; /* Ahora los números se ven siempre */
            transition: all 0.1s ease;
        }
        .num-btn:active { 
            background: var(--bbva-cyan) !important; 
            color: #000 !important; 
            box-shadow: 0 0 30px var(--bbva-cyan); 
            transform: scale(0.9);
        }

        .bbva-card { background: var(--bbva-navy); border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2rem; }
        .bbva-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1rem; width: 100%; color: white; outline: none; }
        
        #viewport { width: 100%; height: calc(100% - 140px); overflow: hidden; position: relative; }
        #main-view { display: flex; width: 400%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { width: 25%; height: 100%; overflow-y: auto; padding: 1.25rem; -webkit-overflow-scrolling: touch; }
        
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        .btn-action { z-index: 50; position: relative; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 0.8rem; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-top: 1rem; }
    </style>
</head>
<body>

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="text-3xl font-black italic mb-12 text-white tracking-tighter">BBVA</div>
        <div class="flex mb-16" id="pin-dots">
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
            <div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div>
        </div>
        <div class="grid grid-cols-3 gap-5" id="pin-pad"></div>
    </div>

    <div id="app-content" class="hidden h-full flex flex-col text-white">
        <header class="p-5 flex justify-between items-center bg-black">
            <div class="font-black italic text-xl tracking-tighter">BBVA</div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()">👁️</button>
                <button onclick="renderApp()">🔄</button>
                <button onclick="location.reload()">🔒</button>
            </div>
        </header>

        <div id="viewport">
            <div id="main-view">
                <section class="tab-content space-y-5">
                    <div class="p-8 bbva-gradient text-center shadow-lg">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-cyan-300/60 mb-2">Saldo Real Hoy</p>
                        <h2 id="valReal" class="text-5xl font-black tracking-tighter">0.00€</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase">Cierre Proyectado</p>
                            <p id="valProj" class="text-xl font-bold text-cyan-400 mt-1">0.00€</p>
                        </div>
                        <div class="bbva-card p-5 text-center">
                            <p class="text-[9px] text-slate-400 uppercase">Futuro Pendiente</p>
                            <p id="valPend" class="text-xl font-bold text-rose-400 mt-1">0.00€</p>
                        </div>
                    </div>
                    
                    <div class="bbva-card p-6 shadow-xl">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-xs font-bold text-white uppercase tracking-widest">Distribución de Gastos</h3>
                            <span id="filtroChartMes" class="text-[10px] font-black text-cyan-400 uppercase tracking-tight">Este Mes</span>
                        </div>
                        <div class="chart-container">
                            <canvas id="gastosChart"></canvas>
                        </div>
                    </div>
                </section>

                <section class="tab-content">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase mb-4 tracking-widest">Pagos Agendados</h3>
                    <div id="listaFuturo" class="space-y-3"></div>
                </section>

                <section class="tab-content">
                    <input type="month" id="filtroMes" class="bbva-input mb-4" onchange="renderApp()">
                    <div id="listaPasado" class="space-y-2 pb-20"></div>
                </section>

                <section class="tab-content">
                    <form id="mainForm" class="bbva-card p-6 space-y-4 shadow-xl">
                        <h2 id="form-title" class="text-xs font-black uppercase text-cyan-400 tracking-widest mb-2">Operación</h2>
                        <input type="hidden" id="in-id">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-3xl text-center font-bold" required>
                        <select id="in-categoria" class="bbva-input font-bold" required>
                            <optgroup label="INGRESOS (Suman)">
                                <option value="Sueldo">💰 Sueldo</option>
                                <option value="Otros Ingresos">💵 Otros Ingresos</option>
                            </optgroup>
                            <optgroup label="GASTOS (Restan)">
                                <option value="Cuenta BBVA">🏦 Cuenta BBVA</option>
                                <option value="Tarjeta Aqua">🟦 Tarjeta Aqua</option>
                                <option value="Tarjeta Explora">✈️ Tarjeta Explora</option>
                                <option value="PayPal">💳 PayPal</option>
                                <option value="Amazon">📦 Amazon</option>
                                <option value="Gasolina">⛽ Gasolina</option>
                                <option value="Imagine">📱 Imagine</option>
                                <option value="Varios">🛍️ Varios</option>
                            </optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="bbva-input" required>
                        <button type="submit" id="btn-submit" class="w-full bg-cyan-400 text-black font-black py-4 rounded-xl uppercase">Confirmar</button>
                    </form>
                </section>
            </div>
        </div>

        <nav class="bg-black border-t border-white/10 flex justify-around p-3 pb-8">
            <button onclick="goToTab(0)" class="nav-btn active-tab flex-1 flex flex-col items-center gap-1"><span class="text-xl">🏠</span><span class="text-[8px] uppercase">Inicio</span></button>
            <button onclick="goToTab(1)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">⏳</span><span class="text-[8px] uppercase">Planes</span></button>
            <button onclick="goToTab(2)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">📋</span><span class="text-[8px] uppercase">Movs</span></button>
            <button onclick="goToTab(3)" class="nav-btn text-slate-500 flex-1 flex flex-col items-center gap-1"><span class="text-xl">➕</span><span class="text-[8px] uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let pin = "", isPrivate = false, appData = [];
        const categIngresos = ["Sueldo", "Otros Ingresos"];
        let gastosChart = null;

        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1763") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        });

        function goToTab(i) {
            document.getElementById('main-view').style.transform = `translateX(-${i * 25}%)`;
            document.querySelectorAll('.nav-btn').forEach((b, idx) => idx === i ? b.classList.add('active-tab') : b.classList.remove('active-tab'));
            if(i === 0) updateChart();
        }

        async function renderApp() {
            const res = await fetch(API_URL); appData = await res.json();
            const hoy = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value;
            let saldoReal = 0, gFuturos = 0, iFuturos = 0;
            document.getElementById('listaPasado').innerHTML = '';
            document.getElementById('listaFuturo').innerHTML = '';
            appData.sort((a,b) => b.fecha.localeCompare(a.fecha)).forEach(g => {
                const val = Math.abs(parseFloat(g.importe));
                const esIngreso = categIngresos.includes(g.categoria);
                const esPasado = g.fecha <= hoy;
                if(esPasado) { esIngreso ? saldoReal += val : saldoReal -= val; }
                else { esIngreso ? iFuturos += val : gFuturos += val; }
                const disp = isPrivate ? "****€" : val.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
                if(g.fecha.startsWith(mesSel)) {
                    document.getElementById('listaPasado').insertAdjacentHTML('beforeend', `<div class="bbva-card p-4 flex justify-between items-center ${!esPasado ? 'opacity-40 border-l-4 border-cyan-400' : ''}"><div class="flex-1"><p class="text-sm font-bold text-white">${g.concepto}</p><p class="text-[9px] text-slate-500 uppercase mt-1 tracking-tight">${g.fecha} • ${g.categoria}</p></div><div class="flex items-center gap-3"><p class="font-black ${esIngreso ? 'text-cyan-400' : 'text-white'}">${esIngreso ? '+' : '-'}${disp}</p><div class="flex gap-2 relative z-50"><button onclick="event.stopPropagation(); deleteGasto('${g._id}')" class="btn-action text-rose-500">🗑️</button></div></div></div>`);
                }
                if(!esPasado) {
                    document.getElementById('listaFuturo').insertAdjacentHTML('afterbegin', `<div class="bbva-card border-l-4 border-cyan-400 p-5 flex justify-between items-center"><div><p class="font-black text-white">${g.concepto}</p><p class="text-[10px] text-slate-500">${g.fecha}</p></div><p class="text-xl font-black ${esIngreso ? 'text-cyan-400' : 'text-white'}">${esIngreso ? '+' : '-'}${disp}</p></div>`);
                }
            });
            document.getElementById('valReal').innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valPend').innerText = isPrivate ? "****€" : "-" + gFuturos.toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            document.getElementById('valProj').innerText = isPrivate ? "****€" : (saldoReal - gFuturos + iFuturos).toLocaleString('de-DE', {minimumFractionDigits:2}) + "€";
            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('gastosChart').getContext('2d');
            const mesActual = new Date().toISOString().slice(0, 7);
            const desgloseGastos = {}; let totalGastosMes = 0;
            appData.forEach(g => {
                if(g.fecha.startsWith(mesActual) && !categIngresos.includes(g.categoria) && g.fecha <= new Date().toISOString().split('T')[0]) {
                    const val = Math.abs(parseFloat(g.importe));
                    if(!desgloseGastos[g.categoria]) desgloseGastos[g.categoria] = 0;
                    desgloseGastos[g.categoria] += val; totalGastosMes += val;
                }
            });
            const labels = Object.keys(desgloseGastos);
            const data = Object.values(desgloseGastos);
            const colores = ['#00e5ff', '#ff4081', '#7c4dff', '#ffeb3b', '#4caf50', '#ff9800', '#009688', '#f44336'];
            if (gastosChart) gastosChart.destroy();
            gastosChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: colores, borderColor: '#072146', borderWidth: 2, hoverOffset: 10 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right', labels: { color: 'white', font: { size: 10, weight: 'bold' }, boxWidth: 12, padding: 10 } } } }
            });
        }

        async function deleteGasto(id) {
            if(confirm("¿Eliminar?")) { await fetch(`${API_URL}/${id}`, {method:'DELETE'}); renderApp(); }
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            await fetch(id ? `${API_URL}/${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            e.target.reset(); document.getElementById('in-id').value = ""; renderApp(); goToTab(0);
        };

        function togglePrivacy() { isPrivate = !isPrivate; renderApp(); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
    </script>
</body>
</html>
