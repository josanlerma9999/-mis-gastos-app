<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 2px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        /* PIN */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 8px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        /* Scroll Area */
        .scroll-container { height: calc(100vh - 140px); overflow-y: auto; padding-bottom: 40px; }
        
        /* Nav Estrecha */
        nav { height: 70px; padding-bottom: 20px !important; }

        .debug-section { background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; }
        .btn-action { padding: 8px; border-radius: 10px; font-size: 14px; }
    </style>
</head>
<body class="bg-black">

    <div id="pin-screen">
        <div class="text-center mb-10 italic font-[900] text-[#00e5ff] text-4xl">BBVA</div>
        <div class="flex mb-16" id="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] opacity-30 font-bold uppercase">Reset</button><button onclick="pressPin('0')" class="num-btn">0</button><button onclick="deleteLast()" class="text-[10px] opacity-30 font-bold uppercase">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black sticky top-0 z-50 border-b border-white/10">
            <div>
                <h1 class="font-black text-xl italic leading-none">BBVA</h1>
                <span class="text-[8px] text-[#00e5ff] tracking-widest uppercase">v12.0 Shadow</span>
            </div>
            <div class="flex gap-4 items-center">
                <button onclick="togglePrivacy()" id="eye-icon" class="text-xl">👁️</button>
                <button onclick="location.reload()" class="opacity-40">🔒</button>
            </div>
        </header>

        <main class="p-2">
            <section id="tab-cuenta" class="tab-content scroll-container space-y-4">
                <div id="alert-pago" class="hidden bg-cyan-900/40 border-l-4 border-cyan-400 p-4 rounded-xl text-[10px] font-black text-cyan-400 uppercase text-center"></div>
                
                <div class="p-8 rounded-[2.5rem] text-center bbva-gradient shadow-2xl border border-white/5 relative overflow-hidden">
                    <p class="text-[10px] uppercase tracking-[0.2em] text-white/40 mb-2 font-bold">Patrimonio Global</p>
                    <h2 id="valReal" class="text-5xl font-black italic">****€</h2>
                </div>

                <div class="bg-bbva-card p-5 rounded-[2.5rem] border border-white/5">
                    <div style="height:180px"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 mt-6"></div>
                </div>

                <div class="debug-section p-6 rounded-[2rem] mt-10 opacity-60">
                    <h3 class="text-[9px] font-black uppercase text-cyan-400 mb-4 tracking-widest">Panel de Control</h3>
                    <div class="space-y-2 text-[10px] text-white/50 mb-6">
                        <div class="flex justify-between"><span>SERVIDOR:</span><span id="debug-status" class="text-emerald-400 font-bold uppercase">Online</span></div>
                        <div class="flex justify-between"><span>REGISTROS:</span><span id="debug-count">0</span></div>
                    </div>
                    <button onclick="resetAllAlerts()" class="w-full bg-rose-900/20 text-rose-400 py-4 rounded-2xl border border-rose-500/20 font-black uppercase text-[10px] tracking-widest">
                        Limpiar Pagos Recurrentes
                    </button>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden scroll-container space-y-2">
                <div class="flex gap-2 mb-2 bg-bbva-card p-3 rounded-2xl border border-white/5">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-bold outline-none flex-1" onchange="renderApp()">
                    <button onclick="exportarExcel()" class="bg-cyan-400 text-navy-900 font-black px-4 py-2 rounded-xl text-[10px] uppercase text-[#072146]">Excel</button>
                </div>
                <div id="listaMes" class="space-y-2"></div>
            </section>

            <section id="tab-add" class="tab-content hidden scroll-container pt-2">
                <div class="bg-bbva-card p-6 rounded-[2.5rem] border-t-4 border-cyan-400 shadow-2xl">
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="in-id">
                        <div>
                            <label class="text-[10px] font-black text-cyan-400 uppercase ml-1">Concepto</label>
                            <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-400/50" required>
                        </div>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-2xl font-black text-4xl text-white text-center outline-none" required>
                        
                        <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/10">
                            <span class="text-[10px] font-black uppercase text-white/40 italic">¿Programar Recurrente?</span>
                            <input type="checkbox" id="in-es-recurrente" class="w-6 h-6 accent-cyan-400">
                        </div>
                        <div id="config-recurrente" class="hidden">
                            <input type="number" id="in-dia-pago" placeholder="Día del mes (1-31)" class="w-full p-4 bg-cyan-900/20 border border-cyan-400/30 rounded-xl text-white outline-none">
                        </div>

                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-sm">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="PayPal">💳 PayPal</option>
                            <option value="Amazon">📦 Amazon</option>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-sm">
                        <button type="submit" class="w-full bg-cyan-400 text-navy-900 font-black py-5 rounded-2xl uppercase text-[11px] shadow-xl text-[#072146] tracking-widest">
                            Guardar Operación
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/10 flex justify-around items-center z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab"><span class="text-2xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-2xl">📋</span><span class="text-[7px] font-black uppercase">Lista</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center text-white/40"><span class="text-2xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        const COLORS = ['#00e5ff', '#004481', '#8b5cf6', '#10b981', '#f59e0b', '#fb7185'];
        let appData = [], currentPinInput = "", isPrivate = true, mainChart = null;
        let recurrentes = JSON.parse(localStorage.getItem('bbva_recurrentes') || '[]');

        // PIN LOGIC
        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(currentPinInput === (localStorage.getItem('bbva_user_pin') || "1234")) unlock();
                    else { alert("PIN Incorrecto"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        function togglePrivacy() { isPrivate = !isPrivate; document.getElementById('eye-icon').innerText = isPrivate ? '👁️' : '🙈'; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                document.getElementById('debug-count').innerText = appData.length;
                
                const hoy = new Date();
                const hoyStr = hoy.toISOString().split('T')[0];
                const mesSel = document.getElementById('filtroMes').value;
                let total = 0, cats = {};
                const list = document.getElementById('listaMes'); list.innerHTML = '';

                appData.forEach(g => {
                    const v = parseFloat(g.importe);
                    const isI = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoyStr) isI ? total += v : total -= v;

                    if (g.fecha.startsWith(mesSel)) {
                        if(!isI) cats[g.categoria] = (cats[g.categoria]||0) + v;
                        list.innerHTML += `
                            <div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center border-l-4 ${isI?'border-cyan-400':'border-rose-500'}">
                                <div><p class="font-bold text-sm text-white">${g.concepto}</p><p class="text-[9px] text-white/40 uppercase font-bold">${g.fecha}</p></div>
                                <div class="flex items-center gap-3">
                                    <p class="font-black text-sm ${isI?'text-cyan-400':'text-rose-400'}">${isPrivate?'****':v.toFixed(2)}€</p>
                                    <button onclick="preEdit('${g._id}')" class="btn-action text-cyan-400 bg-cyan-400/10">✏️</button>
                                    <button onclick="deleteGasto('${g._id}')" class="btn-action text-rose-400 bg-rose-400/10">🗑️</button>
                                </div>
                            </div>`;
                    }
                });

                // Lógica de Pagos Recurrentes
                const banner = document.getElementById('alert-pago'); banner.style.display = 'none';
                recurrentes.forEach(r => {
                    if (hoy.getDate() >= r.dia) {
                        total -= r.importe;
                        if(hoy.getDate() === r.dia) {
                            banner.innerText = `🔔 PAGO PROGRAMADO HOY: ${r.concepto} (-${r.importe}€)`;
                            banner.style.display = 'block';
                        }
                    }
                });

                document.getElementById('valReal').innerText = isPrivate ? "****€" : total.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) { document.getElementById('debug-status').innerText = "ERROR"; }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: Object.values(data), backgroundColor: COLORS, borderWidth: 0 }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '85%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `
                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:${COLORS[i]}"></div><span class="text-[8px] font-bold uppercase text-white/40">${l}</span></div>
                    <span class="text-[9px] font-black">${isPrivate?'***':data[l].toFixed(0)}€</span>
                </div>`).join('');
        }

        async function deleteGasto(id) {
            if(confirm("¿Eliminar este registro permanentemente?")) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                renderApp();
            }
        }

        function preEdit(id) {
            const g = appData.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { 
                concepto: document.getElementById('in-concepto').value, 
                importe: parseFloat(document.getElementById('in-importe').value),
                categoria: document.getElementById('in-categoria').value,
                fecha: document.getElementById('in-fecha').value
            };
            if(document.getElementById('in-es-recurrente').checked) {
                recurrentes.push({ concepto: data.concepto, importe: data.importe, dia: parseInt(document.getElementById('in-dia-pago').value) });
                localStorage.setItem('bbva_recurrentes', JSON.stringify(recurrentes));
            }
            await fetch(id ? `${API_URL}/${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset(); document.getElementById('in-id').value = "";
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
            renderApp();
        });

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-white/40')); 
            el.classList.replace('text-white/40', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function resetAllAlerts() {
            if(confirm("Se borrarán las alertas de pagos recurrentes. ¿Continuar?")) {
                recurrentes = []; localStorage.setItem('bbva_recurrentes', '[]'); renderApp();
            }
        }

        function exportarExcel() { /* CSV Download logic */ }
        
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
        document.getElementById('in-es-recurrente').addEventListener('change', function() { document.getElementById('config-recurrente').classList.toggle('hidden', !this.checked); });
    </script>
</body>
</html>
