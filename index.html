<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Master v11.3 - Ajuste Espacio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; }
        .bg-bbva-card { background-color: var(--bbva-navy); border: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
        
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); box-shadow: 0 0 10px var(--bbva-cyan); }
        .num-btn { width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        .slider-wrapper { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; scrollbar-width: none; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .card-slide { min-width: 100%; scroll-snap-align: start; }

        .donut-container { height: 200px; width: 100%; display: flex; justify-content: center; align-items: center; margin: 5px 0; }
        
        .btn-edit { color: #00e5ff; padding: 8px; border-radius: 8px; background: rgba(0, 229, 255, 0.1); }
        .btn-delete { color: #ff4d4d; padding: 8px; border-radius: 8px; background: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body class="pb-20"> <div id="pin-screen">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-[900] italic text-[#00e5ff] tracking-tighter">BBVA</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] text-white/40 mt-2">Acceso Privado</p>
        </div>
        <div class="flex mb-16" id="pin-dots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="grid grid-cols-3 gap-5">
            <button onclick="pressPin('1')" class="num-btn">1</button><button onclick="pressPin('2')" class="num-btn">2</button><button onclick="pressPin('3')" class="num-btn">3</button>
            <button onclick="pressPin('4')" class="num-btn">4</button><button onclick="pressPin('5')" class="num-btn">5</button><button onclick="pressPin('6')" class="num-btn">6</button>
            <button onclick="pressPin('7')" class="num-btn">7</button><button onclick="pressPin('8')" class="num-btn">8</button><button onclick="pressPin('9')" class="num-btn">9</button>
            <button onclick="clearPin()" class="text-[10px] uppercase font-bold opacity-30">Reset</button>
            <button onclick="pressPin('0')" class="num-btn">0</button>
            <button onclick="deleteLast()" class="text-[10px] uppercase font-bold opacity-30">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-black/90 p-4 sticky top-0 z-50 flex justify-between items-center border-b border-white/10">
            <div class="flex flex-col">
                <h1 class="font-[900] text-xl italic text-white leading-none">BBVA</h1>
                <span class="text-[9px] font-bold text-[#00e5ff] mt-1 uppercase tracking-wider">v11.3 Editor</span>
            </div>
            <button onclick="location.reload()" class="bg-white/5 p-2 rounded-full border border-white/10">🔒</button>
        </header>

        <main class="max-w-md mx-auto p-2">
            <section id="tab-cuenta" class="tab-content flex flex-col gap-2">
                <div class="slider-wrapper">
                    <div class="card-slide">
                        <div class="p-6 rounded-[2rem] text-center bbva-gradient border border-white/10 shadow-xl relative">
                            <div class="flex justify-center items-center gap-2 mb-1">
                                <p class="text-[9px] uppercase font-black tracking-widest text-cyan-300/40">Patrimonio Neto Actual</p>
                                <span onclick="togglePrivacy()" class="text-lg cursor-pointer">👁️</span>
                            </div>
                            <h2 id="valReal" class="text-5xl font-[900] tracking-tighter text-white">0.00€</h2>
                        </div>
                    </div>
                    <div class="card-slide">
                        <div class="p-6 rounded-[2rem] text-center bg-[#004481] border border-cyan-400/30 shadow-xl relative">
                            <div class="flex justify-center items-center gap-2 mb-1">
                                <p class="text-[9px] uppercase font-black tracking-widest text-cyan-300/60">Disponible fin de mes</p>
                            </div>
                            <h2 id="valPrevision" class="text-5xl font-[900] tracking-tighter text-cyan-400">0.00€</h2>
                        </div>
                    </div>
                </div>

                <div class="bg-bbva-card p-3 rounded-[2rem] flex flex-col items-center mt-2">
                    <div class="donut-container"><canvas id="chartGastos"></canvas></div>
                    <div id="legendBox" class="grid grid-cols-2 gap-2 w-full mt-2"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden space-y-2">
                <div class="bg-bbva-card p-4 rounded-xl flex justify-between gap-3 items-center">
                    <input type="month" id="filtroMes" class="bg-transparent text-white font-black outline-none w-full" onchange="renderApp()">
                </div>
                <div id="listaMes" class="space-y-2"></div>
            </section>

            <section id="tab-add" class="tab-content hidden flex flex-col pt-1 -mb-6">
                <div class="bg-bbva-card p-5 rounded-[2.5rem] border-t-4 border-[#00e5ff] w-full mt-0">
                    <form id="mainForm" class="space-y-3">
                        <input type="hidden" id="in-id">
                        <input type="text" id="in-concepto" placeholder="Concepto" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none" required>
                        <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl font-bold text-3xl text-white outline-none" required>
                        <select id="in-categoria" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                            <optgroup label="INGRESOS"><option value="Sueldo">💰 Sueldo</option><option value="Otros Ingresos">💵 Otros Ingresos</option></optgroup>
                            <optgroup label="GASTOS"><option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option><option value="PayPal">💳 PayPal</option><option value="Amazon">📦 Amazon</option><option value="Gasolina">⛽ Gasolina</option><option value="Cuenta BBVA">🏦 Cuenta BBVA</option></optgroup>
                        </select>
                        <input type="date" id="in-fecha" class="w-full p-4 bg-black/40 border border-white/10 rounded-xl text-white outline-none">
                        <button type="submit" id="btn-submit" class="w-full bg-[#00e5ff] text-[#072146] font-black py-4 rounded-xl text-[10px] uppercase shadow-xl">Confirmar Operación</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-white/10 flex justify-around p-3 pb-8 z-50">
            <button onclick="switchTab('tab-cuenta', this)" class="nav-btn flex flex-col items-center gap-1 active-tab"><span class="text-xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span></button>
            <button onclick="switchTab('tab-mes', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">📋</span><span class="text-[7px] font-black uppercase">Extracto</span></button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn flex flex-col items-center gap-1 text-slate-500"><span class="text-xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span></button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let appData = [], currentPinInput = "", isPrivate = false, mainChart = null;

        let savedPin = localStorage.getItem('bbva_user_pin');
        function pressPin(n) {
            if(currentPinInput.length < 4) {
                currentPinInput += n;
                document.querySelectorAll('.pin-dot').forEach((d, i) => i < currentPinInput.length ? d.classList.add('filled') : d.classList.remove('filled'));
                if(currentPinInput.length === 4) {
                    if(!savedPin) { localStorage.setItem('bbva_user_pin', currentPinInput); savedPin = currentPinInput; unlock(); }
                    else if(currentPinInput === savedPin) unlock();
                    else { alert("PIN INCORRECTO"); clearPin(); }
                }
            }
        }
        function clearPin() { currentPinInput = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
        function deleteLast() { currentPinInput = currentPinInput.slice(0, -1); pressPin(''); }
        function unlock() { document.getElementById('pin-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }

        function togglePrivacy() { isPrivate = !isPrivate; renderApp(); }

        async function renderApp() {
            try {
                const res = await fetch(API_URL);
                appData = await res.json();
                const hoy = new Date();
                const hoyStr = hoy.toISOString().split('T')[0];
                const mesActualStr = hoy.toISOString().slice(0, 7);
                const mesSel = document.getElementById('filtroMes').value;
                let real = 0, prevision = 0, cats = {};
                const lMes = document.getElementById('listaMes'); lMes.innerHTML = '';

                appData.forEach(g => {
                    const val = parseFloat(g.importe);
                    const esIngreso = (g.categoria === "Sueldo" || g.categoria === "Otros Ingresos");
                    if (g.fecha <= hoyStr) esIngreso ? real += val : real -= val;
                    if (g.fecha.startsWith(mesActualStr)) esIngreso ? prevision += val : prevision -= val;
                    if (g.fecha.startsWith(mesSel)) {
                        if(!esIngreso) cats[g.categoria] = (cats[g.categoria]||0) + val;
                        const disp = isPrivate ? "****€" : (esIngreso?'+':'') + val.toFixed(2) + '€';
                        lMes.innerHTML += `<div class="bg-bbva-card p-4 rounded-2xl flex justify-between items-center border-l-2 ${esIngreso?'border-[#00e5ff]':'border-rose-500'}"><div class="flex-1"><p class="font-bold text-white text-sm mb-1">${g.concepto}</p><p class="text-[10px] text-slate-500 font-bold uppercase">${g.categoria}</p></div><div class="flex items-center gap-4"><p class="font-black text-lg ${esIngreso?'text-[#00e5ff]':'text-rose-400'}">${disp}</p><div class="flex gap-1"><button onclick="preEdit('${g._id}')" class="btn-edit">✏️</button><button onclick="deleteGasto('${g._id}')" class="btn-delete">🗑️</button></div></div></div>`;
                    }
                });
                document.getElementById('valReal').innerText = isPrivate ? "****€" : real.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                document.getElementById('valPrevision').innerText = isPrivate ? "****€" : prevision.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
                drawChart(cats);
            } catch (e) { console.error(e); }
        }

        function drawChart(data) {
            const ctx = document.getElementById('chartGastos').getContext('2d');
            if (mainChart) mainChart.destroy();
            const labels = Object.keys(data), values = Object.values(data);
            mainChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: ['#004481','#00e5ff','#8b5cf6','#10b981','#f59e0b','#fb7185'], borderWidth: 2, borderColor: '#072146' }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, cutout: '80%' } });
            document.getElementById('legendBox').innerHTML = labels.map((l, i) => `<div class="flex items-center justify-between p-2 bg-white/5 rounded-xl"><span class="text-[7px] font-bold text-slate-400 uppercase">${l}</span><span class="text-[8px] font-black text-white">${isPrivate ? "***" : data[l].toFixed(0)}€</span></div>`).join('');
        }

        function preEdit(id) {
            const g = appData.find(x => x._id === id);
            document.getElementById('in-id').value = g._id;
            document.getElementById('in-concepto').value = g.concepto;
            document.getElementById('in-importe').value = g.importe;
            document.getElementById('in-categoria').value = g.categoria;
            document.getElementById('in-fecha').value = g.fecha;
            document.getElementById('btn-submit').innerText = "Actualizar Registro";
            switchTab('tab-add', document.querySelectorAll('.nav-btn')[2]);
        }

        async function deleteGasto(id) {
            if(confirm("¿Seguro que quieres borrar este registro?")) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); renderApp(); }
        }

        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500')); 
            el.classList.replace('text-slate-500', 'active-tab'); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const data = { concepto: document.getElementById('in-concepto').value, importe: parseFloat(document.getElementById('in-importe').value), categoria: document.getElementById('in-categoria').value, fecha: document.getElementById('in-fecha').value };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            document.getElementById('mainForm').reset();
            document.getElementById('in-id').value = "";
            document.getElementById('btn-submit').innerText = "Confirmar Operación";
            renderApp();
            switchTab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]);
        });

        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
