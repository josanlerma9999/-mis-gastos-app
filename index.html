<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA Premium v14.7 - Math Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin:0; -webkit-tap-highlight-color: transparent; }
        
        .bg-bbva-card { background: var(--bbva-navy); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); border-radius: 2.2rem; border: 1px solid rgba(0, 229, 255, 0.2); }
        
        .progress-container { background: rgba(0,0,0,0.3); border-radius: 1rem; height: 10px; overflow: hidden; }
        .progress-bar { background: var(--bbva-cyan); height: 100%; transition: width 1s ease; box-shadow: 0 0 15px var(--bbva-cyan); }

        .future-item { background: rgba(255,255,255,0.03); border: 1px dashed rgba(0, 229, 255, 0.3); border-radius: 1.8rem; }
        .days-badge { background: rgba(0, 229, 255, 0.1); color: var(--bbva-cyan); font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 2rem; text-transform: uppercase; }

        .bbva-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem; padding: 1.1rem; width: 100%; color: white; outline: none; }
        .active-tab { color: var(--bbva-cyan) !important; border-top: 3px solid var(--bbva-cyan); }
        
        .num-btn { width: 72px; height: 72px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="pb-32">

    <div id="pin-screen" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <h1 class="text-4xl font-black italic opacity-20 mb-12 uppercase tracking-tighter">BBVA</h1>
        <div class="flex mb-16" id="pin-dots"><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div><div class="w-3 h-3 rounded-full border-2 border-cyan-400 mx-2"></div></div>
        <div class="grid grid-cols-3 gap-6" id="pin-pad"></div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-5 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-md z-50">
            <h1 class="font-black text-2xl italic tracking-tighter">BBVA</h1>
            <div class="flex gap-3">
                <button onclick="togglePrivacy()" class="w-10 h-10 bg-white/5 rounded-full border border-white/10 flex items-center justify-center text-lg">👁️</button>
                <button onclick="location.reload()" class="w-10 h-10 bg-white/5 rounded-full border border-white/10 flex items-center justify-center text-lg">🔒</button>
            </div>
        </header>

        <main class="p-4 max-w-md mx-auto space-y-6">
            
            <section id="tab-home" class="tab-content space-y-6">
                <div class="p-10 bbva-gradient text-center shadow-2xl">
                    <p class="text-[11px] font-black tracking-[0.3em] text-cyan-200/40 mb-1 uppercase">Saldo Real Hoy</p>
                    <h2 id="valReal" class="text-6xl font-black tracking-tighter">0.00€</h2>
                    <div class="mt-10 space-y-2 text-left">
                        <div class="flex justify-between text-[11px] font-black uppercase text-cyan-300/70">
                            <span>Consumo del mes</span> <span id="pctText">0%</span>
                        </div>
                        <div class="progress-container"><div id="progBar" class="progress-bar" style="width: 0%"></div></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-bbva-card p-6 border-white/5">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">Cierre Mes</p>
                        <p id="valProj" class="text-3xl font-black text-cyan-400 mt-1">0.00€</p>
                    </div>
                    <div class="bg-bbva-card p-6 border-white/5">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">A Pagar</p>
                        <p id="valPend" class="text-3xl font-black text-rose-400 mt-1">0.00€</p>
                    </div>
                </div>
            </section>

            <section id="tab-futuro" class="tab-content hidden space-y-4">
                <h3 class="text-xs font-black uppercase text-cyan-400 italic px-2 tracking-widest">Gastos Futuros</h3>
                <div id="listaFuturo" class="space-y-4"></div>
            </section>

            <section id="tab-lista" class="tab-content hidden space-y-3">
                <input type="month" id="filtroMes" class="bg-bbva-card w-full p-4 text-white font-black uppercase text-xs outline-none" onchange="renderApp()">
                <div id="listaPasado" class="space-y-3"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <form id="mainForm" class="bg-bbva-card p-8 space-y-5">
                    <input type="text" id="in-concepto" placeholder="Concepto" class="bbva-input" required>
                    <input type="number" id="in-importe" step="0.01" placeholder="0.00" class="bbva-input text-4xl font-black text-center" required>
                    <select id="in-categoria" class="bbva-input font-bold">
                        <option value="Sueldo">💰 Sueldo</option>
                        <option value="Tarjeta Aqua BBVA">🟦 Tarjeta Aqua</option>
                        <option value="Amazon">📦 Amazon</option>
                        <option value="Gasolina">⛽ Gasolina</option>
                        <option value="Suministros">🏠 Suministros</option>
                    </select>
                    <input type="date" id="in-fecha" class="bbva-input">
                    <button type="submit" class="w-full bg-cyan-400 text-black font-black py-5 rounded-2xl uppercase text-[11px] shadow-lg">Confirmar</button>
                </form>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-xl border-t border-white/10 flex justify-around p-4 pb-10 z-50">
            <button onclick="switchTab('tab-home', this)" class="nav-btn active-tab flex flex-col items-center gap-1 flex-1">
                <span class="text-2xl">🏦</span><span class="text-[7px] font-black uppercase">Global</span>
            </button>
            <button onclick="switchTab('tab-futuro', this)" class="nav-btn text-slate-500 flex flex-col items-center gap-1 flex-1">
                <span class="text-2xl">⏳</span><span class="text-[7px] font-black uppercase">Próximos</span>
            </button>
            <button onclick="switchTab('tab-lista', this)" class="nav-btn text-slate-500 flex flex-col items-center gap-1 flex-1">
                <span class="text-2xl">📋</span><span class="text-[7px] font-black uppercase">Extracto</span>
            </button>
            <button onclick="switchTab('tab-add', this)" class="nav-btn text-slate-500 flex flex-col items-center gap-1 flex-1">
                <span class="text-2xl">➕</span><span class="text-[7px] font-black uppercase">Operar</span>
            </button>
        </nav>
    </div>

    <script>
        const API_URL = 'https://mis-gastos-app.onrender.com/api/gastos';
        let pin = "", isPrivate = false;

        // PIN PAD
        [1,2,3,4,5,6,7,8,9,'C',0,'DEL'].forEach(v => {
            const b = document.createElement('button'); b.className = "num-btn"; b.innerText = v;
            b.onclick = () => {
                if(v === 'C') pin = ""; else if(v === 'DEL') pin = pin.slice(0,-1); else if(pin.length < 4) pin += v;
                document.querySelectorAll('#pin-dots div').forEach((d, i) => d.style.background = i < pin.length ? '#00e5ff' : 'transparent');
                if(pin === "1234") { document.getElementById('pin-screen').remove(); document.getElementById('app-content').classList.remove('hidden'); renderApp(); }
            };
            document.getElementById('pin-pad').appendChild(b);
        });

        async function renderApp() {
            const res = await fetch(API_URL); const data = await res.json();
            const hoy = new Date().toISOString().split('T')[0];
            const mesSel = document.getElementById('filtroMes').value;

            // VARIABLES DE CÁLCULO
            let saldoReal = 0;      // Movimientos <= hoy
            let gastosFuturos = 0;  // Gastos > hoy
            let ingresosFuturos = 0;// Ingresos > hoy
            let gastoMesActual = 0; // Gastos <= hoy del mes en curso
            let ingresoMesActual = 0;// Ingresos <= hoy del mes en curso

            document.getElementById('listaPasado').innerHTML = '';
            document.getElementById('listaFuturo').innerHTML = '';

            data.sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(g => {
                const val = parseFloat(g.importe);
                const esIngreso = (g.categoria === "Sueldo");
                const esPasado = (g.fecha <= hoy);
                const disp = isPrivate ? "****€" : val.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";

                // 1. CALCULAR SALDO REAL (Lo que ya ha pasado)
                if(esPasado) {
                    esIngreso ? saldoReal += val : saldoReal -= val;
                    // Para la barra de progreso (solo mes actual pasado)
                    if(g.fecha.startsWith(new Date().toISOString().slice(0, 7))) {
                        esIngreso ? ingresoMesActual += val : gastoMesActual += val;
                    }
                } else {
                    // 2. CALCULAR FUTURO
                    esIngreso ? ingresosFuturos += val : gastosFuturos += val;
                }

                // RENDER LISTA EXTRACTO (POR MES)
                if(g.fecha.startsWith(mesSel)) {
                    document.getElementById('listaPasado').insertAdjacentHTML('afterbegin', `
                        <div class="bg-bbva-card p-5 flex justify-between items-center ${!esPasado ? 'opacity-30' : ''}">
                            <div><p class="text-sm font-bold text-white">${g.concepto}</p><p class="text-[9px] text-slate-500 font-bold uppercase">${g.fecha}</p></div>
                            <p class="text-lg font-black ${esIngreso ? 'text-cyan-400' : 'text-white'}">${disp}</p>
                        </div>`);
                }

                // RENDER LISTA PRÓXIMOS
                if(!esPasado) {
                    const dias = Math.ceil((new Date(g.fecha) - new Date()) / 864e5);
                    document.getElementById('listaFuturo').innerHTML += `
                        <div class="future-item p-6">
                            <div class="flex justify-between items-start mb-4">
                                <div><p class="text-base font-black">${g.concepto}</p><p class="text-[10px] text-slate-500 uppercase">${g.categoria}</p></div>
                                <span class="days-badge">En ${dias} días</span>
                            </div>
                            <div class="flex justify-between items-end border-t border-white/5 pt-4">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${g.fecha}</span>
                                <span class="text-2xl font-black">${disp}</span>
                            </div>
                        </div>`;
                }
            });

            // 3. ASIGNAR VALORES A PANTALLA
            document.getElementById('valReal').innerText = isPrivate ? "****€" : saldoReal.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
            document.getElementById('valPend').innerText = isPrivate ? "****€" : "-" + gastosFuturos.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
            
            // Cierre estimado = Saldo ahora - lo que voy a pagar + lo que voy a cobrar
            const cierreMes = saldoReal - gastosFuturos + ingresosFuturos;
            document.getElementById('valProj').innerText = isPrivate ? "****€" : cierreMes.toLocaleString('de-DE', {minimumFractionDigits: 2}) + "€";
            
            // Barra de progreso: ¿Qué % del ingreso ya nos hemos gastado?
            const pct = ingresoMesActual > 0 ? (gastoMesActual / ingresoMesActual) * 100 : 0;
            document.getElementById('progBar').style.width = Math.min(pct, 100) + "%";
            document.getElementById('pctText').innerText = Math.round(pct) + "%";
        }

        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500'));
            el.classList.replace('text-slate-500', 'active-tab'); document.getElementById(id).classList.remove('hidden');
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = { 
                concepto: document.getElementById('in-concepto').value, 
                importe: parseFloat(document.getElementById('in-importe').value), 
                categoria: document.getElementById('in-categoria').value, 
                fecha: document.getElementById('in-fecha').value 
            };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
            e.target.reset(); renderApp(); switchTab('tab-home', document.querySelectorAll('.nav-btn')[0]);
        };

        function togglePrivacy() { isPrivate = !isPrivate; renderApp(); }
        document.getElementById('filtroMes').value = new Date().toISOString().slice(0, 7);
        document.getElementById('in-fecha').valueAsDate = new Date();
    </script>
</body>
</html>
