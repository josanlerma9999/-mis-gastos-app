<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBVA 10.6 Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bbva-navy: #072146; --bbva-blue: #004481; --bbva-cyan: #00e5ff; }
        
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin:0; height: 100vh; overflow: hidden; }

        /* PIN MEJORADO */
        #pin-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .num-btn { width: 80px; height: 80px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); font-size: 1.8rem; font-weight: 900; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); }
        .num-btn:active { background: var(--bbva-cyan); color: #000; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--bbva-cyan); margin: 0 10px; }
        .pin-dot.filled { background: var(--bbva-cyan); }

        /* SCROLL Y CONTENEDORES (De borde a borde como tus fotos) */
        .main-container { height: calc(100vh - 80px); overflow-y: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        .tab-content { width: 100%; padding-bottom: 100px; }
        .bg-bbva-card { background-color: var(--bbva-navy); width: 100%; border-bottom: 1px solid rgba(0, 229, 255, 0.1); }
        .bbva-gradient { background: linear-gradient(135deg, #072146 0%, #004481 100%); width: 100%; }

        nav { height: 80px; background: #000; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; }
        .active-tab { color: var(--bbva-cyan); border-top: 3px solid var(--bbva-cyan); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="mb-10 italic font-[900] text-[#00e5ff] text-4xl uppercase">BBVA</div>
        <div class="flex mb-12" id="dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div class="grid grid-cols-3 gap-6">
            <button onclick="p('1')" class="num-btn">1</button><button onclick="p('2')" class="num-btn">2</button><button onclick="p('3')" class="num-btn">3</button>
            <button onclick="p('4')" class="num-btn">4</button><button onclick="p('5')" class="num-btn">5</button><button onclick="p('6')" class="num-btn">6</button>
            <button onclick="p('7')" class="num-btn">7</button><button onclick="p('8')" class="num-btn">8</button><button onclick="p('9')" class="num-btn">9</button>
            <button onclick="location.reload()" class="text-[10px] opacity-30 font-bold uppercase">Reset</button><button onclick="p('0')" class="num-btn">0</button><button onclick="del()" class="text-[10px] opacity-30 font-bold uppercase">Borrar</button>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header class="p-4 flex justify-between items-center bg-black sticky top-0 z-50">
            <div class="flex flex-col">
                <h1 class="font-[900] text-2xl italic tracking-tighter">BBVA</h1>
                <span class="text-[10px] text-cyan-400 font-black uppercase mt-1">v10.6 MASTER</span>
            </div>
            <div class="flex gap-4">
                <button onclick="togglePrivacy()" id="eye" class="text-2xl">👁️</button>
                <button onclick="location.reload()" class="opacity-20 text-2xl">🔒</button>
            </div>
        </header>

        <main class="main-container">
            <section id="tab-cuenta" class="tab-content">
                <div class="p-12 text-center bbva-gradient rounded-b-[3rem] shadow-xl">
                    <p class="text-[11px] uppercase tracking-widest text-white/40 mb-2 font-bold">Patrimonio Global</p>
                    <h2 id="valReal" class="text-6xl font-[900] tracking-tighter italic">****€</h2>
                </div>
                <div class="bg-bbva-card p-6 mt-2 rounded-[2rem]">
                    <div style="height:250px;"><canvas id="chart"></canvas></div>
                    <div id="legends" class="grid grid-cols-2 gap-3 mt-6"></div>
                </div>
            </section>

            <section id="tab-mes" class="tab-content hidden p-4 space-y-3">
                <div id="lista" class="space-y-3"></div>
            </section>

            <section id="tab-add" class="tab-content hidden">
                <div class="bg-bbva-card p-8 rounded-b-[3rem] border-b-4 border-cyan-400">
                    <form id="f" class="space-y-5">
                        <input type="hidden" id="in-id">
                        <input type="text" id="c" placeholder="Concepto" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl text-white outline-none">
                        <input type="number" id="i" step="0.01" placeholder="0.00" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl font-[900] text-5xl text-center outline-none">
                        <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/10">
                            <span class="text-xs font-bold text-slate-400 uppercase italic">¿Pago Recurrente?</span>
                            <input type="checkbox" id="r" class="w-6 h-6 accent-cyan-400">
                        </div>
                        <select id="cat" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl font-bold">
                            <option value="Sueldo">💰 Sueldo</option>
                            <option value="Tarjeta BBVA">🟦 Tarjeta BBVA</option>
                            <option value="Amazon">📦 Amazon</option>
                        </select>
                        <input type="date" id="d" class="w-full p-5 bg-black/40 border border-white/10 rounded-2xl font-bold text-center">
                        <button type="submit" class="w-full bg-cyan-400 text-[#072146] font-[900] py-6 rounded-2xl uppercase tracking-widest mt-2">Confirmar</button>
                    </form>
                </div>
            </section>
        </main>

        <nav>
            <button onclick="tab('tab-cuenta', this)" class="nav-btn flex flex-col items-center active-tab"><span class="text-3xl">🏦</span><span class="text-[8px] font-black mt-1">GLOBAL</span></button>
            <button onclick="tab('tab-mes', this)" class="nav-btn flex flex-col items-center text-slate-500"><span class="text-3xl">📋</span><span class="text-[8px] font-black mt-1">LISTA</span></button>
            <button onclick="tab('tab-add', this)" class="nav-btn flex flex-col items-center text-slate-500"><span class="text-3xl">➕</span><span class="text-[8px] font-black mt-1">OPERAR</span></button>
        </nav>
    </div>

    <script>
        const API = 'https://mis-gastos-app.onrender.com/api/gastos';
        let data = [], pin = "", isPriv = true, chart = null;

        function p(n) {
            if(pin.length < 4) {
                pin += n;
                document.querySelectorAll('.pin-dot')[pin.length-1].classList.add('filled');
                if(pin.length === 4) {
                    if(pin === "1234") {
                        document.getElementById('pin-screen').classList.add('hidden');
                        document.getElementById('app-content').classList.remove('hidden');
                        render();
                    } else { alert("PIN Erróneo"); pin = ""; document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled')); }
                }
            }
        }
        function del() { pin = pin.slice(0,-1); document.querySelectorAll('.pin-dot')[pin.length].classList.remove('filled'); }

        async function render() {
            try {
                const res = await fetch(API); data = await res.json();
                let t = 0, cs = {};
                const l = document.getElementById('lista'); l.innerHTML = '';
                data.forEach(g => {
                    const v = parseFloat(g.importe); const isI = g.categoria === "Sueldo";
                    t += isI ? v : -v; if(!isI) cs[g.categoria] = (cs[g.categoria]||0) + v;
                    l.innerHTML += `<div class="bg-bbva-card p-5 flex justify-between items-center border-l-8 ${isI?'border-cyan-400':'border-rose-500'} rounded-xl mb-2">
                        <div><p class="font-[900] text-lg">${g.concepto}</p><p class="text-[10px] text-slate-500 uppercase">${g.fecha}</p></div>
                        <div class="flex items-center gap-4"><p class="font-[900] text-xl ${isI?'text-cyan-400':'text-rose-500'}">${isPriv?'****':v.toFixed(2)}€</p>
                        <button onclick="preEdit('${g._id}')">✏️</button></div></div>`;
                });
                document.getElementById('valReal').innerText = isPriv ? "****€" : t.toLocaleString('de-DE') + "€";
                draw(cs);
            } catch (e) {}
        }

        function draw(d) {
            const ctx = document.getElementById('chart').getContext('2d');
            if(chart) chart.destroy();
            const keys = Object.keys(d);
            chart = new Chart(ctx, { type:'doughnut', data:{ labels:keys, datasets:[{data:Object.values(d), backgroundColor:['#00e5ff','#004481','#8b5cf6','#10b981','#f59e0b'], borderWidth:0}]}, options:{plugins:{legend:{display:false}}, maintainAspectRatio:false, cutout:'82%'}});
            document.getElementById('legends').innerHTML = keys.map((k, i) => `<div class="bg-white/5 p-3 rounded-xl flex justify-between items-center border border-white/5 truncate"><div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full" style="background:${['#00e5ff','#004481','#8b5cf6','#10b981','#f59e0b'][i]}"></div><span class="text-[9px] font-black uppercase text-slate-400 truncate w-16">${k}</span></div><span class="text-[10px] font-black text-white">${isPriv?'***':d[k].toFixed(0)}€</span></div>`).join('');
        }

        function tab(id, el) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('active-tab', 'text-slate-500'));
            el.classList.replace('text-slate-500', 'active-tab');
            document.getElementById(id).classList.remove('hidden');
        }

        function togglePrivacy() { isPriv = !isPriv; document.getElementById('eye').innerText = isPriv ? '👁️' : '🙈'; render(); }
        
        document.getElementById('f').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('in-id').value;
            const body = { concepto: document.getElementById('c').value, importe: parseFloat(document.getElementById('i').value), categoria: document.getElementById('cat').value, fecha: document.getElementById('d').value };
            await fetch(id ? `${API}/${id}` : API, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            document.getElementById('f').reset();
            tab('tab-cuenta', document.querySelectorAll('.nav-btn')[0]); render();
        });

        document.getElementById('d').valueAsDate = new Date();
    </script>
</body>
</html>
